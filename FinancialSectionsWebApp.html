<!doctype html>
<html lang="ru">
<head>
  <base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>PrihRashOnline — Финансовая аналитика</title>
  <style>
    :root{--bg:#f4f7fb;--surface:#fff;--soft:#eef4fa;--text:#10233f;--muted:#60738b;--line:#d7e0ea;--brand:#0b6570;--link:#1558b0;--good:#18794e;--bad:#a1263d;color-scheme:light}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1220;--surface:#111b2c;--soft:#162338;--text:#f3f7fc;--muted:#aebdd0;--line:#33445d;--brand:#34b5b0;--link:#8fc5ff;--good:#80d7a5;--bad:#ff9daf;color-scheme:dark}}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}button,select{font:inherit}.hero{padding:23px clamp(16px,3vw,44px);background:linear-gradient(120deg,#061d37,#0b4f78);color:#fff}.hero-inner,.main{max-width:1500px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.11em;text-transform:uppercase;opacity:.72}.hero h1{margin:4px 0;font-size:clamp(27px,3vw,42px)}.hero p{margin:0;opacity:.82}
    .main{padding:18px clamp(12px,2.5vw,32px) 40px}.toolbar{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr)) auto;gap:9px;align-items:end;padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}label{display:grid;gap:4px;color:var(--muted);font-size:12px;font-weight:700}select{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:7px}.btn{min-height:40px;border:0;border-radius:999px;padding:8px 14px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer}.status{margin:13px 0;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--soft);color:var(--muted)}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.card,.panel{border:1px solid var(--line);border-radius:15px;background:var(--surface)}.card{padding:15px}.label{font-weight:800;color:var(--muted)}.value{margin-top:7px;font-size:clamp(23px,2.4vw,33px);font-weight:850}.positive{color:var(--good)}.negative{color:var(--bad)}.meta{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin-top:12px}.panel{padding:15px;min-width:0}.wide{grid-column:1/-1}.head{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}.head h2{margin:0;font-size:18px}.badge{font-size:10px;font-weight:800;color:var(--link);background:var(--soft);padding:4px 7px;border-radius:999px}
    .trend{display:grid;grid-template-columns:repeat(auto-fit,minmax(5px,1fr));align-items:end;gap:2px;height:210px;padding:8px;border:1px solid var(--line);border-radius:11px;background:var(--soft)}.bar{min-height:2px;border-radius:4px 4px 0 0;background:var(--brand)}.bar.positive{background:var(--good)}.bar.negative{background:var(--bad)}.rows{display:grid;gap:7px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}.row-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drill{color:var(--link);font-weight:800;text-decoration:none}.truth{margin-top:13px;color:var(--muted);font-size:12px}.hidden{display:none!important}
    @media(max-width:900px){.toolbar{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:620px){.toolbar,.summary{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.drill{grid-column:1/-1}.trend{height:170px}}
  </style>
</head>
<body data-private-runtime="READ_ONLY" data-financial-authority="CANONICAL_FIN_TRUTH" data-back-forward="IN_PAGE_HISTORY_REFETCH" data-warm-fin-navigation="IN_PAGE_MEMORY_ONLY" data-filter-navigation="IN_PAGE_RPC_STATE">
<header class="hero"><div class="hero-inner"><div class="eyebrow">PrihRashOnline • Семейная аналитика</div><h1 id="page-title">Финансовый раздел</h1><p id="page-subtitle">Загружаем реальные данные…</p></div></header>
<main class="main">
  <form class="toolbar" id="filters" method="get">
    <input type="hidden" name="surface" id="surface-field"><input type="hidden" name="privacy" id="privacy-field">
    <label>Период<select name="window_days" id="window-days"><option value="30">30 дней</option><option value="90">90 дней</option><option value="180">180 дней</option><option value="365">365 дней</option></select></label>
    <label>Счёт<select name="account_id" id="account-filter"></select></label><label>Категория<select name="category_id" id="category-filter"></select></label><label>Член семьи<select name="member_id" id="member-filter"></select></label><button class="btn" type="submit">Применить</button>
  </form>
  <div class="status" id="status">Получаем актуальные данные…</div><section class="summary hidden" id="summary"></section>
  <section class="grid hidden" id="details"><article class="panel"><div class="head"><h2 id="trend-title">Динамика</h2><span class="badge">FIN-TRUTH</span></div><div class="trend" id="trend"></div></article><article class="panel"><div class="head"><h2 id="primary-title">Структура</h2><span class="badge">Детали</span></div><div class="rows" id="primary-rows"></div></article><article class="panel wide"><div class="head"><h2 id="secondary-title">Сравнение</h2><span class="badge">Равный период</span></div><div class="rows" id="secondary-rows"></div></article></section>
  <div class="truth" id="truth">Только чтение. Финансовые итоги приходят из FIN-TRUTH.</div>
</main>
<script>
(function(){
  'use strict';
  var TITLES={expenses:['Расходы','Структура, динамика и причины изменения расходов'],income:['Доходы','Источники, динамика и устойчивость доходов'],'cash-flow':['Денежный поток','Приток, отток и чистый результат']};
  var payload=null;
  var cache={};
  var staged={};
  var inflight={};
  var baseRevision='';
  var initialSection='';
  var activeSection='';
  var generation=0;
  function query(){return new URLSearchParams(window.location.search);}
  function querySurface(){var value=query().get('surface');return TITLES[value]?value:'';}
  function shellSurface(){var shell=document.getElementById('prh-r2-shell');var value=shell&&shell.dataset?String(shell.dataset.activeSurface||''):'';return TITLES[value]?value:'';}
  function surface(){return activeSection||querySurface()||shellSurface()||'expenses';}
  initialSection=querySurface()||shellSurface()||'expenses';
  activeSection=initialSection;
  function setText(id,value){document.getElementById(id).textContent=String(value==null?'':value);}
  function clear(node){while(node.firstChild)node.removeChild(node.firstChild);}
  function money(value){if(value==null)return '—';return new Intl.NumberFormat('ru-RU',{style:'currency',currency:payload&&payload.currency||'RUB',maximumFractionDigits:2}).format(Number(value)/100);}
  function prefetchEligible(){var q=query();var days=q.get('window_days');return !q.get('account_id')&&!q.get('category_id')&&!q.get('member_id')&&(!days||days==='90');}
  function requestFor(section,expectedRevision){var q=query();var result={privacy_mode:String(q.get('privacy')||'NORMAL').toUpperCase(),section:section,window_days:Number(q.get('window_days')||90),filters:{account_ids:q.get('account_id')?[q.get('account_id')]:[],category_ids:q.get('category_id')?[q.get('category_id')]:[],member_ids:q.get('member_id')?[q.get('member_id')]:[]}};if(expectedRevision)result.expected_revision=expectedRevision;return result;}
  function filterStateFromForm(){var days=String(document.getElementById('window-days').value||'90');if(['30','90','180','365'].indexOf(days)<0)days='90';return{window_days:days,account_id:String(document.getElementById('account-filter').value||''),category_id:String(document.getElementById('category-filter').value||''),member_id:String(document.getElementById('member-filter').value||''),privacy:String(document.getElementById('privacy-field').value||query().get('privacy')||'NORMAL').toUpperCase()};}
  function applyFilterState(state,historyMode){var q=query();q.set('surface',surface());q.set('privacy',state.privacy);q.set('window_days',state.window_days);['account_id','category_id','member_id'].forEach(function(key){if(state[key])q.set(key,state[key]);else q.delete(key);});var url='?'+q.toString();try{if(historyMode==='replace')history.replaceState({prhFin:true,section:surface(),filters:true},'',url);else history.pushState({prhFin:true,section:surface(),filters:true},'',url);return true;}catch(_){return false;}}
  function resetRuntimeState(){generation+=1;cache={};staged={};inflight={};baseRevision='';markPrefetchReady();}
  function validRevision(value){return /^[0-9a-f]{64}$/.test(String(value||''));}
  function remember(section,result,setBase){if(!result||result.section!==section)return false;var revision=String(result.snapshot_revision||'');if(validRevision(revision)){if(baseRevision&&revision!==baseRevision)return false;if(setBase&&!baseRevision)baseRevision=revision;}cache[section]=result;markPrefetchReady();return true;}
  function markPrefetchReady(){var ready=Object.keys(TITLES).every(function(section){return !!cache[section];});document.documentElement.setAttribute('data-fin-prefetch-ready',ready?'1':'0');}
  function syncShell(){var active=surface();var shell=document.getElementById('prh-r2-shell');if(shell)shell.dataset.activeSurface=active;document.querySelectorAll('#prh-r2-shell a[data-r2-nav]').forEach(function(link){if(link.dataset.r2Nav===active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');});}
  function renderTitle(){var item=TITLES[surface()];setText('page-title',item[0]);setText('page-subtitle',item[1]);document.getElementById('surface-field').value=surface();document.getElementById('privacy-field').value=String(query().get('privacy')||'NORMAL').toUpperCase();syncShell();}
  function fillSelect(id,items,selected,emptyLabel){var select=document.getElementById(id);clear(select);var empty=document.createElement('option');empty.value='';empty.textContent=emptyLabel;select.appendChild(empty);items.forEach(function(item){var option=document.createElement('option');option.value=item.value;option.textContent=item.label;option.selected=item.value===selected;select.appendChild(option);});}
  function renderFilters(){if(!payload||!payload.filters)return;var selected=payload.filters.selected||{};document.getElementById('window-days').value=String(payload.window_days);fillSelect('account-filter',payload.filters.options.accounts,(selected.account_ids||[])[0]||'','Все счета');fillSelect('category-filter',payload.filters.options.categories,(selected.category_ids||[])[0]||'','Все категории');fillSelect('member-filter',payload.filters.options.members,(selected.member_ids||[])[0]||'','Все');}
  function periodText(){return payload.period.start+' — '+payload.period.end;}
  function addCard(label,value,className,note){var card=document.createElement('article');card.className='card';var labelNode=document.createElement('div');labelNode.className='label';labelNode.textContent=label;var valueNode=document.createElement('div');valueNode.className='value '+(className||'');valueNode.textContent=value;var meta=document.createElement('div');meta.className='meta';meta.textContent=note||periodText();card.appendChild(labelNode);card.appendChild(valueNode);card.appendChild(meta);document.getElementById('summary').appendChild(card);}
  function deltaClass(value,positiveIsGood){if(Number(value)===0)return '';return (Number(value)>0)===positiveIsGood?'positive':'negative';}
  function renderTrend(points,key){var host=document.getElementById('trend');clear(host);if(!points||points.length<2){var note=document.createElement('div');note.className='meta';note.textContent='Недостаточно истории для динамики.';host.appendChild(note);return;}var max=1;points.forEach(function(point){max=Math.max(max,Math.abs(Number(point[key])||0));});points.forEach(function(point){var value=Number(point[key])||0;var bar=document.createElement('div');bar.className='bar '+(value<0?'negative':value>0?'positive':'');bar.style.height=Math.max(2,Math.round(Math.abs(value)/max*100))+'%';bar.title=point.time_bucket;host.appendChild(bar);});}
  function drillHref(categoryId){var q=query();q.set('surface','transactions');q.set('date_from',payload.period.start);q.set('date_to',payload.period.end);q.set('revision',payload.snapshot_revision);if(categoryId)q.set('category_id',categoryId);q.delete('window_days');return '?'+q.toString();}
  function addRow(host,label,value,categoryId,showDrill){var row=document.createElement('div');row.className='row';var name=document.createElement('span');name.className='row-name';name.textContent=label;var amount=document.createElement('span');amount.textContent=money(value);row.appendChild(name);row.appendChild(amount);if(showDrill){var link=document.createElement('a');link.className='drill';link.href=drillHref(categoryId);link.textContent='Операции';row.appendChild(link);}host.appendChild(row);}
  function renderRows(hostId,items,labelKey,valueKey,idKey){var host=document.getElementById(hostId);clear(host);if(!items.length){var note=document.createElement('div');note.className='status';note.textContent='Нет данных для этого разреза.';host.appendChild(note);return;}items.slice(0,12).forEach(function(item){addRow(host,item[labelKey],item[valueKey],item[idKey],true);});}
  function expenses(){var view=payload.expenses;setText('trend-title','Динамика расходов');setText('primary-title','Категории');setText('secondary-title','Что изменилось');addCard('Расходы',money(view.total_expense_minor),'');addCard('Предыдущий период',money(view.comparison_expense_minor),'');addCard('Изменение',money(view.delta_minor),deltaClass(view.delta_minor,false));renderTrend(view.trend,'expense_minor');renderRows('primary-rows',view.category_mix,'category_label','expense_minor','category_id');renderRows('secondary-rows',view.drivers,'category_label','delta_minor','category_id');}
  function income(){var view=payload.income;setText('trend-title','Динамика доходов');setText('primary-title','Источники');setText('secondary-title','Изменение источников');var score=view.stability&&view.stability.stability_score!=null?'Устойчивость: '+view.stability.stability_score+' / 100':'';addCard('Доходы',money(view.total_income_minor),'');addCard('Предыдущий период',money(view.comparison_income_minor),'');addCard('Изменение',money(view.delta_minor),deltaClass(view.delta_minor,true),score);renderTrend(view.trend,'income_minor');renderRows('primary-rows',view.source_mix,'source_label','income_minor','source_id');renderRows('secondary-rows',view.source_deltas,'source_label','delta_minor','source_id');}
  function cashFlow(){var view=payload.cash_flow;setText('trend-title','Динамика чистого потока');setText('primary-title','Предыдущий период');setText('secondary-title','Переход к операциям');addCard('Приток',money(view.inflow_minor),'positive');addCard('Отток',money(view.outflow_minor),'negative');addCard('Чистый поток',money(view.net_minor),deltaClass(view.net_minor,true));renderTrend(view.trend,'net_minor');var primary=document.getElementById('primary-rows');clear(primary);addRow(primary,'Приток',view.comparison.inflow_minor,null,false);addRow(primary,'Отток',view.comparison.outflow_minor,null,false);addRow(primary,'Чистый поток',view.comparison.net_minor,null,false);var secondary=document.getElementById('secondary-rows');clear(secondary);var link=document.createElement('a');link.className='drill';link.href=drillHref(null);link.textContent='Открыть операции за период →';secondary.appendChild(link);}
  function hideDetails(){document.getElementById('summary').classList.add('hidden');document.getElementById('details').classList.add('hidden');}
  function render(){renderTitle();renderFilters();hideDetails();if(!payload){setText('status','Получаем актуальные данные…');return;}if(payload.state==='MASKED'){setText('status','Режим MASKED: суммы и частные подписи скрыты.');return;}if(payload.state==='EMPTY'){setText('status','В источнике пока нет операций.');return;}if(payload.state==='EMPTY_FILTER_RESULT'){setText('status','По выбранным фильтрам операций нет.');return;}if(payload.state!=='READY'||payload.section!==surface()){setText('status','Данные временно недоступны. Повторите загрузку.');return;}setText('status','Период: '+periodText());clear(document.getElementById('summary'));document.getElementById('summary').classList.remove('hidden');document.getElementById('details').classList.remove('hidden');if(surface()==='expenses')expenses();else if(surface()==='income')income();else cashFlow();setText('truth','FIN-TRUTH-v1 · один снимок данных · только чтение · ревизия '+payload.snapshot_revision_prefix);}
  function failed(){hideDetails();setText('status','Не удалось получить данные. Повторите загрузку.');}
  function fetchSection(section,expectedRevision,onSuccess,onFailure){var waiter={success:onSuccess||function(){},failure:onFailure||function(){}};var existing=inflight[section];if(existing&&existing.generation===generation){existing.waiters.push(waiter);return;}var entry={expected_revision:expectedRevision||'',waiters:[waiter],generation:generation};inflight[section]=entry;google.script.run.withSuccessHandler(function(result){if(entry.generation!==generation)return;var current=inflight[section]||entry;if(current!==entry)return;delete inflight[section];current.waiters.slice().forEach(function(item){try{item.success(result);}catch(_){try{item.failure();}catch(__){}}});}).withFailureHandler(function(){if(entry.generation!==generation)return;var current=inflight[section]||entry;if(current!==entry)return;delete inflight[section];current.waiters.slice().forEach(function(item){try{item.failure();}catch(_){}});}).prhR2FetchFinancialSectionsPayload(requestFor(section,expectedRevision));}
  function adoptOrRefetch(section,result){if(remember(section,result,false))return;if(!baseRevision)return;fetchSection(section,baseRevision,function(exact){remember(section,exact,false);},function(){});}
  function prefetch(section){if(cache[section]||inflight[section])return;fetchSection(section,baseRevision,function(result){if(baseRevision)adoptOrRefetch(section,result);else staged[section]=result;},function(){});}
  function adoptStaged(){Object.keys(staged).forEach(function(section){var result=staged[section];delete staged[section];adoptOrRefetch(section,result);});}
  function acceptActive(section,result){if(result&&result.state==='STALE_SNAPSHOT'){resetRuntimeState();fetchSection(section,'',function(fresh){if(!remember(section,fresh,true)){failed();return;}payload=fresh;render();},failed);return;}if(remember(section,result,false)){if(!baseRevision&&validRevision(result&&result.snapshot_revision))baseRevision=result.snapshot_revision;payload=result;render();return;}if(baseRevision){fetchSection(section,baseRevision,function(exact){if(!remember(section,exact,false)){failed();return;}payload=exact;render();},failed);return;}failed();}
  function activate(section){activeSection=section;renderTitle();if(cache[section]){payload=cache[section];render();document.documentElement.setAttribute('data-fin-warm-route','1');return;}document.documentElement.setAttribute('data-fin-warm-route','0');payload=null;hideDetails();setText('status','Получаем актуальные данные…');fetchSection(section,baseRevision,function(result){acceptActive(section,result);},failed);}
  function fallbackNavigate(href){try{window.top.location.href=href;}catch(_){window.location.href=href;}}
  function warmNavigate(event){var target=event.target&&event.target.closest?event.target.closest('#prh-r2-shell a[data-r2-nav]'):null;if(!target)return;var href=target.getAttribute('href')||'';var url;try{url=new URL(href,window.location.href);}catch(_){return;}var next=url.searchParams.get('surface');if(!TITLES[next])return;if(next===surface()){event.preventDefault();return;}event.preventDefault();var q=query();q.set('surface',next);activeSection=next;try{history.pushState({prhFin:true,section:next},'','?'+q.toString());}catch(_){fallbackNavigate(href);return;}activate(next);}
  function filterSubmit(event){event.preventDefault();var state=filterStateFromForm();if(!applyFilterState(state,'push')){setText('status','Не удалось применить фильтры. Повторите попытку.');return;}resetRuntimeState();payload=null;hideDetails();setText('status','Применяем фильтры…');document.documentElement.setAttribute('data-fin-filter-ready','0');var current=surface();fetchSection(current,'',function(result){if(!remember(current,result,true)){failed();return;}payload=result;render();document.documentElement.setAttribute('data-fin-filter-ready','1');if(prefetchEligible())Object.keys(TITLES).forEach(function(section){if(section!==current)prefetch(section);});},failed);}
  function load(){renderTitle();hideDetails();setText('status','Получаем актуальные данные…');document.documentElement.setAttribute('data-fin-prefetch-ready','0');document.documentElement.setAttribute('data-fin-filter-ready','0');var current=surface();fetchSection(current,'',function(result){if(!remember(current,result,true)){failed();return;}payload=result;render();document.documentElement.setAttribute('data-fin-initial-ready','1');adoptStaged();if(prefetchEligible())Object.keys(TITLES).forEach(function(section){if(section!==current)prefetch(section);});},failed);if(prefetchEligible())setTimeout(function(){Object.keys(TITLES).forEach(function(section){if(section!==current)prefetch(section);});},250);}
  try{history.replaceState({prhFin:true,section:initialSection},'',window.location.href);}catch(_){}
  document.addEventListener('click',warmNavigate,true);
  document.getElementById('filters').addEventListener('submit',filterSubmit);
  window.addEventListener('popstate',function(){activeSection=querySurface()||initialSection;resetRuntimeState();payload=null;activate(activeSection);});
  renderTitle();load();
})();
</script>
</body>
</html>
