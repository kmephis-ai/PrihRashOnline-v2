<style data-prh-local-first-planning-extension="1.0.0">
  .lf-plan-shell{display:grid;gap:14px}.lf-plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.lf-plan-card,.lf-plan-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);min-width:0}.lf-plan-card strong{display:block;font-size:clamp(20px,3vw,30px);margin-top:5px;overflow-wrap:anywhere}.lf-plan-muted{color:var(--muted);font-size:13px}.lf-plan-status{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2);color:var(--muted)}.lf-plan-status[data-state="READY"]{color:var(--ok)}.lf-plan-status[data-state="SETUP_REQUIRED"],.lf-plan-status[data-state="UNAVAILABLE"]{color:var(--warn)}.lf-plan-actions{display:flex;gap:8px;flex-wrap:wrap}.lf-plan-table{width:100%;border-collapse:collapse}.lf-plan-table th,.lf-plan-table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.lf-plan-table th{color:var(--muted);font-size:12px}.lf-plan-list{display:grid;gap:9px}.lf-plan-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.lf-plan-item:last-child{border-bottom:0}.lf-plan-code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}@media(max-width:760px){.lf-plan-grid{grid-template-columns:1fr}.lf-plan-table{display:block;overflow-x:auto}.lf-plan-item{display:grid}}
</style>
<script data-prh-local-first-planning-extension="1.0.0">
(function(){
  'use strict';
  const ROUTES=Object.freeze(['budget','obligations','liquidity']);
  const grid=document.getElementById('lf-preview-grid');
  const syncRefresh=document.getElementById('lf-sync-refresh');
  const initialPreview=grid?grid.innerHTML:'';
  const runtime={schema:'PRH_LOCAL_FIRST_PLANNING_EXTENSION_V1',version:'1.0.0',renderEpoch:0,lastState:null,booted:false,backgroundSyncCalls:0};
  let planning=null;
  function route(){return String(document.body.dataset.activeLfRoute||'home')}
  function privacyMode(){const raw=String(new URL(location.href).searchParams.get('privacy')||'').trim().toUpperCase();if(!raw)return 'NORMAL';return ['NORMAL','MASKED','DEMO','ZEN'].includes(raw)?raw:'MASKED'}
  function valuesVisible(){return privacyMode()==='NORMAL'}
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
  function money(value,currency){if(!valuesVisible())return '••••••';if(!Number.isSafeInteger(value))return '—';return new Intl.NumberFormat('ru-RU',{style:'currency',currency:currency||'RUB',maximumFractionDigits:2}).format(value/100)}
  function privateText(value,fallback){if(!valuesVisible())return 'Скрыто';const text=String(value==null?'':value).trim();return text||fallback||'—'}
  function day(value){const text=String(value||'');return /^\d{4}-\d{2}-\d{2}/.test(text)?text.slice(0,10).split('-').reverse().join('.'):'—'}
  function stateBlock(state,text){return '<div class="lf-plan-status" data-state="'+esc(state)+'">'+esc(text)+'</div>'}
  function budgetStateLabel(value){return ({ON_TRACK:'По плану',AT_RISK:'Есть риск превышения',OVER_BUDGET:'Бюджет превышен'})[String(value||'')]||'Требует проверки'}
  function obligationStateLabel(value){return ({OVERDUE:'Просрочено',DUE:'Сегодня',UPCOMING:'Скоро',FORECAST:'Позже'})[String(value||'')]||'Запланировано'}
  function reconciliationStateLabel(value){return ({MATCH:'Сходится',MISMATCH:'Есть расхождение'})[String(value||'')]||'Требует проверки'}
  function actions(){return '<div class="lf-plan-actions"><button class="button secondary" type="button" id="lf-plan-refresh">Обновить плановые данные</button></div>'}
  function bindActions(){const refresh=document.getElementById('lf-plan-refresh');if(refresh)refresh.addEventListener('click',function(){if(!planning)return;runtime.backgroundSyncCalls+=1;planning.backgroundSync().catch(function(){})});const drill=document.getElementById('lf-plan-budget-drill');if(drill)drill.addEventListener('click',function(){const start=drill.dataset.start,end=drill.dataset.end,url=new URL(location.href);url.searchParams.set('tx_start',start);url.searchParams.set('tx_end',end);history.replaceState(history.state||{},'',url.pathname+url.search+url.hash);if(window.__PRH_LF_SPA_TEST__)window.__PRH_LF_SPA_TEST__.navigate('transactions',{focusMain:true})})}
  function renderBudget(result){const p=result.payload,c=result.currency;if(p.status==='NOT_CONFIGURED')return stateBlock('SETUP_REQUIRED','Для текущего месяца не задана явная общая строка сценария «Базовый». Детальные строки автоматически не суммируются.')+actions();if(p.status!=='READY'||!p.view)return stateBlock('UNAVAILABLE','Бюджет сейчас недоступен: источник неоднозначен или требует проверки.')+actions();const v=p.view;return '<div class="lf-plan-shell"><div class="lf-plan-grid"><article class="lf-plan-card"><span class="lf-plan-muted">Бюджет месяца</span><strong>'+esc(money(v.plan.budget_minor,c))+'</strong></article><article class="lf-plan-card"><span class="lf-plan-muted">Расходы к текущей дате</span><strong>'+esc(money(v.fact_expense_minor,c))+'</strong></article><article class="lf-plan-card"><span class="lf-plan-muted">Отклонение к плану на текущую дату</span><strong>'+esc(money(v.elapsed_budget_variance_minor,c))+'</strong></article></div><section class="lf-plan-panel"><h2>Прогноз темпа расходов</h2><p class="lf-plan-muted">'+esc(money(v.run_rate_projection_minor,c))+' — расчётный прогноз, а не финансовый факт.</p><p class="lf-plan-muted">Состояние: '+esc(budgetStateLabel(v.alert_state))+'</p><button class="button secondary" id="lf-plan-budget-drill" data-start="'+esc(v.plan.period.start)+'" data-end="'+esc(v.plan.period.end)+'" type="button">Открыть операции этого периода</button></section>'+stateBlock('READY','Фактические расходы берутся из проверенных операций; бюджет — только из явной общей строки «Базовый».')+actions()+'</div>'}
  function occurrenceRows(view,currency){if(!view||!view.occurrences||!view.occurrences.length)return '<p class="lf-plan-muted">На выбранный горизонт повторяющихся платежей нет.</p>';return '<div class="lf-plan-list">'+view.occurrences.slice(0,40).map(function(item){return '<div class="lf-plan-item"><div><strong>'+esc(privateText(item.label))+'</strong><div class="lf-plan-muted">'+esc(day(item.due_date))+' · '+esc(obligationStateLabel(item.state))+'</div></div><div>'+esc(money(item.amount_minor,currency))+'</div></div>'}).join('')+'</div>'}
  function commitmentRows(items,currency){if(!items||!items.length)return '<p class="lf-plan-muted">Отдельных обязательств с явно указанной датой на этот горизонт нет.</p>';return '<div class="lf-plan-list">'+items.slice(0,40).map(function(item){return '<div class="lf-plan-item"><div><strong>'+esc(privateText(item.label))+'</strong><div class="lf-plan-muted">Платёж '+esc(day(item.due_date))+' · периодичность не предполагается</div></div><div>'+esc(money(item.payment_minor,currency))+'</div></div>'}).join('')+'</div>'}
  function renderObligations(result){const p=result.payload,c=result.currency;return '<div class="lf-plan-shell"><section class="lf-plan-panel"><h2>Повторяющиеся платежи</h2>'+occurrenceRows(p.recurring,c)+'</section><section class="lf-plan-panel"><h2>Отдельные обязательства</h2>'+commitmentRows(p.commitments,c)+'</section>'+stateBlock('READY','Плановые платежи не создают операции автоматически. Для листа «05 Обязательства» периодичность не придумывается.')+actions()+'</div>'}
  function renderLiquidity(result){const p=result.payload,c=result.currency;if(p.status==='SETUP_REQUIRED')return '<div class="lf-plan-shell">'+stateBlock('SETUP_REQUIRED','Для ликвидности нужен отдельный источник явных остатков «06 Баланс». Денежный поток не используется как подмена остатка.')+'<section class="lf-plan-panel"><h2>Ожидаемая структура «06 Баланс»</h2><p class="lf-plan-muted">ID · Дата и время · Счёт · Валюта · Остаток · Метод · Комментарий</p><p class="lf-plan-muted">Метод: «Ручной» или «Выписка». Отсутствующий остаток считается неизвестным, а не нулём.</p></section>'+actions()+'</div>';if(p.status==='EMPTY')return stateBlock('SETUP_REQUIRED','Лист «06 Баланс» есть, но явных корректных наблюдений пока нет.')+actions();if(p.status!=='READY')return stateBlock('UNAVAILABLE','Источник остатков требует проверки. Никакой расчётный остаток вместо него не показывается.')+actions();return '<div class="lf-plan-shell"><div class="lf-plan-grid"><article class="lf-plan-card"><span class="lf-plan-muted">Сумма наблюдаемых остатков</span><strong>'+esc(money(p.observed_total_minor,c))+'</strong><div class="lf-plan-muted">Только счета с явными наблюдениями</div></article><article class="lf-plan-card"><span class="lf-plan-muted">Счета с наблюдениями</span><strong>'+p.accounts.length+'</strong></article><article class="lf-plan-card"><span class="lf-plan-muted">Cash Flow как остаток</span><strong>Нет</strong></article></div><section class="lf-plan-panel"><h2>Последние наблюдения и сверка</h2><div class="lf-plan-list">'+p.accounts.map(function(item,index){const r=item.reconciliation;return '<div class="lf-plan-item"><div><strong>Счёт '+(index+1)+'</strong><div class="lf-plan-muted">Наблюдение: '+esc(day(item.latest_observation.observed_at))+' · записей: '+item.observation_count+(r?' · сверка: '+esc(reconciliationStateLabel(r.state)):' · для сверки нужна ещё одна точка')+'</div></div><div>'+esc(money(item.latest_observation.balance_minor,c))+(r&&r.state==='MISMATCH'?'<div class="lf-plan-muted">Расхождение '+esc(money(r.mismatch_minor,c))+'</div>':'')+'</div></div>'}).join('')+'</div></section>'+stateBlock('READY','Остатки — только явные наблюдения. Сверка остатков ничего не переписывает автоматически.')+actions()+'</div>'}
  function renderState(state){runtime.lastState=state;if(ROUTES.indexOf(route())<0)return;if(!grid)return;grid.hidden=false;grid.dataset.lfPlanningRoute=route();if(!state||!state.view||state.view.status==='LOADING'){grid.innerHTML=stateBlock('LOADING','Подготавливаем локальные плановые данные…');return}if(state.view.status==='EMPTY'){grid.innerHTML=stateBlock('LOADING','Плановые данные ещё загружаются. Можно продолжать работу в остальных разделах.');return}if(state.view.status==='STALE'){grid.innerHTML=stateBlock('LOADING','Плановые данные обновляются до той же проверенной ревизии операций.');return}if(state.view.status==='ERROR'){grid.innerHTML=stateBlock('UNAVAILABLE','Плановый раздел временно недоступен. Финансовые значения не подменяются.')+actions();bindActions();return}if(state.view.status!=='READY')return;const result=state.view.result;grid.innerHTML=result.route==='budget'?renderBudget(result):(result.route==='obligations'?renderObligations(result):renderLiquidity(result));bindActions()}
  function clearIfOwned(){if(grid&&grid.dataset.lfPlanningRoute){delete grid.dataset.lfPlanningRoute;grid.innerHTML=initialPreview}}
  async function waitFinance(){for(let i=0;i<100;i+=1){if(window.__PRH_LF_FINANCE_RUNTIME__)return window.__PRH_LF_FINANCE_RUNTIME__;await new Promise(function(resolve){setTimeout(resolve,50)})}throw new Error('LOCAL_PLANNING_FINANCE_RUNTIME_TIMEOUT')}
  async function boot(){if(runtime.booted)return;runtime.booted=true;if(!window.PrhLocalPlanningRuntime||!window.indexedDB)return;try{const finance=await waitFinance();const store=PrhLocalPlanningRuntime.createStore({indexedDB:indexedDB,name:'prihrash-local-planning-v1'});let transport=null;try{transport=PrhLocalPlanningRuntime.createGoogleScriptTransport()}catch(error){runtime.transportUnavailableReason=String(error&&error.code||'LOCAL_PLANNING_TRANSPORT_UNAVAILABLE')}planning=PrhLocalPlanningRuntime.createRuntime({store:store,transport:transport,financeRuntime:finance,onState:renderState});window.__PRH_LF_PLANNING_RUNTIME__=planning;await planning.start(ROUTES.indexOf(route())>=0?route():'budget');if(ROUTES.indexOf(route())<0)clearIfOwned()}catch(error){runtime.lastState=Object.freeze({status:'ERROR',reason:String(error&&error.code||'LOCAL_PLANNING_BOOT_FAILED')});if(ROUTES.indexOf(route())>=0&&grid){grid.hidden=false;grid.dataset.lfPlanningRoute=route();grid.innerHTML=stateBlock('UNAVAILABLE','Плановые разделы временно недоступны.')}}}
  if(grid){new MutationObserver(function(mutations){if(!mutations.some(function(item){return item.type==='attributes'&&item.attributeName==='data-active-lf-route'}))return;const current=route();if(ROUTES.indexOf(current)<0){clearIfOwned();return}grid.hidden=false;if(planning)planning.setRoute(current).catch(function(){});else boot()}).observe(document.body,{attributes:true,attributeFilter:['data-active-lf-route']})}
  window.__PRH_LF_PLANNING_EXTENSION__=Object.freeze({schema:runtime.schema,version:runtime.version,routes:ROUTES,renderState:renderState,getState:function(){return Object.freeze(Object.assign({},runtime))}});
  if(ROUTES.indexOf(route())>=0)Promise.resolve().then(boot);
})();
</script>
