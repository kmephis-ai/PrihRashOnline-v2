<!doctype html>
<html lang="ru">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --navy: #0B2E4F;
      --teal: #119DA4;
      --teal-soft: #E6F6F5;
      --blue-soft: #EEF4FF;
      --canvas: #F5F7FA;
      --card: #FFFFFF;
      --text: #102A43;
      --muted: #627D98;
      --line: #D9E2EC;
      --danger: #B42318;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--text); font: 13px Arial, sans-serif; }
    header { padding: 18px 18px 16px; background: var(--navy); color: #fff; }
    header h1 { margin: 0; font-size: 19px; line-height: 1.2; }
    header p { margin: 6px 0 0; color: #CFE1EE; font-size: 11px; line-height: 1.4; }
    main { padding: 14px; }
    .card { margin-bottom: 12px; padding: 13px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 8px rgba(11,46,79,.06); }
    .card h2 { margin: 0 0 10px; color: var(--navy); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .field { margin-bottom: 10px; }
    label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 700; }
    select, input { width: 100%; min-height: 36px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); font: 13px Arial, sans-serif; outline: none; }
    select:focus, input:focus { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(17,157,164,.14); }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric { min-height: 68px; padding: 10px; border-radius: 9px; background: var(--blue-soft); }
    .metric.accent { background: var(--teal-soft); }
    .metric span { display: block; color: var(--muted); font-size: 10px; line-height: 1.25; }
    .metric strong { display: block; margin-top: 5px; color: var(--navy); font-size: 15px; line-height: 1.2; }
    button { width: 100%; min-height: 38px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--navy); font: 700 12px Arial, sans-serif; cursor: pointer; }
    button:hover { border-color: var(--teal); background: #F8FFFF; }
    button.primary { border-color: var(--teal); background: var(--teal); color: #fff; }
    button.secondary { background: var(--blue-soft); }
    button:disabled { cursor: wait; opacity: .55; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .actions .wide { grid-column: 1 / -1; }
    .status { margin-top: 10px; padding: 9px 10px; border-radius: 8px; background: #EDF2F7; color: var(--muted); font-size: 11px; line-height: 1.35; white-space: pre-wrap; }
    .status.error { background: #FDE8E7; color: var(--danger); }
    .version { margin-top: 8px; color: #CFE1EE; font-size: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Дашборд доходов</h1>
    <p>Период, режим, детализация и основные показатели в одной панели.</p>
    <div class="version" id="version">Загрузка контроллера…</div>
  </header>

  <main>
    <section class="card">
      <h2>Период и режим</h2>
      <div class="field">
        <label for="mode">Режим просмотра</label>
        <select id="mode"></select>
      </div>
      <div class="grid">
        <div class="field">
          <label for="year">Год</label>
          <select id="year"></select>
        </div>
        <div class="field">
          <label for="month">Месяц</label>
          <select id="month"></select>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Фильтры детализации</h2>
      <div class="field">
        <label for="category">Вид дохода</label>
        <select id="category"></select>
      </div>
      <div class="field">
        <label for="minAmount">Минимальная сумма</label>
        <input id="minAmount" type="number" min="0" step="100" value="0">
      </div>
      <button class="primary" id="applyButton" onclick="applyFilters()">Применить настройки</button>
    </section>

    <section class="card">
      <h2>Краткая сводка</h2>
      <div class="summary">
        <div class="metric accent"><span>Доход года</span><strong id="yearIncome">—</strong></div>
        <div class="metric accent"><span>Доход месяца</span><strong id="monthIncome">—</strong></div>
        <div class="metric"><span>Изменение месяца</span><strong id="monthChange">—</strong></div>
        <div class="metric"><span>Базовый доход</span><strong id="baseIncome">—</strong></div>
        <div class="metric"><span>Спецдоходы</span><strong id="specialIncome">—</strong></div>
        <div class="metric"><span>Операций</span><strong id="operationCount">—</strong></div>
        <div class="metric"><span>Стабильность</span><strong id="stabilityIndex">—</strong></div>
        <div class="metric"><span>Качество</span><strong id="qualityIndex">—</strong></div>
      </div>
    </section>

    <section class="card">
      <h2>Действия</h2>
      <div class="actions">
        <button onclick="latestPeriod()">Последний период</button>
        <button onclick="resetFilters()">Сбросить</button>
        <button onclick="openOperations()">Операции периода</button>
        <button onclick="openProblems()">Проблемы данных</button>
        <button class="secondary wide" onclick="refreshDashboard()">Обновить и проверить</button>
      </div>
      <div class="status" id="status">Загрузка данных…</div>
    </section>
  </main>

<script>
  const byId = id => document.getElementById(id);

  function setBusy(busy) {
    document.querySelectorAll('button, select, input').forEach(element => {
      element.disabled = busy;
    });
  }

  function setStatus(text, isError) {
    const status = byId('status');
    status.textContent = text;
    status.classList.toggle('error', Boolean(isError));
  }

  function fillSelect(id, values, current) {
    const select = byId(id);
    select.innerHTML = '';
    (values || []).forEach(value => {
      const option = document.createElement('option');
      option.value = String(value);
      option.textContent = String(value);
      option.selected = String(value) === String(current);
      select.appendChild(option);
    });
  }

  function render(state) {
    fillSelect('mode', state.modes, state.mode);
    fillSelect('year', state.years, state.year);
    fillSelect('month', state.months, state.month);
    fillSelect('category', state.categories, state.category);
    byId('minAmount').value = state.minAmount;
    byId('version').textContent = 'Controller ' + state.version + ' • 9 режимов';

    const summary = state.summary || {};
    ['yearIncome','monthIncome','monthChange','baseIncome','specialIncome','operationCount','stabilityIndex','qualityIndex']
      .forEach(key => byId(key).textContent = summary[key] || '—');

    setBusy(false);
    setStatus('Готово • ' + state.year + ' • ' + state.month, false);
  }

  function fail(error) {
    setBusy(false);
    setStatus('Ошибка: ' + (error && error.message ? error.message : error), true);
  }

  function run(message, method, args, success) {
    setBusy(true);
    setStatus(message, false);
    let runner = google.script.run
      .withSuccessHandler(success || render)
      .withFailureHandler(fail);
    runner[method].apply(runner, args || []);
  }

  function load() {
    run('Загрузка данных…', 'prhGetIncomeSidebarState');
  }

  function applyFilters() {
    run('Применение режима и фильтров…', 'prhApplyIncomeSidebarFilters', [{
      mode: byId('mode').value,
      year: byId('year').value,
      month: byId('month').value,
      category: byId('category').value,
      minAmount: byId('minAmount').value
    }]);
  }

  function latestPeriod() {
    run('Поиск последнего доходного периода…', 'prhIncomeSidebarLatestPeriod');
  }

  function resetFilters() {
    run('Сброс фильтров…', 'prhIncomeSidebarReset');
  }

  function refreshDashboard() {
    run('Обновление и проверка…', 'prhIncomeSidebarRefresh');
  }

  function openOperations() {
    run('Открытие операций периода…', 'prhIncomeSidebarOpenOperations', [], () => {
      setBusy(false);
      setStatus('Открыта детализация выбранного периода', false);
    });
  }

  function openProblems() {
    run('Открытие контроля качества…', 'prhIncomeSidebarOpenProblems', [], () => {
      setBusy(false);
      setStatus('Открыт раздел качества данных', false);
    });
  }

  load();
</script>
</body>
</html>
