<!doctype html>
<html>
<head>
  <base target="_top">
  <style>
    body{font:14px Arial,sans-serif;margin:16px;color:#202124}label{display:block;margin-top:12px;font-weight:600}select,input,button{box-sizing:border-box;width:100%;margin-top:6px;padding:9px;border:1px solid #dadce0;border-radius:6px}button{cursor:pointer;font-weight:600}.primary{background:#1a73e8;color:#fff;border:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{margin-top:12px;padding:9px;border-radius:6px;background:#f1f3f4;white-space:pre-wrap}.small{font-size:12px;color:#5f6368}button:disabled{opacity:.6;cursor:wait}
  </style>
</head>
<body>
  <h2>Доходы</h2>
  <div class="small" id="version"></div>
  <label>Режим<select id="mode"></select></label>
  <div class="row">
    <label>Год<select id="year"></select></label>
    <label>Месяц<select id="month"></select></label>
  </div>
  <label>Категория<select id="category"></select></label>
  <label>Минимальная сумма<input id="minAmount" type="number" min="0" step="100" value="0"></label>
  <button class="primary" id="applyButton" onclick="applyFilters()">Применить</button>
  <div class="row">
    <button onclick="latest()">Последний месяц</button>
    <button onclick="resetFilters()">Сбросить</button>
  </div>
  <button onclick="openProblems()">Проблемные операции</button>
  <div class="status" id="status">Загрузка…</div>
<script>
const byId=id=>document.getElementById(id);
function setBusy(busy){document.querySelectorAll('button').forEach(button=>button.disabled=busy);}
function setStatus(text){byId('status').textContent=text;}
function fill(id,values,current){const el=byId(id);el.innerHTML='';values.forEach(v=>{const o=document.createElement('option');o.value=String(v);o.textContent=String(v);if(String(v)===String(current))o.selected=true;el.appendChild(o);});}
function render(state){fill('mode',state.modes,state.mode);fill('year',state.years,state.year);fill('month',state.months,state.month);fill('category',state.categories,state.category);byId('minAmount').value=state.minAmount;byId('version').textContent='Controller '+state.version;setBusy(false);setStatus('Готово');}
function fail(error){setBusy(false);setStatus('Ошибка: '+(error&&error.message?error.message:error));}
function run(status,method,args,success){setBusy(true);setStatus(status);let runner=google.script.run.withSuccessHandler(success||render).withFailureHandler(fail);runner[method].apply(runner,args||[]);}
function load(){run('Загрузка…','prhGetIncomeSidebarState');}
function applyFilters(){run('Применение…','prhApplyIncomeSidebarFilters',[{mode:byId('mode').value,year:byId('year').value,month:byId('month').value,category:byId('category').value,minAmount:byId('minAmount').value}]);}
function latest(){run('Поиск последнего периода…','prhIncomeSidebarLatestPeriod');}
function resetFilters(){run('Сброс…','prhIncomeSidebarReset');}
function openProblems(){run('Открытие…','prhIncomeSidebarOpenProblems',[],()=>{setBusy(false);setStatus('Проблемные операции открыты');});}
load();
</script>
</body>
</html>
