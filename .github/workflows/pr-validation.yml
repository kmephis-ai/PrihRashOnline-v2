name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '*.js'
      - '*.html'
      - 'AGENTS.md'
      - 'llms.txt'
      - '.ai-context/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'appsscript.json'
      - '.claspignore'
      - '.clasp.json.example'
      - '.gitignore'
      - 'lib/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Supply-chain policy
        run: node tools/supply-chain-scan.js
      - name: CI trust-boundary policy
        run: node tools/ci-trust-boundary-scan.js
      - name: Secret scan
        run: node tools/secret-scan.js
      - name: Privacy public-data scan
        run: node tools/privacy-public-data-scan.js
      - name: Free-only policy
        run: node tools/free-only-scan.js
      - name: Documentation truth
        run: node tools/docs-drift-scan.js
      - name: AI contract
        run: node tools/ai-contract-scan.js
      - name: Roadmap task protocol
        run: node tests/roadmap_task_protocol_contract_test.js
      - name: Multi-AI review protocol
        run: node tests/multi_ai_review_protocol_contract_test.js
      - name: Layered test architecture
        run: node tests/test_architecture_contract_test.js
      - name: Financial reconcile synthetic
        run: node tests/financial_reconciliation_contract_test.js
      - name: KPI Dictionary
        run: node tests/kpi_dictionary_contract_test.js
      - name: Canonical transaction schema
        run: node tests/canonical_transaction_schema_contract_test.js
      - name: Pure domain/application core
        run: node tests/pure_domain_application_core_contract_test.js
      - name: Transaction repository adapter
        run: node tests/repository_adapter_contract_test.js
      - name: Analytics extension contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/analytics_extension_contract_test.js
          node tests/analytics_query_edge_contract_test.js
          node tests/analytics_documentation_contract_test.js
      - name: Migration reconcile synthetic
        run: node tests/migration_reconciliation_contract_test.js
      - name: Full-history migration protocol
        shell: bash
        run: |
          set -euo pipefail
          node tests/full_history_migration_contract_test.js
          node tests/mig010_plan_privacy_contract_test.js
          node tests/mig010_existing_target_preflight_contract_test.js
          node tests/mig010_private_mapper_example_contract_test.js
          node tests/mig010_leading_columns_mapper_contract_test.js
          node tests/mig010_target_blank_date_contract_test.js
          node tests/mig010_owner_tool_contract_test.js
          node tests/mig010_owner_diagnostics_contract_test.js
          node tests/mig010_occurrence_identity_contract_test.js
          node tests/mig010_repair_policy_contract_test.js
          node tests/mig010_repair_policy_compatibility_contract_test.js
          node tests/mig010_repair_tool_contract_test.js
          node tests/mig010_rebuild_dry_run_contract_test.js
          node tests/mig010_documentation_contract_test.js
      - name: Prepare dashboard bundle
        run: npm run prepare:web
      - name: Run all contract tests
        run: node tools/run-layered-tests.js full
      - name: Install Playwright browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Responsive visual gate
        run: node tests/dashboard_web_visual_test.js
      - name: Build immutable Apps Script candidate
        run: |
          node tools/build-apps-script-candidate.js \
            --source . \
            --out candidate-artifact \
            --sha "${{ github.event.pull_request.head.sha }}"
      - name: Upload immutable Apps Script candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apps-script-candidate-${{ github.event.pull_request.head.sha }}
          path: candidate-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-${{ github.event.pull_request.number }}-dashboard-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
