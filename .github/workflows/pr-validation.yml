name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '*.js'
      - '*.html'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'appsscript.json'
      - '.claspignore'
      - '.clasp.json.example'
      - '.gitignore'
      - 'lib/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: write # SEC-003 bootstrap only; restored to read before merge.

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !startsWith(github.head_ref, 'agent/release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Bootstrap tracked package-lock
        if: github.head_ref == 'agent/SEC-003-reproducible-supply-chain'
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if [[ -n "$(git status --porcelain -- package-lock.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build(SEC-003): add generated npm lockfile'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
          mkdir -p artifacts
          cp package-lock.json artifacts/generated-package-lock.json
      - name: Secret scan
        run: node tools/secret-scan.js
      - name: Privacy public-data scan
        run: node tools/privacy-public-data-scan.js
      - name: Financial reconcile synthetic
        run: node tests/financial_reconciliation_contract_test.js
      - name: Migration reconcile synthetic
        run: node tests/migration_reconciliation_contract_test.js
      - name: Prepare dashboard bundle
        run: npm run prepare:web
      - name: Run all contract tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TEST_FILES < <(find tests -maxdepth 1 -type f -name '*contract_test.js' -print | sort -u)
          [[ "${#TEST_FILES[@]}" -gt 0 ]] || { echo '::error::No contract tests found'; exit 1; }
          for test_file in "${TEST_FILES[@]}"; do node "${test_file}"; done
      - name: Install dependencies and Playwright browser
        run: |
          npm install --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Responsive visual gate
        run: node tests/dashboard_web_visual_test.js
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-${{ github.event.pull_request.number }}-dashboard-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
