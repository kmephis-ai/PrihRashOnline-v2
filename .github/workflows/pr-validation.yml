name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '*.js'
      - '*.html'
      - 'AGENTS.md'
      - 'llms.txt'
      - '.ai-context/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'appsscript.json'
      - '.claspignore'
      - '.clasp.json.example'
      - '.gitignore'
      - 'lib/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Supply-chain policy
        run: node tools/supply-chain-scan.js
      - name: CI trust-boundary policy
        run: node tools/ci-trust-boundary-scan.js
      - name: Secret scan
        run: node tools/secret-scan.js
      - name: Privacy public-data scan
        run: node tools/privacy-public-data-scan.js
      - name: Free-only policy
        run: node tools/free-only-scan.js
      - name: Documentation truth
        run: node tools/docs-drift-scan.js
      - name: AI contract
        run: node tools/ai-contract-scan.js
      - name: Financial reconcile synthetic
        run: node tests/financial_reconciliation_contract_test.js
      - name: Migration reconcile synthetic
        run: node tests/migration_reconciliation_contract_test.js
      - name: Prepare dashboard bundle
        run: npm run prepare:web
      - name: Run all contract tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TEST_FILES < <(find tests -maxdepth 1 -type f -name '*contract_test.js' -print | sort -u)
          [[ "${#TEST_FILES[@]}" -gt 0 ]] || { echo '::error::No contract tests found'; exit 1; }
          for test_file in "${TEST_FILES[@]}"; do node "${test_file}"; done
      - name: Install Playwright browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Responsive visual gate
        run: node tests/dashboard_web_visual_test.js
      - name: Build immutable Apps Script candidate
        run: |
          node tools/build-apps-script-candidate.js \
            --source . \
            --out candidate-artifact \
            --sha "${{ github.event.pull_request.head.sha }}"
      - name: Upload immutable Apps Script candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apps-script-candidate-${{ github.event.pull_request.head.sha }}
          path: candidate-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-${{ github.event.pull_request.number }}-dashboard-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
