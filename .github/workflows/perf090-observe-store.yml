name: PERF-090 CI Observer Store

on:
  push:
    branches:
      - agent/perf090-ci-observer-20260817
    paths:
      - '.github/workflows/perf090-observe-store.yml'
      - '.perf090-observer/trigger.txt'

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: read
  statuses: read

env:
  PR_NUMBER: '302'
  CANDIDATE_SHA: 978c960458d2fc62c6303c63a7ce57d6da22c341
  OBSERVER_BRANCH: agent/perf090-ci-observer-20260817

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Capture compact exact provider state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100" > /tmp/checks.json
          gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/status" > /tmp/status.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CANDIDATE_SHA}&per_page=100" > /tmp/runs.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/301" > /tmp/issue.json
          jq -n \
            --slurpfile pr /tmp/pr.json \
            --slurpfile checks /tmp/checks.json \
            --slurpfile status /tmp/status.json \
            --slurpfile runs /tmp/runs.json \
            --slurpfile issue /tmp/issue.json \
            '{
              observed_at:(now|todate),
              pr:{number:$pr[0].number,state:$pr[0].state,draft:$pr[0].draft,merged:$pr[0].merged,mergeable:$pr[0].mergeable,mergeable_state:$pr[0].mergeable_state,head_sha:$pr[0].head.sha,base_sha:$pr[0].base.sha},
              issue:{state:$issue[0].state,title:$issue[0].title,body:$issue[0].body},
              checks:[$checks[0].check_runs[]|{id,name,status,conclusion,app:.app.slug,details_url}],
              statuses:[$status[0].statuses[]|{context,state,description,target_url}],
              workflow_runs:[$runs[0].workflow_runs[]|{id,name,event,status,conclusion,run_number,html_url}]
            }' > /tmp/state.json
          CONTENT="$(base64 -w0 /tmp/state.json)"
          CURRENT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.perf090-observer/state.json?ref=${OBSERVER_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$CURRENT_SHA" ]]; then
            jq -n --arg message 'chore: refresh PERF-090 observer state' --arg content "$CONTENT" --arg branch "$OBSERVER_BRANCH" --arg sha "$CURRENT_SHA" \
              '{message:$message,content:$content,branch:$branch,sha:$sha}' | \
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.perf090-observer/state.json" --input - >/dev/null
          else
            jq -n --arg message 'chore: store PERF-090 observer state' --arg content "$CONTENT" --arg branch "$OBSERVER_BRANCH" \
              '{message:$message,content:$content,branch:$branch}' | \
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.perf090-observer/state.json" --input - >/dev/null
          fi
