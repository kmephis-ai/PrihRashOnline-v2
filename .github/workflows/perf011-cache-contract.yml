name: PERF-011 Cache Contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/repository/revision_aware_cache.v1.json'
      - 'lib/repository/revision_aware_cache.js'
      - 'tests/repository_cache_adapter_contract_test.js'
      - 'docs/operations/PERF011_REVISION_AWARE_CACHE.md'
      - '.github/workflows/perf011-cache-contract.yml'

permissions:
  contents: read

concurrency:
  group: perf011-cache-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cache-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Revision-aware read cache
        run: node tests/repository_cache_adapter_contract_test.js
