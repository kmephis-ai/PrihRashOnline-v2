name: ADWF UPGRADE-003 C Candidate Readback

on:
  pull_request:
    branches:
      - helper/adwf-upgrade-003-c-readback-base-20260819-a1
    types: [opened]

permissions:
  contents: read

env:
  BASE_SHA: cb5e4b9a947f3728b77c4be437b706d8f9c2a52d
  CANDIDATE_SHA: f1bbdbd0004ba3933c025528f900ef813e63de2e
  CANDIDATE_TREE: a492f56fd8dfe298d7744d4228902255c971c42d
  TARGET_SHA: 1f38866eeb242f8d1e56c54632b059cf8adde77d
  TARGET_TREE: 463fce58eb20e2d01b15aed8f400ef1c40b2020a
  TARGET_BRANCH: agent/ADWF-UPGRADE-003-certified-c-session-reproof
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fresh checkout exact published candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/PrihRashOnline-v2
          ref: ${{ env.CANDIDATE_SHA }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false

      - name: Fresh checkout exact certified ADWF C
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/AI-Development-Framework
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Verify exact candidate identity, ancestry and current CAS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C consumer rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C consumer rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git -C consumer merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          test "$(git -C consumer rev-list --count "$BASE_SHA".."$CANDIDATE_SHA")" = '1'
          test "$(git -C consumer ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git -C consumer ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$CANDIDATE_SHA"
          test "$(git -C target ls-remote origin refs/heads/main | cut -f1)" = "$TARGET_SHA"

      - name: Verify managed-only provider candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git -C consumer diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort > "$RUNNER_TEMP/changed.txt"
          test "$(wc -l < "$RUNNER_TEMP/changed.txt" | tr -d ' ')" = '23'
          python - "$RUNNER_TEMP/changed.txt" <<'PY'
          import json,sys
          paths=[line.strip() for line in open(sys.argv[1],encoding='utf-8') if line.strip()]
          assert paths
          forbidden=[p for p in paths if not (p.startswith('.adwf/') or p.startswith('.adwf-consumer/'))]
          assert not forbidden, forbidden
          assert not any(p.startswith('.adwf-runtime/') for p in paths)
          assert 'AGENTS.md' not in paths and 'docs/ROADMAP.md' not in paths
          assert not any(p.startswith('.github/workflows/') for p in paths)
          print(json.dumps({'status':'MANAGED_ONLY','count':len(paths),'changed_paths':paths},sort_keys=True))
          PY

      - name: Verify provider-published C installation
        shell: bash
        run: |
          set -euo pipefail
          python consumer/.adwf/scripts/consumer_installation.py \
            --consumer-root consumer --framework-root target \
            --repository kmephis-ai/PrihRashOnline-v2 > "$RUNNER_TEMP/installation.json"
          python - "$RUNNER_TEMP/installation.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          record=json.loads(Path('consumer/.adwf-consumer/installation.json').read_text(encoding='utf-8'))
          expected_entries=len(record['managed_surface']['entries'])
          assert r['status']=='VERIFIED'
          assert r['framework_source_sha']==os.environ['TARGET_SHA']
          assert r['framework_source_tree']==os.environ['TARGET_TREE']
          assert r['managed_entries_verified']==expected_entries and expected_entries>0
          assert r['monetary_budget_usd']==0
          assert r['secrets']=='FORBIDDEN'
          print(json.dumps({'status':r['status'],'framework_source_sha':r['framework_source_sha'],'framework_source_tree':r['framework_source_tree'],'managed_entries_verified':r['managed_entries_verified'],'monetary_budget_usd':0,'secrets':'FORBIDDEN'},sort_keys=True))
          PY

      - name: Verify consumer-native bindings and newest-provider resolver
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ops=json.loads(Path('consumer/.adwf-consumer/operations.json').read_text(encoding='utf-8'))
          gates=json.loads(Path('consumer/.adwf-consumer/gates.json').read_text(encoding='utf-8'))
          assert ops['mode']=='CONSUMER_NATIVE'
          assert ops['consumer_repository']=='kmephis-ai/PrihRashOnline-v2'
          assert ops['roadmap']=={'kind':'MARKDOWN_FILE','path':'docs/ROADMAP.md'}
          assert ops['safety']=={'monetary_budget_usd':0,'secrets':'FORBIDDEN'}
          assert gates['required_phases']==['pr','main']
          assert [x['check_name'] for x in gates['phases']['pr']]==['validate']
          assert [x['check_name'] for x in gates['phases']['main']]==['verify']
          resolver=Path('consumer/.adwf/lib/consumer_gates.py').read_text(encoding='utf-8')
          assert 'provider_ids=[]' in resolver
          assert 'len(set(provider_ids))!=len(provider_ids)' in resolver
          assert 'max(candidates,key=lambda item:item["id"])' in resolver
          print(json.dumps({'mode':'CONSUMER_NATIVE','roadmap':'docs/ROADMAP.md','native_pr_gate':'validate','native_main_gate':'verify','newest_provider_resolver':True},sort_keys=True))
          PY

      - name: Verify automatic continuity and apps-script delivery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          profile=json.loads(Path('consumer/.adwf-consumer/profile.json').read_text(encoding='utf-8'))
          packs=profile.get('project_packs') or {}
          safety=packs.get('safety') or {}
          assert (profile.get('project') or {}).get('type')=='apps-script'
          assert packs.get('selected')=='apps-script'
          assert packs.get('materialized') is True
          assert safety.get('monetary_budget_usd')==0
          assert safety.get('secrets')=='FORBIDDEN'
          assert safety.get('network')=='NONE'
          policy=json.loads(Path('consumer/.adwf/consumer-instruction-policy.json').read_text(encoding='utf-8'))
          assert policy['router']['path']=='AGENTS.md'
          assert policy['router']['mode']=='CONSUMER_PRESERVED'
          core=Path('consumer/.adwf/instructions/CORE.md').read_text(encoding='utf-8')
          assert 'WORK_UNTIL_NATURAL_BOUNDARY' in core
          assert 'fresh provider/runtime discovery' in core or 'provider/runtime state' in core
          assert not any(Path('consumer/.adwf-runtime').rglob('*')) if Path('consumer/.adwf-runtime').exists() else True
          print(json.dumps({'project_type':'apps-script','selected_pack':packs.get('selected'),'pack_materialized':packs.get('materialized'),'continuity_instruction':True,'router_mode':policy['router']['mode'],'safety':safety},sort_keys=True))
          PY
