name: ADWF Fresh Session Verification

on:
  push:
    branches:
      - agent/diag-ADWF-ADOPT-001-fresh-session-cef64-a1

permissions:
  contents: read

env:
  PRIHRASH_SHA: cef64cfb0c7e082b90bb096f0829e5fa0b1906ae
  ADWF_SOURCE: e3bd9fb33f699ae227521f7ed5866c8f11589ed4
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  fresh-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Create independent exact provider checkouts
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/data
          sudo chown "$USER":"$USER" /mnt/data
          rm -rf /mnt/data/consumer-fresh /mnt/data/adwf-fresh
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" /mnt/data/consumer-fresh
          git clone -q "https://github.com/kmephis-ai/AI-Development-Framework.git" /mnt/data/adwf-fresh
          git -C /mnt/data/consumer-fresh checkout -q --detach "$PRIHRASH_SHA"
          git -C /mnt/data/adwf-fresh checkout -q --detach "$ADWF_SOURCE"
          test "$(git -C /mnt/data/consumer-fresh rev-parse HEAD)" = "$PRIHRASH_SHA"
          test "$(git -C /mnt/data/adwf-fresh rev-parse HEAD)" = "$ADWF_SOURCE"
          rm -rf /mnt/data/consumer-fresh/.adwf-runtime
          find /mnt/data/consumer-fresh -type d -name __pycache__ -prune -exec rm -rf {} +
          find /mnt/data/consumer-fresh -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Revalidate installed consumer without prior runtime state
        shell: bash
        run: |
          set -euo pipefail
          cd /mnt/data/consumer-fresh
          python .adwf/scripts/consumer_installation.py --consumer-root . --framework-root /mnt/data/adwf-fresh --repository "${GITHUB_REPOSITORY}"
          python .adwf/scripts/consumer_gates.py --project-root .
          python .adwf/scripts/consumer_ci.py classify-current --repository "${GITHUB_REPOSITORY}"
          python .adwf/adwf.py roadmap-view

      - name: Revalidate native consumer safety contracts
        shell: bash
        run: |
          set -euo pipefail
          cd /mnt/data/consumer-fresh
          node tools/supply-chain-scan.js
          node tools/ci-trust-boundary-scan.js
          node tools/secret-scan.js
          node tools/privacy-public-data-scan.js
          node tools/free-only-scan.js
          node tools/docs-drift-scan.js
          node tools/language-policy-scan.js
          node tools/verify-adwf-local-git-mirror.js

      - name: Dry-run framework upgrade from current canonical ADWF source
        shell: bash
        run: |
          set -euo pipefail
          python /mnt/data/adwf-fresh/.adwf/scripts/validate_managed_surface.py \
            --root /mnt/data/adwf-fresh \
            --consumer-root /mnt/data/consumer-fresh \
            --source-revision "$ADWF_SOURCE" > /tmp/adwf-upgrade-plan.json
          cat /tmp/adwf-upgrade-plan.json
          python - <<'PY'
          import json
          plan=json.load(open('/tmp/adwf-upgrade-plan.json', encoding='utf-8'))
          if plan.get('status') != 'READY':
              raise SystemExit(f"ADWF_UPGRADE_DRY_RUN_NOT_READY:{plan.get('status')}")
          blockers=plan.get('blockers') or []
          if blockers:
              raise SystemExit(f"ADWF_UPGRADE_DRY_RUN_BLOCKERS:{blockers}")
          print('ADWF_UPGRADE_DRY_RUN=READY')
          print('ADWF_UPGRADE_ACTIONS=' + json.dumps(plan.get('actions') or {}, sort_keys=True))
          PY

      - name: Prove runtime independence
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /mnt/data/consumer-fresh/.adwf-runtime
          echo "ADWF_FRESH_SESSION_RUNTIME_DEPENDENCE=NONE"
