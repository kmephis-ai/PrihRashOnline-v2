name: ADWF SESSION Consumer Ruleset Readback

on:
  push:
    branches:
      - helper/session-consumer-ruleset-readback-20260819-a1
    paths:
      - .github/workflows/adwf-session-consumer-ruleset-readback.yml

permissions:
  contents: read

env:
  TARGET_MAIN: 59bb5319052f378f10a0216ee3956f12944c0b77
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_MAIN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
          check-latest: false
      - name: Verify exact main and immutable Runtime Ledger anchor ruleset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_MAIN"
          test -f .adwf/lib/github_rulesets.py
          test -f .adwf/lib/github_provider.py
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.adwf').resolve()))
          from lib.github_provider import GitHubClient
          from lib.github_rulesets import verify_runtime_anchor_ruleset
          client = GitHubClient(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_TOKEN'])
          result = verify_runtime_anchor_ruleset(client.rulesets())
          print(json.dumps(result, sort_keys=True), flush=True)
          if result.get('readback_verified') is not True:
              raise SystemExit('SESSION_CONSUMER_RUNTIME_ANCHOR_RULESET_NOT_VERIFIED')
          if result.get('ruleset_id') is None:
              raise SystemExit('SESSION_CONSUMER_RUNTIME_ANCHOR_RULESET_ID_MISSING')
          PY
