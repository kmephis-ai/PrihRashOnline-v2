name: ADWF UPGRADE-003 Materializer

on:
  pull_request:
    branches:
      - helper/adwf-upgrade-003-materialize-base-20260819-a1
    types: [opened]

permissions:
  contents: write

env:
  CONSUMER_SHA: 59bb5319052f378f10a0216ee3956f12944c0b77
  CONSUMER_TREE: 38918d7993329d564b9cc920bec9317714638379
  SOURCE_SHA: 017042c1f2bcde8d89d4b344201e848d873ec5a9
  SOURCE_TREE: c7e709a29df431460abb9bc17025d62d7803cda1
  TARGET_SHA: b10ab53e926b57c637c9c253cd43266e0fe1acfb
  TARGET_TREE: aa8d72c61d1392147840698ce9960dd99b35381f
  TARGET_BRANCH: integration/ADWF-UPGRADE-003-session-ledger-race-reproof
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact consumer base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/PrihRashOnline-v2
          ref: ${{ env.CONSUMER_SHA }}
          path: consumer
          fetch-depth: 1
          persist-credentials: true
      - name: Checkout exact installed ADWF A
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/AI-Development-Framework
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact repaired ADWF B
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/AI-Development-Framework
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Assert exact Git identities and current CAS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C consumer rev-parse HEAD)" = "$CONSUMER_SHA"
          test "$(git -C consumer rev-parse HEAD^{tree})" = "$CONSUMER_TREE"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git -C consumer status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C target status --porcelain=v1 --untracked-files=all)"
          test "$(git -C consumer ls-remote origin refs/heads/main | cut -f1)" = "$CONSUMER_SHA"
          test "$(git -C consumer ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$CONSUMER_SHA"
      - name: Validate installed A from fresh checkout
        shell: bash
        run: |
          set -euo pipefail
          python consumer/.adwf/scripts/consumer_installation.py \
            --consumer-root consumer --framework-root source \
            --repository kmephis-ai/PrihRashOnline-v2
      - name: Run independent external A-B-A-B proof
        shell: bash
        run: |
          set -euo pipefail
          python consumer/.adwf/scripts/run_external_consumer_upgrade_proof.py \
            --consumer-root consumer \
            --consumer-repository kmephis-ai/PrihRashOnline-v2 \
            --consumer-sha "$CONSUMER_SHA" --consumer-tree "$CONSUMER_TREE" \
            --source-root source --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" \
            --target-root target --target-sha "$TARGET_SHA" --target-tree "$TARGET_TREE" \
            --provider-run-id "$GITHUB_RUN_ID" > "$RUNNER_TEMP/external-proof.json"
          python - "$RUNNER_TEMP/external-proof.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding='utf-8'))
          assert p['status']=='PASS'
          assert p['write_back_performed'] is False
          print(json.dumps({'status':p['status'],'report_sha256':p['report_sha256'],'upgrade':p['upgrade'],'transitions':p['transitions']},sort_keys=True))
          PY
      - name: Fresh plan and first B apply
        shell: bash
        run: |
          set -euo pipefail
          python consumer/.adwf/scripts/plan_consumer_upgrade.py \
            --source-root source --target-root target --consumer-root consumer \
            --source-revision "$SOURCE_SHA" --target-revision "$TARGET_SHA" \
            > "$RUNNER_TEMP/plan1-bundle.json"
          python - "$RUNNER_TEMP/plan1-bundle.json" "$RUNNER_TEMP/compat1.json" "$RUNNER_TEMP/plan1.json" <<'PY'
          import json,sys
          b=json.load(open(sys.argv[1],encoding='utf-8'))
          assert b['compatibility']['status']=='PASS'
          assert b['plan']['status']=='READY'
          json.dump(b['compatibility'],open(sys.argv[2],'w',encoding='utf-8'),sort_keys=True)
          json.dump(b['plan'],open(sys.argv[3],'w',encoding='utf-8'),sort_keys=True)
          print(json.dumps({'compatibility_sha256':b['compatibility']['compatibility_sha256'],'plan_sha256':b['plan']['plan_sha256']},sort_keys=True))
          PY
          python consumer/.adwf/scripts/apply_consumer_upgrade.py apply \
            --source-root source --target-root target --consumer-root consumer \
            --compatibility "$RUNNER_TEMP/compat1.json" --plan "$RUNNER_TEMP/plan1.json" \
            > "$RUNNER_TEMP/apply1.json"
          python - "$RUNNER_TEMP/apply1.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); assert r['status']=='COMMITTED'; assert r.get('transaction_id')
          print(json.dumps({'status':r['status'],'transaction_id':r['transaction_id']},sort_keys=True))
          PY
          python consumer/.adwf/scripts/consumer_installation.py \
            --consumer-root consumer --framework-root target \
            --repository kmephis-ai/PrihRashOnline-v2
      - name: Prove idempotency then rollback exact A
        shell: bash
        run: |
          set -euo pipefail
          python consumer/.adwf/scripts/apply_consumer_upgrade.py apply \
            --source-root source --target-root target --consumer-root consumer \
            --compatibility "$RUNNER_TEMP/compat1.json" --plan "$RUNNER_TEMP/plan1.json" \
            > "$RUNNER_TEMP/repeat.json"
          python - "$RUNNER_TEMP/repeat.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); assert r['status']=='ALREADY_COMMITTED'
          print(json.dumps({'repeat_status':r['status']},sort_keys=True))
          PY
          TX="$(python -c "import json;print(json.load(open('$RUNNER_TEMP/apply1.json'))['transaction_id'])")"
          python consumer/.adwf/scripts/apply_consumer_upgrade.py rollback \
            --source-root source --target-root target --consumer-root consumer \
            --transaction-id "$TX" > "$RUNNER_TEMP/rollback.json"
          python - "$RUNNER_TEMP/rollback.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); assert r['status']=='ROLLED_BACK'
          print(json.dumps({'rollback_status':r['status']},sort_keys=True))
          PY
          python consumer/.adwf/scripts/consumer_installation.py \
            --consumer-root consumer --framework-root source \
            --repository kmephis-ai/PrihRashOnline-v2
      - name: Fresh deterministic replan and final B reapply
        shell: bash
        run: |
          set -euo pipefail
          python consumer/.adwf/scripts/plan_consumer_upgrade.py \
            --source-root source --target-root target --consumer-root consumer \
            --source-revision "$SOURCE_SHA" --target-revision "$TARGET_SHA" \
            > "$RUNNER_TEMP/plan2-bundle.json"
          python - "$RUNNER_TEMP/plan1-bundle.json" "$RUNNER_TEMP/plan2-bundle.json" "$RUNNER_TEMP/compat2.json" "$RUNNER_TEMP/plan2.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1],encoding='utf-8')); b=json.load(open(sys.argv[2],encoding='utf-8'))
          assert b['compatibility']['status']=='PASS' and b['plan']['status']=='READY'
          assert a['compatibility']['compatibility_sha256']==b['compatibility']['compatibility_sha256']
          assert a['plan']['plan_sha256']==b['plan']['plan_sha256']
          json.dump(b['compatibility'],open(sys.argv[3],'w',encoding='utf-8'),sort_keys=True)
          json.dump(b['plan'],open(sys.argv[4],'w',encoding='utf-8'),sort_keys=True)
          print(json.dumps({'deterministic':True,'compatibility_sha256':b['compatibility']['compatibility_sha256'],'plan_sha256':b['plan']['plan_sha256']},sort_keys=True))
          PY
          python consumer/.adwf/scripts/apply_consumer_upgrade.py apply \
            --source-root source --target-root target --consumer-root consumer \
            --compatibility "$RUNNER_TEMP/compat2.json" --plan "$RUNNER_TEMP/plan2.json" \
            > "$RUNNER_TEMP/apply2.json"
          python - "$RUNNER_TEMP/apply2.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); assert r['status']=='COMMITTED'
          print(json.dumps({'final_status':r['status'],'transaction_id':r['transaction_id']},sort_keys=True))
          PY
          python consumer/.adwf/scripts/consumer_installation.py \
            --consumer-root consumer --framework-root target \
            --repository kmephis-ai/PrihRashOnline-v2
      - name: Enforce managed-only candidate scope
        shell: bash
        run: |
          set -euo pipefail
          git -C consumer status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/status.txt"
          python - "$RUNNER_TEMP/status.txt" <<'PY'
          import json,sys
          paths=[]
          for raw in open(sys.argv[1],encoding='utf-8'):
              raw=raw.rstrip('\n')
              if not raw: continue
              p=raw[3:]
              if ' -> ' in p: p=p.split(' -> ',1)[1]
              if not (p.startswith('.adwf/') or p.startswith('.adwf-consumer/')):
                  raise SystemExit('UPGRADE003_UNEXPECTED_PATH:'+p)
              if p.startswith('.adwf-runtime/'):
                  raise SystemExit('UPGRADE003_RUNTIME_PATH_FORBIDDEN:'+p)
              paths.append(p)
          if not paths: raise SystemExit('UPGRADE003_NO_CHANGES')
          print(json.dumps({'changed_paths':sorted(paths),'count':len(paths)},sort_keys=True))
          PY
      - name: CAS publish exact candidate to integration branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C consumer ls-remote origin refs/heads/main | cut -f1)" = "$CONSUMER_SHA"
          test "$(git -C consumer ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$CONSUMER_SHA"
          git -C consumer config user.name 'adwf-upgrade-003-materializer'
          git -C consumer config user.email 'adwf-upgrade-003-materializer@users.noreply.github.com'
          git -C consumer add .adwf .adwf-consumer
          git -C consumer commit -m '[ADWF-UPGRADE-003] Materialize repaired framework target b10ab53e'
          CANDIDATE_SHA="$(git -C consumer rev-parse HEAD)"
          CANDIDATE_TREE="$(git -C consumer rev-parse HEAD^{tree})"
          test -z "$(git -C consumer status --porcelain=v1 --untracked-files=all)"
          echo "candidate_sha=$CANDIDATE_SHA"
          echo "candidate_tree=$CANDIDATE_TREE"
          git -C consumer push origin HEAD:refs/heads/$TARGET_BRANCH
