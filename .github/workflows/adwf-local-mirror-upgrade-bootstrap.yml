name: ADWF Upgrade Local Mirror Bootstrap

on:
  push:
    branches:
      - agent/local-mirror-adwf-upgrade-001-prihrash-20260817-a1

permissions:
  contents: read

env:
  SOURCE_SHA: 51d5798671478c9cbfe63dcfb88bfbf3f5152de3
  SOURCE_BRANCH: main
  MIRROR_ARTIFACT_NAME: adwf-upgrade-001-prihrash-main-51d5798

jobs:
  build-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build exact-source bundle
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git branch -f adwf-source "${SOURCE_SHA}"
          mkdir -p mirror-artifact
          git bundle create mirror-artifact/repository.bundle refs/heads/adwf-source --tags
          git bundle verify mirror-artifact/repository.bundle
          BUNDLE_SHA256="$(sha256sum mirror-artifact/repository.bundle | awk '{print $1}')"
          printf '%s  %s\n' "${BUNDLE_SHA256}" "repository.bundle" > mirror-artifact/SHA256SUMS.txt
          python -c 'import json,os; print(json.dumps({"schema_version":1,"source_repository":os.environ["GITHUB_REPOSITORY"],"source_branch":os.environ["SOURCE_BRANCH"],"source_sha":os.environ["SOURCE_SHA"],"transport_sha":os.environ["GITHUB_SHA"],"bundle_ref":"refs/heads/adwf-source"},indent=2))' > mirror-artifact/manifest.json
      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.MIRROR_ARTIFACT_NAME }}
          path: mirror-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
