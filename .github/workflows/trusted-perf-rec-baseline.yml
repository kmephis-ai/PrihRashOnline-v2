name: PERF-REC Trusted Baseline

on:
  workflow_run:
    workflows: [Trusted DEV Deploy]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: perf-rec-trusted-baseline
  cancel-in-progress: false

jobs:
  baseline:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: DEV
    env:
      DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CLASP_USER: prihrash-ci
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Resolve exact deployed PERF-REC candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'eligible=false' >> "$GITHUB_OUTPUT"
          echo 'reason=NOT_PERF_REC_CANDIDATE' >> "$GITHUB_OUTPUT"

          ARTIFACTS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOY_RUN_ID}/artifacts")"
          ARTIFACT_NAME="$(jq -r '[.artifacts[] | select(.expired == false and (.name | test("^trusted-dev-deploy-[0-9a-f]{40}$")))] | if length == 1 then .[0].name else empty end' <<<"${ARTIFACTS_JSON}")"
          [[ "${ARTIFACT_NAME}" =~ ^trusted-dev-deploy-([0-9a-f]{40})$ ]] || {
            echo 'reason=DEPLOY_EVIDENCE_NOT_UNIQUE' >> "$GITHUB_OUTPUT"
            exit 0
          }
          CANDIDATE_SHA="${BASH_REMATCH[1]}"
          mkdir -p "${RUNNER_TEMP}/deploy-evidence"
          gh run download "${DEPLOY_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${ARTIFACT_NAME}" --dir "${RUNNER_TEMP}/deploy-evidence"
          test -f "${RUNNER_TEMP}/deploy-evidence/evidence.json"
          DEPLOY_EVIDENCE="$(cat "${RUNNER_TEMP}/deploy-evidence/evidence.json")"
          [[ "$(jq -r '.candidateSha // empty' <<<"${DEPLOY_EVIDENCE}")" == "${CANDIDATE_SHA}" ]] || {
            echo 'reason=DEPLOY_EVIDENCE_SHA_MISMATCH' >> "$GITHUB_OUTPUT"
            exit 0
          }

          ASSOCIATED_PRS="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/pulls")"
          PR_NUMBER="$(jq -r --arg sha "${CANDIDATE_SHA}" --arg repo "${GITHUB_REPOSITORY}" --arg base "${DEFAULT_BRANCH}" '[.[] | select(.state == "open" and .draft == false and .head.sha == $sha and .head.repo.full_name == $repo and .base.ref == $base)] | if length == 1 then .[0].number else empty end' <<<"${ASSOCIATED_PRS}")"
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] || {
            echo 'reason=SOURCE_PR_NOT_UNIQUE_READY' >> "$GITHUB_OUTPUT"
            exit 0
          }
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          PR_BODY="$(jq -r '.body // ""' <<<"${PR_JSON}")"
          mapfile -t ISSUE_REFS < <(printf '%s\n' "${PR_BODY}" | grep -Eio '^[[:space:]]*Closes[[:space:]]+#[0-9]+[[:space:]]*$' | grep -Eo '[0-9]+' || true)
          [[ "${#ISSUE_REFS[@]}" -eq 1 ]] || {
            echo 'reason=ROADMAP_ISSUE_REFERENCE_INVALID' >> "$GITHUB_OUTPUT"
            exit 0
          }
          ISSUE_NUMBER="${ISSUE_REFS[0]}"
          ISSUE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          ISSUE_BODY="$(jq -r '.body // ""' <<<"${ISSUE_JSON}")"
          if [[ "$(jq -r '.state' <<<"${ISSUE_JSON}")" != 'open' ]] || ! grep -Eq '^roadmap_id:[[:space:]]*PERF-REC-001[[:space:]]*$' <<<"${ISSUE_BODY}"; then
            exit 0
          fi

          STATUS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/status")"
          DEPLOY_STATE="$(jq -r '[.statuses[] | select(.context == "trusted-dev-deploy")][0].state // empty' <<<"${STATUS_JSON}")"
          [[ "${DEPLOY_STATE}" == 'success' ]] || {
            echo 'reason=TRUSTED_DEPLOY_STATUS_NOT_GREEN' >> "$GITHUB_OUTPUT"
            exit 0
          }

          echo 'eligible=true' >> "$GITHUB_OUTPUT"
          echo 'reason=READY_FOR_BASELINE' >> "$GITHUB_OUTPUT"
          echo "candidate_sha=${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Wait for authenticated runtime health
        id: health
        if: steps.candidate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'result=FAIL' >> "$GITHUB_OUTPUT"
          echo 'reason=TRUSTED_RUNTIME_HEALTH_TIMEOUT' >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 90); do
            STATUS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/status")"
            HEALTH_STATE="$(jq -r '[.statuses[] | select(.context == "trusted-runtime-health")][0].state // empty' <<<"${STATUS_JSON}")"
            if [[ "${HEALTH_STATE}" == 'success' ]]; then
              echo 'result=PASS' >> "$GITHUB_OUTPUT"
              echo 'reason=OK' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "${HEALTH_STATE}" == 'failure' || "${HEALTH_STATE}" == 'error' ]]; then
              echo 'reason=TRUSTED_RUNTIME_HEALTH_FAILED' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done

      - name: Prepare trusted owner authentication
        id: auth
        if: steps.health.outputs.result == 'PASS'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_API_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_API_DEPLOYMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLASPRC_JSON}" ]] || { echo '::error::Missing CLASPRC_JSON'; exit 1; }
          [[ "${APPS_SCRIPT_API_DEPLOYMENT_ID}" =~ ^AKfy[A-Za-z0-9_-]+$ ]] || { echo '::error::Invalid APPS_SCRIPT_API_DEPLOYMENT_ID'; exit 1; }
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"
          chmod 600 "${HOME}/.clasprc.json"
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync(process.env.HOME+'/.clasprc.json','utf8'));if(!a.tokens||!a.tokens['prihrash-ci'])throw new Error('named clasp profile missing')"

      - name: Collect 20 cold and 20 warm owner-authenticated samples
        id: samples
        if: steps.auth.outcome == 'success'
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          APPS_SCRIPT_API_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_API_DEPLOYMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'result=FAIL' >> "$GITHUB_OUTPUT"
          echo 'reason=PERF_BASELINE_SAMPLE_FAILED' >> "$GITHUB_OUTPUT"
          RAW="${RUNNER_TEMP}/perf-rec-samples.ndjson"
          : > "${RAW}"
          for pair in $(seq 1 20); do
            set +e
            COLD="$(node trusted/tools/perf-rec-baseline-exec.js COLD)"
            COLD_STATUS=$?
            set -e
            if [[ "${COLD_STATUS}" -ne 0 ]] || ! jq -e --arg sha "${CANDIDATE_SHA}" '.ok == true and .candidate_sha == $sha and .mode == "COLD"' >/dev/null <<<"${COLD}"; then
              rm -f "${RAW}"
              echo 'reason=COLD_SAMPLE_FAILED' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "${COLD}" >> "${RAW}"

            set +e
            WARM="$(node trusted/tools/perf-rec-baseline-exec.js WARM)"
            WARM_STATUS=$?
            set -e
            if [[ "${WARM_STATUS}" -ne 0 ]] || ! jq -e --arg sha "${CANDIDATE_SHA}" '.ok == true and .candidate_sha == $sha and .mode == "WARM"' >/dev/null <<<"${WARM}"; then
              rm -f "${RAW}"
              echo 'reason=WARM_SAMPLE_FAILED' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "${WARM}" >> "${RAW}"
          done
          [[ "$(wc -l < "${RAW}" | tr -d ' ')" == '40' ]] || {
            rm -f "${RAW}"
            echo 'reason=SAMPLE_COUNT_INVALID' >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo 'result=PASS' >> "$GITHUB_OUTPUT"
          echo 'reason=OK' >> "$GITHUB_OUTPUT"
          echo "raw_path=${RAW}" >> "$GITHUB_OUTPUT"

      - name: Build privacy-safe baseline evidence
        id: summary
        if: steps.samples.outputs.result == 'PASS'
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          RAW_PATH: ${{ steps.samples.outputs.raw_path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-rec-evidence
          echo 'result=FAIL' >> "$GITHUB_OUTPUT"
          echo 'reason=PERF_BASELINE_ACCEPTANCE_FAILED' >> "$GITHUB_OUTPUT"
          set +e
          SUMMARY_RESULT="$(node trusted/tools/perf-rec-baseline-summary.js "${RAW_PATH}" "${CANDIDATE_SHA}" perf-rec-evidence/evidence.json)"
          SUMMARY_STATUS=$?
          set -e
          rm -f "${RAW_PATH}"
          SUMMARY_OK="$(jq -r '.ok // false' <<<"${SUMMARY_RESULT}" 2>/dev/null || printf 'false')"
          SUMMARY_REASON="$(jq -r '.reason // "PERF_BASELINE_ACCEPTANCE_FAILED"' <<<"${SUMMARY_RESULT}" 2>/dev/null || printf 'PERF_BASELINE_ACCEPTANCE_FAILED')"
          [[ "${SUMMARY_REASON}" =~ ^[A-Z0-9_]+$ ]] || SUMMARY_REASON='PERF_BASELINE_ACCEPTANCE_FAILED'
          if [[ "${SUMMARY_STATUS}" -eq 0 && "${SUMMARY_OK}" == 'true' ]]; then
            echo 'result=PASS' >> "$GITHUB_OUTPUT"
            echo 'reason=OK' >> "$GITHUB_OUTPUT"
          else
            echo "reason=${SUMMARY_REASON}" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize sanitized failure evidence
        if: always() && steps.candidate.outputs.eligible == 'true'
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          HEALTH_RESULT: ${{ steps.health.outputs.result }}
          HEALTH_REASON: ${{ steps.health.outputs.reason }}
          SAMPLE_RESULT: ${{ steps.samples.outputs.result }}
          SAMPLE_REASON: ${{ steps.samples.outputs.reason }}
          SUMMARY_RESULT: ${{ steps.summary.outputs.result }}
          SUMMARY_REASON: ${{ steps.summary.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-rec-evidence
          if [[ -f perf-rec-evidence/evidence.json ]]; then exit 0; fi
          REASON="${HEALTH_REASON:-TRUSTED_BASELINE_NOT_COMPLETED}"
          [[ "${HEALTH_RESULT}" == 'PASS' ]] && REASON="${SAMPLE_REASON:-PERF_BASELINE_SAMPLE_FAILED}"
          [[ "${SAMPLE_RESULT}" == 'PASS' ]] && REASON="${SUMMARY_REASON:-PERF_BASELINE_ACCEPTANCE_FAILED}"
          [[ "${REASON}" =~ ^[A-Z0-9_]+$ ]] || REASON='TRUSTED_BASELINE_NOT_COMPLETED'
          jq -n --arg candidateSha "${CANDIDATE_SHA}" --arg reason "${REASON}" '{ok:false,schema:"PRH_PERF_REC_BASELINE_EVIDENCE_V1",roadmap_id:"PERF-REC-001",candidate_sha:$candidateSha,reason:$reason,evidence_scope:{owner_authenticated:false,financial_payload_included:false,row_values_included:false,labels_or_ids_included:false,web_app_locator_included:false,revision_hash_prefixes_published:false}}' > perf-rec-evidence/evidence.json
          rm -f "${RUNNER_TEMP}/perf-rec-samples.ndjson"

      - name: Upload privacy-safe PERF-REC evidence
        if: always() && steps.candidate.outputs.eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-rec-baseline-${{ steps.candidate.outputs.candidate_sha }}
          path: perf-rec-evidence/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish PERF-REC baseline status
        if: always() && steps.candidate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          HEALTH_RESULT: ${{ steps.health.outputs.result }}
          HEALTH_REASON: ${{ steps.health.outputs.reason }}
          SAMPLE_RESULT: ${{ steps.samples.outputs.result }}
          SAMPLE_REASON: ${{ steps.samples.outputs.reason }}
          SUMMARY_RESULT: ${{ steps.summary.outputs.result }}
          SUMMARY_REASON: ${{ steps.summary.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          STATE='failure'
          REASON="${HEALTH_REASON:-TRUSTED_BASELINE_NOT_COMPLETED}"
          if [[ "${HEALTH_RESULT}" == 'PASS' ]]; then REASON="${SAMPLE_REASON:-PERF_BASELINE_SAMPLE_FAILED}"; fi
          if [[ "${SAMPLE_RESULT}" == 'PASS' ]]; then REASON="${SUMMARY_REASON:-PERF_BASELINE_ACCEPTANCE_FAILED}"; fi
          if [[ "${SUMMARY_RESULT}" == 'PASS' ]]; then STATE='success'; REASON='HOME_BASELINE_PASS_ROUTE_SWITCH_PENDING'; fi
          [[ "${REASON}" =~ ^[A-Z0-9_]+$ ]] || REASON='TRUSTED_BASELINE_NOT_COMPLETED'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" -f state="${STATE}" -f context='perf-rec-baseline' -f description="PERF-REC ${REASON}" >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" -f state="${STATE}" -f context="perf-rec-baseline-reason:${REASON}" -f description='PERF-REC technical reason' >/dev/null

      - name: Enforce trusted Home baseline
        if: always() && steps.candidate.outputs.eligible == 'true'
        env:
          SUMMARY_RESULT: ${{ steps.summary.outputs.result }}
          SUMMARY_REASON: ${{ steps.summary.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${SUMMARY_RESULT}" != 'PASS' ]]; then
            echo "::error::PERF-REC owner-authenticated Home baseline failed closed: ${SUMMARY_REASON:-TRUSTED_BASELINE_NOT_COMPLETED}"
            exit 1
          fi
          echo 'PERF-REC owner-authenticated Home baseline: PASS; route-switch SLO remains a separate acceptance item.'
