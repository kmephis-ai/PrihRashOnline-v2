name: DASH-090 Runtime Boundary Materializer

on:
  push:
    branches:
      - agent/dash090-runtime-boundary-materializer-20260817-a

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/DASH-090-expert-dashboard-gallery
  EXPECTED_HEAD: d079dcef18183d295e2b2e59642baad98e1b914d
  EXPECTED_MAIN: 51d5798671478c9cbfe63dcfb88bfbf3f5152de3

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Verify exact writer state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$EXPECTED_HEAD"
      - name: Apply bounded repair
        shell: bash
        run: python "$GITHUB_WORKSPACE/tools/dash090-runtime-boundary-materializer.py"
      - name: Verify focused contracts and parser surface
        shell: bash
        run: |
          set -euo pipefail
          node tests/expert_dashboard_gallery_contract_test.js
          node tests/dashboard_saved_views_contract_test.js
          git diff --check
          git config user.name 'PrihRash Autonomous Writer'
          git config user.email 'prihrash-writer@example.invalid'
          git add lib/dashboard/dashboard_saved_views.js lib/dashboard/expert_dashboard_gallery.js ExpertDashboardGalleryService.js tests/expert_dashboard_gallery_contract_test.js
          git commit -m 'fix(DASH-090): keep compute engines out of gallery runtime projection'
          candidate="$(git rev-parse HEAD)"
          rm -rf "$RUNNER_TEMP/apps-script-candidate"
          node tools/build-apps-script-candidate.js --source . --out "$RUNNER_TEMP/apps-script-candidate" --sha "$candidate"
          python -c "import pathlib,re,sys; p=pathlib.Path(sys.argv[1]); t=p.read_text(encoding='utf-8'); m=re.search(r'(?<![A-Za-z0-9_$])\\d+n(?![A-Za-z0-9_$])',t); (not m) or (_ for _ in ()).throw(SystemExit('Apps Script-incompatible BigInt literal remains'))" "$RUNNER_TEMP/apps-script-candidate/files/R2CanonicalRuntimeBundle.js"
          git merge-base --is-ancestor "$EXPECTED_HEAD" "$candidate"
          git push origin "HEAD:$TARGET_BRANCH"
