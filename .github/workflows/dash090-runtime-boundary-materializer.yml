name: DASH-090 Runtime Boundary Materializer

on:
  push:
    branches:
      - agent/dash090-runtime-boundary-materializer-20260817-a

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/DASH-090-expert-dashboard-gallery
  EXPECTED_HEAD: d079dcef18183d295e2b2e59642baad98e1b914d
  EXPECTED_MAIN: 51d5798671478c9cbfe63dcfb88bfbf3f5152de3

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Verify exact writer state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$EXPECTED_HEAD"
      - name: Apply bounded dependency projection repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, got {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          saved = 'lib/dashboard/dashboard_saved_views.js'
          replace_once(saved,
              "const FACTORY = require('./widget_factory');\n",
              "const WIDGET_FACTORY_CAPABILITY = 'PRH_WIDGET_FACTORY_V1@1.0.0';\nlet FACTORY_CACHE = null;\n")
          replace_once(saved,
              "  COMPOSER.assertContract();\n  FACTORY.assertContract();\n  if (CONTRACT.upstream.dashboard_composer !== `${COMPOSER.SCHEMA}@${COMPOSER.VERSION}` ||\n      CONTRACT.upstream.widget_factory !== `${FACTORY.SCHEMA}@${FACTORY.VERSION}` ||\n",
              "  COMPOSER.assertContract();\n  if (CONTRACT.upstream.dashboard_composer !== `${COMPOSER.SCHEMA}@${COMPOSER.VERSION}` ||\n      CONTRACT.upstream.widget_factory !== WIDGET_FACTORY_CAPABILITY ||\n")
          replace_once(saved,
              "function normalizeBoundDescriptor(input) {\n  exactKeys(input,",
              "function widgetFactory_() {\n  if (!FACTORY_CACHE) {\n    const factory = require('./' + 'widget_factory');\n    factory.assertContract();\n    if (`${factory.SCHEMA}@${factory.VERSION}` !== WIDGET_FACTORY_CAPABILITY) fail('DASH084_UPSTREAM_CONTRACT_INVALID');\n    FACTORY_CACHE = factory;\n  }\n  return FACTORY_CACHE;\n}\n\nfunction normalizeBoundDescriptor(input) {\n  const FACTORY = widgetFactory_();\n  exactKeys(input,")

          gallery = 'lib/dashboard/expert_dashboard_gallery.js'
          replace_once(gallery,
              "const FACTORY = require('./widget_factory');\nconst DECOMP = require('../analytics/contribution_decomposition');\nconst SDC = require('../analytics/seasonality_distribution_concentration');\nconst TRENDS = require('../analytics/long_term_trends');\nconst RISK = require('../risk/liquidity_financial_risk');\nconst XRAY = require('../xray/financial_health_xray');\nconst ADV_VIZ = require('../visualization/advanced_visualization_pack');\n",
              "")
          old_cap = "const CAP = deepFreeze({\n  SAVED: capability(SAVED.SCHEMA, SAVED.VERSION),\n  COMPOSER: capability(COMPOSER.SCHEMA, COMPOSER.VERSION),\n  WIDGET_FACTORY: capability(FACTORY.SCHEMA, FACTORY.VERSION),\n  DECOMP: capability(DECOMP.SCHEMA, DECOMP.VERSION),\n  SDC: capability(SDC.SCHEMA, SDC.VERSION),\n  TRENDS: capability(TRENDS.SCHEMA, TRENDS.VERSION),\n  RISK: capability(RISK.SCHEMA, RISK.VERSION),\n  XRAY: capability(XRAY.SCHEMA, XRAY.VERSION),\n  ADV_VIZ: capability(ADV_VIZ.SCHEMA, ADV_VIZ.VERSION)\n});"
          new_cap = "const CAP = deepFreeze({\n  SAVED: capability(SAVED.SCHEMA, SAVED.VERSION),\n  COMPOSER: capability(COMPOSER.SCHEMA, COMPOSER.VERSION),\n  WIDGET_FACTORY: String(CONTRACT.upstream.widget_factory),\n  DECOMP: String(CONTRACT.upstream.contribution_decomposition),\n  SDC: String(CONTRACT.upstream.seasonality_distribution_concentration),\n  TRENDS: String(CONTRACT.upstream.long_term_trends),\n  RISK: String(CONTRACT.upstream.liquidity_financial_risk),\n  XRAY: String(CONTRACT.upstream.financial_health_xray),\n  ADV_VIZ: String(CONTRACT.upstream.advanced_visualization_pack)\n});"
          replace_once(gallery, old_cap, new_cap)
          replace_once(gallery,
              "  SAVED.assertContract(); COMPOSER.assertContract(); FACTORY.assertContract(); DECOMP.assertContract(); SDC.assertContract(); TRENDS.assertContract(); RISK.assertContract(); XRAY.assertContract(); ADV_VIZ.assertContract();\n",
              "  SAVED.assertContract(); COMPOSER.assertContract();\n")

          service = 'ExpertDashboardGalleryService.js'
          p = Path(service)
          text = p.read_text(encoding='utf-8')
          start = text.index('function prhDash090StoreFromStorage_() {')
          end = text.index('\nfunction prhDash090FindView_', start)
          replacement = r'''function prhDash090ProjectionFromSnapshot_(snapshot, viewId) {
  var runtime = prhDash090Runtime_();
  if (viewId == null) return runtime.dashboardSavedViews.hydrateStore(snapshot.generation, []);
  var id = prhDash084StorageViewId_(viewId);
  var text = snapshot.view_json_by_id[id];
  if (!text) throw new Error('DASH090_STORAGE_VIEW_MISSING:' + id);
  return runtime.dashboardSavedViews.hydrateStore(snapshot.generation, [JSON.parse(text)]);
}
'''
          text = text[:start] + replacement + text[end:]
          start = text.index('function prhDash090CommitOperation_(')
          end = text.index('\nfunction prhDash090PublicCatalog', start)
          replacement = r'''function prhDash090CommitOperation_(snapshot, operation, viewId, createMode) {
  if (operation.store.generation === snapshot.generation) return null;
  if (operation.store.generation !== snapshot.generation + 1) throw new Error('DASH090_STORE_GENERATION_INVALID');
  var runtime = prhDash090Runtime_();
  var id = prhDash084StorageViewId_(viewId);
  var ids = snapshot.index.view_ids.slice();
  var present = ids.indexOf(id) >= 0;
  if (createMode === true) {
    if (present) throw new Error('DASH090_VIEW_ID_CONFLICT');
    ids.push(id);
  } else if (!present) {
    throw new Error('DASH090_VIEW_NOT_FOUND');
  }
  ids.sort();
  var view = prhDash090FindView_(operation.store, id);
  return prhDash084StorageCommit_({
    expected_generation: snapshot.generation,
    view_id: id,
    index_json: JSON.stringify({schema:'PRH_DASHBOARD_SAVED_VIEW_INDEX_V1',contract_version:'1.0.0',generation:operation.store.generation,view_ids:ids}),
    view_json: runtime.dashboardSavedViews.serializeView(view)
  });
}
'''
          text = text[:start] + replacement + text[end:]
          old_clone = "  var store = prhDash090StoreFromStorage_();\n  var result = gallery.cloneToSavedView(store, presetId, {\n    view_id: request.view_id,\n    name: request.name\n  }, store.generation, gallery.allAvailableCapabilities());\n  prhDash090CommitOperation_(store, result, result.view_id);"
          new_clone = "  var snapshot = prhDash084StorageReadSnapshot_();\n  var id = prhDash084StorageViewId_(request.view_id);\n  if (snapshot.index.view_ids.indexOf(id) >= 0) throw new Error('DASH090_VIEW_ID_CONFLICT');\n  var store = prhDash090ProjectionFromSnapshot_(snapshot, null);\n  var result = gallery.cloneToSavedView(store, presetId, {\n    view_id: id,\n    name: request.name\n  }, store.generation, gallery.allAvailableCapabilities());\n  prhDash090CommitOperation_(snapshot, result, result.view_id, true);"
          if text.count(old_clone) != 1: raise SystemExit('clone block mismatch')
          text = text.replace(old_clone, new_clone)
          old_read = "  var store = prhDash090StoreFromStorage_();\n  return prhDash090ViewSummary_(store, prhDash090FindView_(store, request.view_id));"
          new_read = "  var snapshot = prhDash084StorageReadSnapshot_();\n  var store = prhDash090ProjectionFromSnapshot_(snapshot, request.view_id);\n  return prhDash090ViewSummary_(store, prhDash090FindView_(store, request.view_id));"
          if text.count(old_read) != 1: raise SystemExit('read block mismatch')
          text = text.replace(old_read, new_read)
          old_save = "  var store = prhDash090StoreFromStorage_();\n  if (!Number.isInteger(request.expected_generation) || request.expected_generation !== store.generation) throw new Error('DASH090_STORE_GENERATION_CONFLICT');"
          new_save = "  var snapshot = prhDash084StorageReadSnapshot_();\n  var store = prhDash090ProjectionFromSnapshot_(snapshot, request.view_id);\n  if (!Number.isInteger(request.expected_generation) || request.expected_generation !== store.generation) throw new Error('DASH090_STORE_GENERATION_CONFLICT');"
          if text.count(old_save) != 1: raise SystemExit('save block mismatch')
          text = text.replace(old_save, new_save)
          old_commit = "  prhDash090CommitOperation_(store, operation, view.view_id);"
          new_commit = "  prhDash090CommitOperation_(snapshot, operation, view.view_id, false);"
          if text.count(old_commit) != 1: raise SystemExit('save commit mismatch')
          text = text.replace(old_commit, new_commit)
          p.write_text(text, encoding='utf-8')

          test = Path('tests/expert_dashboard_gallery_contract_test.js')
          text = test.read_text(encoding='utf-8')
          imports = "const FACTORY = require('../lib/dashboard/widget_factory');\n"
          expanded = imports + "const DECOMP = require('../lib/analytics/contribution_decomposition');\nconst SDC = require('../lib/analytics/seasonality_distribution_concentration');\nconst TRENDS = require('../lib/analytics/long_term_trends');\nconst RISK = require('../lib/risk/liquidity_financial_risk');\nconst XRAY = require('../lib/xray/financial_health_xray');\nconst ADV_VIZ = require('../lib/visualization/advanced_visualization_pack');\n"
          if text.count(imports) != 1: raise SystemExit('test imports mismatch')
          text = text.replace(imports, expanded)
          anchor = "assert.strictEqual(GALLERY.CONTRACT.principles.free_only, true);\n"
          parity = "assert.strictEqual(GALLERY.CAP.WIDGET_FACTORY, `${FACTORY.SCHEMA}@${FACTORY.VERSION}`);\nassert.strictEqual(GALLERY.CAP.DECOMP, `${DECOMP.SCHEMA}@${DECOMP.VERSION}`);\nassert.strictEqual(GALLERY.CAP.SDC, `${SDC.SCHEMA}@${SDC.VERSION}`);\nassert.strictEqual(GALLERY.CAP.TRENDS, `${TRENDS.SCHEMA}@${TRENDS.VERSION}`);\nassert.strictEqual(GALLERY.CAP.RISK, `${RISK.SCHEMA}@${RISK.VERSION}`);\nassert.strictEqual(GALLERY.CAP.XRAY, `${XRAY.SCHEMA}@${XRAY.VERSION}`);\nassert.strictEqual(GALLERY.CAP.ADV_VIZ, `${ADV_VIZ.SCHEMA}@${ADV_VIZ.VERSION}`);\n"
          if text.count(anchor) != 1: raise SystemExit('test parity anchor mismatch')
          text = text.replace(anchor, anchor + parity)
          anchor = "const runtimeCatalog = sandbox.prhDash090PublicCatalog();\n"
          opaque = "const opaqueLegacy = JSON.stringify({schema:'PRH_DASHBOARD_SAVED_VIEW_V1',contract_version:'1.0.0',view_id:'legacy-bound',opaque_bound_marker:true});\nmap.set('PRH_DASH084_V1:INDEX', JSON.stringify({schema:'PRH_DASHBOARD_SAVED_VIEW_INDEX_V1',contract_version:'1.0.0',generation:7,view_ids:['legacy-bound']}));\nmap.set('PRH_DASH084_V1:VIEW:legacy-bound', opaqueLegacy);\n"
          if text.count(anchor) != 1: raise SystemExit('test opaque anchor mismatch')
          text = text.replace(anchor, anchor + opaque)
          anchor = "assert(sandbox.prhDash084StorageReadView_('dash090-spending-drivers-test'));\n"
          preserve = "assert.strictEqual(map.get('PRH_DASH084_V1:VIEW:legacy-bound'), opaqueLegacy);\nassert.deepStrictEqual(Array.from(sandbox.prhDash084StorageReadIndex_().view_ids), ['dash090-spending-drivers-test','legacy-bound']);\n"
          if text.count(anchor) != 1: raise SystemExit('test preserve anchor mismatch')
          text = text.replace(anchor, anchor + preserve)
          test.write_text(text, encoding='utf-8')
          PY
      - name: Focused contracts and candidate parser surface
        shell: bash
        run: |
          set -euo pipefail
          node tests/expert_dashboard_gallery_contract_test.js
          node tests/dashboard_saved_views_contract_test.js
          git diff --check
          git config user.name 'PrihRash Autonomous Writer'
          git config user.email 'prihrash-writer@example.invalid'
          git add lib/dashboard/dashboard_saved_views.js lib/dashboard/expert_dashboard_gallery.js ExpertDashboardGalleryService.js tests/expert_dashboard_gallery_contract_test.js
          git commit -m 'fix(DASH-090): keep compute engines out of gallery runtime projection'
          candidate="$(git rev-parse HEAD)"
          rm -rf "$RUNNER_TEMP/apps-script-candidate"
          node tools/build-apps-script-candidate.js --source . --out "$RUNNER_TEMP/apps-script-candidate" --sha "$candidate"
          python - "$RUNNER_TEMP/apps-script-candidate/files/R2CanonicalRuntimeBundle.js" <<'PY'
          import re, sys
          from pathlib import Path
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          hits=list(re.finditer(r'(?<![A-Za-z0-9_$])\d+n(?![A-Za-z0-9_$])', text))
          if hits:
              line=text.count('\n',0,hits[0].start())+1
              raise SystemExit(f'Apps Script-incompatible BigInt literal remains at line {line}: {hits[0].group(0)}')
          print('DASH-090 Apps Script parser surface: no BigInt numeric literals')
          PY
          git merge-base --is-ancestor "$EXPECTED_HEAD" "$candidate"
          git push origin "HEAD:$TARGET_BRANCH"
