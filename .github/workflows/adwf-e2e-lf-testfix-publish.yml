name: ADWF E2E-LF Test Fix Exact Publish

on:
  push:
    branches:
      - agent/e2e-lf-testfix-publish-20260816-a1

permissions:
  contents: write

env:
  EXPECTED_OLD: ef4808cc4220385a5eb136bf9512b558d92d47a2
  EXPECTED_HEAD: c391459eae40af25eb11e537895ce852940d4f3f
  EXPECTED_TREE: bc9762e22e54d27ac3ae6e0b501de310c08116c2
  WRITER_BRANCH: agent/E2E-LF-001-product-ready-local-first

jobs:
  publish-exact-local-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify writer has not moved
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_OLD}"

      - name: Reproduce exact local commit
        shell: bash
        run: |
          set -euo pipefail
          cp .adwf-transport/e2e-lf-testfix.patch /tmp/e2e-lf-testfix.patch
          git checkout --detach "${EXPECTED_OLD}"
          git apply --check /tmp/e2e-lf-testfix.patch
          git apply /tmp/e2e-lf-testfix.patch
          git add tests/local_first_product_ready_visual_test.js
          TREE="$(git write-tree)"
          test "${TREE}" = "${EXPECTED_TREE}"
          COMMIT="$(printf '%s\n' '[E2E-LF-001] Align Product Ready E2E with owner-facing degraded copy' | env \
            GIT_AUTHOR_NAME='kmephis-ai' GIT_AUTHOR_EMAIL='kmephis@gmail.com' GIT_AUTHOR_DATE='@1786837253 +0000' \
            GIT_COMMITTER_NAME='kmephis-ai' GIT_COMMITTER_EMAIL='kmephis@gmail.com' GIT_COMMITTER_DATE='@1786837253 +0000' \
            git commit-tree "${TREE}" -p "${EXPECTED_OLD}")"
          test "${COMMIT}" = "${EXPECTED_HEAD}"

      - name: Fast-forward exact commit to writer
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${EXPECTED_HEAD}:refs/heads/${WRITER_BRANCH}"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"

      - name: Publish evidence
        shell: bash
        run: |
          {
            echo '## ADWF E2E-LF exact test-fix publish PASS'
            echo
            echo "- writer: \`${WRITER_BRANCH}\`"
            echo "- old: \`${EXPECTED_OLD}\`"
            echo "- head: \`${EXPECTED_HEAD}\`"
            echo "- tree: \`${EXPECTED_TREE}\`"
            echo '- mode: exact local commit object, ordinary fast-forward, no force push'
          } >> "$GITHUB_STEP_SUMMARY"
