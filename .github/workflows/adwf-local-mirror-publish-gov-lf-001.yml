name: ADWF Local Mirror Publish GOV-LF-001

on:
  push:
    branches:
      - agent/local-mirror-gov-lf-001-20260816-a1
    paths:
      - .github/workflows/adwf-local-mirror-publish-gov-lf-001.yml

permissions:
  contents: write

jobs:
  publish-exact-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_BASE_SHA: 2b03cb15857f2812c46e0ba7f36eaf52fa21f252
      TARGET_REF: refs/heads/agent/GOV-LF-001-roadmap-v25-consolidation
      EXPECTED_BASE64_BYTES: 3376
      EXPECTED_GZIP_SHA256: 6b1e0b0992925f56ee01683bf73ae8de6c4da6eabdc430ff70a7d7a94aed13dd
      EXPECTED_PATCH_SHA256: 64a7c112dd2b3e5eae595a9be2ef9cea49ca1a05bacc9886df7681d2b4ce1c38
      EXPECTED_PATCH_BYTES: 6724
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Reassemble and verify staged patch outside checkout
        shell: bash
        run: |
          set -euo pipefail
          chunks=(.adwf/transport/gov-lf-001-ci-repair/chunk-*.b64)
          test "${#chunks[@]}" -eq 1
          cat "${chunks[@]}" > /tmp/gov-lf-001-ci-repair.patch.gz.b64
          test "$(wc -c < /tmp/gov-lf-001-ci-repair.patch.gz.b64 | tr -d ' ')" = "${EXPECTED_BASE64_BYTES}"
          base64 -d /tmp/gov-lf-001-ci-repair.patch.gz.b64 > /tmp/gov-lf-001-ci-repair.patch.gz
          printf '%s  %s\n' "${EXPECTED_GZIP_SHA256}" /tmp/gov-lf-001-ci-repair.patch.gz | sha256sum -c -
          gzip -dc /tmp/gov-lf-001-ci-repair.patch.gz > /tmp/gov-lf-001-ci-repair.patch
          printf '%s  %s\n' "${EXPECTED_PATCH_SHA256}" /tmp/gov-lf-001-ci-repair.patch | sha256sum -c -
          test "$(wc -c < /tmp/gov-lf-001-ci-repair.patch | tr -d ' ')" = "${EXPECTED_PATCH_BYTES}"
          grep -q '^diff --git ' /tmp/gov-lf-001-ci-repair.patch

      - name: Verify exact remote writer head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin "${TARGET_REF}" | awk '{print $1}')"
          test -n "${actual}"
          test "${actual}" = "${EXPECTED_BASE_SHA}"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}"

      - name: Apply exact Local Git Mirror repair patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B adwf-publish "${EXPECTED_BASE_SHA}"
          git apply --check /tmp/gov-lf-001-ci-repair.patch
          git apply /tmp/gov-lf-001-ci-repair.patch
          git diff --check

      - name: Verify intended repair surface
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EOF'
          docs/operations/AIENG003_MULTI_AI_REVIEW_PROTOCOL.md
          llms.txt
          tools/ai-contract-scan.js
          EOF
          LC_ALL=C sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --name-only | LC_ALL=C sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Run failed gate and GOV-LF regression set
        shell: bash
        run: |
          set -euo pipefail
          node tools/ai-contract-scan.js
          node tests/roadmap_task_protocol_contract_test.js
          node tests/local_first_architecture_policy_contract_test.js
          node tests/local_first_product_ready_runtime_test.js
          node tools/docs-drift-scan.js
          node tools/language-policy-scan.js
          node tests/language_policy_contract_test.js
          node tools/verify-adwf-local-git-mirror.js
          node tests/test_architecture_contract_test.js
          node tests/security_privacy_policy_contract_test.js
          node tools/free-only-scan.js
          node tools/privacy-public-data-scan.js
          node tools/secret-scan.js

      - name: Commit CI-red recovery on same writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/operations/AIENG003_MULTI_AI_REVIEW_PROTOCOL.md \
            llms.txt \
            tools/ai-contract-scan.js
          git diff --cached --name-only | LC_ALL=C sort > /tmp/staged-files.txt
          diff -u /tmp/expected-files.txt /tmp/staged-files.txt
          test -z "$(git ls-files --others --exclude-standard)"
          git commit -m "[GOV-LF-001] Синхронизировать AI contract с Roadmap v2.5"

      - name: Recheck race and publish fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin "${TARGET_REF}" | awk '{print $1}')"
          test "${actual}" = "${EXPECTED_BASE_SHA}"
          git merge-base --is-ancestor "${EXPECTED_BASE_SHA}" HEAD
          git push origin "HEAD:${TARGET_REF}"
