name: Release Observer

on:
  workflow_run:
    workflows:
      - Chat-Driven DEV Release
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report completed release run to active agent PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --state open \
            --json number,headRefName,updatedAt \
            --jq '[.[] | select(.headRefName | startswith("agent/"))] | sort_by(.updatedAt) | last | .number // empty')"

          if [[ -z "${PR_NUMBER}" ]]; then
            echo 'No active agent PR; nothing to report.'
            exit 0
          fi

          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "🔎 Release observer: run \`${RUN_ID}\` completed with \`${CONCLUSION}\`. Event: \`${RUN_EVENT}\`; workflow head: \`${RUN_HEAD_BRANCH}\` @ \`${RUN_HEAD_SHA}\`. ${RUN_URL}"
