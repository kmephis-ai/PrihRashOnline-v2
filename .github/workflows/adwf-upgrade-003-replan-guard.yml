name: ADWF UPGRADE-003 Replan Guard

on:
  pull_request:
    branches:
      - helper/adwf-upgrade-003-replan-base-20260819-a2
    types: [opened]

permissions:
  contents: read
  actions: read

env:
  CONSUMER_SHA: 59bb5319052f378f10a0216ee3956f12944c0b77
  SOURCE_SHA: 017042c1f2bcde8d89d4b344201e848d873ec5a9
  TARGET_SHA: 86d943b03a1fc591b5b533d1ac211da93dc70694
  TARGET_TREE: d75b43087ee6ebe3c773866936161028ad92749c
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  replan-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/PrihRashOnline-v2
          ref: ${{ env.CONSUMER_SHA }}
          path: consumer
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/AI-Development-Framework
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/AI-Development-Framework
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Fresh provider governance readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('consumer/.adwf').resolve()))
          from lib.github_provider import GitHubClient
          from lib.github_rulesets import verify_rulesets, verify_runtime_anchor_ruleset
          client = GitHubClient(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_TOKEN'])
          current_main = str((client.branch('main').get('commit') or {}).get('sha') or '')
          if current_main != os.environ['CONSUMER_SHA']:
              raise SystemExit('CONSUMER_MAIN_DRIFT')
          full = client.rulesets()
          main = verify_rulesets(full, expected_integration_id=15368)
          anchors = verify_runtime_anchor_ruleset(full)
          out = {'consumer_main': current_main, 'main_ruleset': main, 'runtime_anchors': anchors, 'ruleset_ids': [x.get('id') for x in full if isinstance(x, dict)]}
          print(json.dumps(out, sort_keys=True), flush=True)
          if main.get('status') != 'VERIFIED' or anchors.get('status') != 'VERIFIED':
              raise SystemExit('GOVERNANCE_NOT_VERIFIED')
          PY
      - name: Fresh canonical A-to-B planner
        shell: bash
        run: |
          set -euo pipefail
          python consumer/.adwf/scripts/plan_consumer_upgrade.py \
            --source-root source --target-root target --consumer-root consumer \
            --source-revision "$SOURCE_SHA" --target-revision "$TARGET_SHA" \
            > "$RUNNER_TEMP/bundle.json"
          python - "$RUNNER_TEMP/bundle.json" <<'PY'
          import json, os, subprocess, sys
          b = json.load(open(sys.argv[1], encoding='utf-8'))
          c = b.get('compatibility') or {}
          p = b.get('plan') or {}
          tree = subprocess.check_output(['git','-C','target','rev-parse','HEAD^{tree}'], text=True).strip()
          out = {
              'compatibility_status': c.get('status'),
              'plan_status': p.get('status'),
              'findings': c.get('findings') or [],
              'target_tree': tree,
              'expected_target_tree': os.environ['TARGET_TREE'],
              'changed_paths': p.get('changed_paths') or p.get('paths') or []
          }
          print(json.dumps(out, sort_keys=True), flush=True)
          if tree != os.environ['TARGET_TREE']:
              raise SystemExit('TARGET_TREE_MISMATCH')
          if c.get('status') != 'PASS' or p.get('status') != 'READY':
              raise SystemExit('UPGRADE_PLAN_NOT_READY')
          PY
