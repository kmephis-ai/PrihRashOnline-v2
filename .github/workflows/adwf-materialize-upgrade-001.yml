name: ADWF-UPGRADE-001 Exact Transaction Materializer

on:
  push:
    branches:
      - agent/materializer-ADWF-UPGRADE-001-20260817-m1

permissions:
  contents: write

env:
  CONSUMER_SHA: c5fe7a6666dde24551f310198ba45dc3765dd735
  CONSUMER_TREE: ccdf615967cba7f592ef295707794ea068c9bd8b
  SOURCE_A: e3bd9fb33f699ae227521f7ed5866c8f11589ed4
  SOURCE_A_TREE: b86213004ea44085f0bc337f6e0212318d0a2f8f
  TARGET_B: 278014b98f606705e7ccd89c6faa5c95df530cd8
  TARGET_B_TREE: 1ab41e5a9b8b2241a523ed1b4c507bf41314d7bd
  TARGET_BRANCH: agent/ADWF-UPGRADE-001-consumer-framework-upgrade
  GITHUB_REPOSITORY_EXPECTED: kmephis-ai/PrihRashOnline-v2
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PrihRash source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CONSUMER_SHA }}
          fetch-depth: 0
          persist-credentials: true
          path: consumer

      - name: Checkout exact installed ADWF A
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/AI-Development-Framework
          ref: ${{ env.SOURCE_A }}
          fetch-depth: 1
          persist-credentials: false
          path: framework-a

      - name: Checkout exact target ADWF B
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/AI-Development-Framework
          ref: ${{ env.TARGET_B }}
          fetch-depth: 1
          persist-credentials: false
          path: framework-b

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'

      - name: Verify exact identities and sealed source installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C consumer rev-parse HEAD)" = "${CONSUMER_SHA}"
          test "$(git -C consumer rev-parse HEAD^{tree})" = "${CONSUMER_TREE}"
          test "$(git -C framework-a rev-parse HEAD)" = "${SOURCE_A}"
          test "$(git -C framework-a rev-parse HEAD^{tree})" = "${SOURCE_A_TREE}"
          test "$(git -C framework-b rev-parse HEAD)" = "${TARGET_B}"
          test "$(git -C framework-b rev-parse HEAD^{tree})" = "${TARGET_B_TREE}"
          test -z "$(git -C consumer status --porcelain)"
          python - <<'PY'
          import hashlib,json
          rec=json.load(open('consumer/.adwf-consumer/installation.json',encoding='utf-8'))
          assert rec['framework']['source_sha'] == 'e3bd9fb33f699ae227521f7ed5866c8f11589ed4'
          assert rec['framework']['source_tree'] == 'b86213004ea44085f0bc337f6e0212318d0a2f8f'
          assert rec['framework']['manifest_sha256'] == '41e2a611f1342dda473cb0312c0e9830a28e8535347f64d0aab134c3e76a9ca0'
          assert hashlib.sha256(open('framework-a/MANIFEST.json','rb').read()).hexdigest() == rec['framework']['manifest_sha256']
          print('SEALED_SOURCE_A=VERIFIED')
          PY
          sha256sum consumer/AGENTS.md | tee /tmp/agents-before.sha256

      - name: Fresh read-only A to B planner
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY_EXPECTED }}
        run: |
          set -euo pipefail
          python framework-b/.adwf/scripts/plan_consumer_upgrade.py \
            --source-root framework-a \
            --target-root framework-b \
            --consumer-root consumer \
            --source-revision "${SOURCE_A}" \
            --target-revision "${TARGET_B}" > /tmp/plan-bundle.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/plan-bundle.json'))
          assert d['compatibility']['status']=='PASS', d['compatibility']
          assert d['plan']['status']=='READY', d['plan']
          assert d['compatibility']['findings']==[], d['compatibility']['findings']
          assert d['plan']['findings']==[], d['plan']['findings']
          for key,path in [('compatibility','/tmp/compatibility.json'),('plan','/tmp/plan.json')]:
              with open(path,'w',encoding='utf-8') as f:
                  json.dump(d[key],f,ensure_ascii=False,indent=2,sort_keys=True); f.write('\n')
          print('PLANNER=PASS_READY')
          print('compatibility_sha256='+d['compatibility']['compatibility_sha256'])
          print('plan_sha256='+d['plan']['plan_sha256'])
          PY

      - name: Apply A to B and verify durable projection
        id: first_apply
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY_EXPECTED }}
        run: |
          set -euo pipefail
          python framework-b/.adwf/scripts/apply_consumer_upgrade.py apply \
            --source-root framework-a \
            --target-root framework-b \
            --consumer-root consumer \
            --compatibility /tmp/compatibility.json \
            --plan /tmp/plan.json > /tmp/apply-1.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/apply-1.json'))
          assert d['status']=='COMMITTED', d
          assert d.get('projection_status')=='COMMITTED', d
          assert d.get('write_performed') is True, d
          print('FIRST_APPLY=COMMITTED')
          print('transaction_id='+d['transaction_id'])
          with open('/tmp/txid','w') as f: f.write(d['transaction_id'])
          rec=json.load(open('consumer/.adwf-consumer/installation.json'))
          assert rec['framework']['source_sha']=='278014b98f606705e7ccd89c6faa5c95df530cd8', rec['framework']
          for p in ('consumer/.adwf-consumer/operations.json','consumer/.adwf-consumer/gates.json'):
              json.load(open(p))
          PY

      - name: Fresh-session B proof from different path without runtime journal
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY_EXPECTED }}
        run: |
          set -euo pipefail
          rm -rf /tmp/fresh-b
          cp -a consumer /tmp/fresh-b
          rm -rf /tmp/fresh-b/.adwf-runtime
          python - <<'PY'
          import os,sys,json
          sys.path.insert(0,os.path.abspath('framework-b/.adwf'))
          from lib.consumer_installation import validate_fresh_session
          from lib.consumer_operational import load_binding as load_ops
          from lib.consumer_gates import load_binding as load_gates
          r=validate_fresh_session('/tmp/fresh-b','framework-b',expected_repository='kmephis-ai/PrihRashOnline-v2')
          assert r['status']=='VERIFIED',r
          ops=load_ops('/tmp/fresh-b','framework-b')
          gates=load_gates('/tmp/fresh-b','framework-b')
          assert ops['roadmap']['path']=='docs/ROADMAP.md',ops
          assert gates['phases']['pr'][0]['check_name']=='validate',gates
          assert gates['phases']['main'][0]['check_name']=='verify',gates
          print('FRESH_SESSION_B=VERIFIED')
          PY

      - name: Idempotent B re-apply is no-write
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY_EXPECTED }}
        run: |
          set -euo pipefail
          python framework-b/.adwf/scripts/apply_consumer_upgrade.py apply \
            --source-root framework-a \
            --target-root framework-b \
            --consumer-root consumer \
            --compatibility /tmp/compatibility.json \
            --plan /tmp/plan.json > /tmp/apply-idempotent.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/apply-idempotent.json'))
          assert d['status']=='ALREADY_COMMITTED',d
          assert d['write_performed'] is False,d
          print('IDEMPOTENT_REAPPLY=NO_WRITE')
          PY

      - name: Roll back B to exact A
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY_EXPECTED }}
        run: |
          set -euo pipefail
          txid="$(cat /tmp/txid)"
          python framework-b/.adwf/scripts/apply_consumer_upgrade.py rollback \
            --source-root framework-a \
            --target-root framework-b \
            --consumer-root consumer \
            --transaction-id "${txid}" > /tmp/rollback.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/rollback.json'))
          assert d['status']=='ROLLED_BACK',d
          rec=json.load(open('consumer/.adwf-consumer/installation.json'))
          assert rec['framework']['source_sha']=='e3bd9fb33f699ae227521f7ed5866c8f11589ed4',rec['framework']
          print('ROLLBACK=A_EXACT')
          PY
          rm -rf consumer/.adwf-runtime
          test -z "$(git -C consumer status --porcelain)"
          test "$(git -C consumer write-tree)" = "${CONSUMER_TREE}"

      - name: Fresh A to B after journal removal
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY_EXPECTED }}
        run: |
          set -euo pipefail
          python framework-b/.adwf/scripts/plan_consumer_upgrade.py \
            --source-root framework-a \
            --target-root framework-b \
            --consumer-root consumer \
            --source-revision "${SOURCE_A}" \
            --target-revision "${TARGET_B}" > /tmp/plan-bundle-2.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/plan-bundle-2.json'))
          assert d['compatibility']['status']=='PASS' and d['plan']['status']=='READY',d
          for key,path in [('compatibility','/tmp/compatibility-2.json'),('plan','/tmp/plan-2.json')]:
              with open(path,'w',encoding='utf-8') as f:
                  json.dump(d[key],f,ensure_ascii=False,indent=2,sort_keys=True); f.write('\n')
          PY
          python framework-b/.adwf/scripts/apply_consumer_upgrade.py apply \
            --source-root framework-a \
            --target-root framework-b \
            --consumer-root consumer \
            --compatibility /tmp/compatibility-2.json \
            --plan /tmp/plan-2.json > /tmp/apply-2.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/apply-2.json'))
          assert d['status']=='COMMITTED',d
          assert d.get('projection_status')=='COMMITTED',d
          print('FRESH_REAPPLY_B=COMMITTED')
          PY

      - name: Verify publishable surface has zero product drift
        shell: bash
        run: |
          set -euo pipefail
          rm -rf consumer/.adwf-runtime
          sha256sum consumer/AGENTS.md > /tmp/agents-after.sha256
          diff -u /tmp/agents-before.sha256 /tmp/agents-after.sha256
          git -C consumer diff --check
          git -C consumer diff --name-only "${CONSUMER_SHA}" | sort > /tmp/changed-paths
          python - <<'PY'
          import json
          plan=json.load(open('/tmp/plan-2.json'))
          allowed={e['path'] for e in plan['entries'] if e['action'] in {'REPLACE_PLANNED','CREATE_PLANNED'}}
          allowed |= {
              '.adwf-consumer/installation.json',
              '.adwf-consumer/operations.json',
              '.adwf-consumer/gates.json',
          }
          changed=[line.strip() for line in open('/tmp/changed-paths') if line.strip()]
          forbidden=[p for p in changed if p not in allowed]
          if forbidden:
              raise SystemExit('FORBIDDEN_PRODUCT_OR_SHARED_DIFF:'+','.join(forbidden))
          assert changed, 'EMPTY_UPGRADE_DIFF'
          assert all(not p.startswith('.adwf-runtime/') for p in changed)
          print('PUBLISHABLE_PATHS='+str(len(changed)))
          print('PRODUCT_FIN_DRIFT=NO')
          print('\n'.join(changed))
          PY
          test -z "$(git -C consumer status --porcelain --untracked-files=all | awk '$1 == "??" {print}')"

      - name: Verify installed B package and framework self-test
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ env.GITHUB_REPOSITORY_EXPECTED }}
        run: |
          set -euo pipefail
          python consumer/.adwf/adwf.py doctor --scope package_integrity
          python consumer/.adwf/adwf.py doctor --scope config_health
          python consumer/.adwf/adwf.py self-test

      - name: Commit exact B and CAS-publish canonical integration writer
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git -C consumer ls-remote origin refs/heads/main | awk '{print $1}')"
          remote_writer="$(git -C consumer ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_main}" = "${CONSUMER_SHA}"
          test "${remote_writer}" = "${CONSUMER_SHA}"
          git -C consumer checkout -B upgrade-candidate "${CONSUMER_SHA}"
          git -C consumer add -A
          tree="$(git -C consumer write-tree)"
          echo "candidate_tree=${tree}"
          git -C consumer config user.name 'ADWF Autonomous Writer'
          git -C consumer config user.email 'adwf-writer@example.invalid'
          git -C consumer commit -m 'ADWF-UPGRADE-001: upgrade connected framework to 278014b'
          candidate="$(git -C consumer rev-parse HEAD)"
          test "$(git -C consumer rev-parse HEAD^)" = "${CONSUMER_SHA}"
          git -C consumer push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          mkdir -p proof
          python - <<PY
          import json
          proof={
            'schema_version':1,
            'role':'ADWF_CONNECTED_CONSUMER_UPGRADE_PROOF',
            'consumer_base':'${CONSUMER_SHA}',
            'source_a':'${SOURCE_A}',
            'target_b':'${TARGET_B}',
            'candidate_sha':'${candidate}',
            'candidate_tree':'${tree}',
            'planner':'PASS_READY',
            'first_apply':'COMMITTED',
            'fresh_session_b':'VERIFIED',
            'idempotent_reapply':'ALREADY_COMMITTED_NO_WRITE',
            'rollback':'EXACT_A',
            'fresh_reapply':'COMMITTED',
            'product_fin_drift':'NO',
            'monetary_budget_usd':0,
          }
          open('proof/upgrade-proof.json','w').write(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          print(json.dumps(proof,sort_keys=True))
          PY

      - name: Upload public-safe proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adwf-upgrade-001-provider-proof
          path: proof/upgrade-proof.json
          if-no-files-found: error
          retention-days: 1
