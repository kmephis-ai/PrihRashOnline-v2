name: RISK-030 Exact Patch Runner

on:
  push:
    branches:
      - agent/local-mirror-RISK-030-20260817-a

permissions:
  contents: write

env:
  BASE_SHA: 2f9753d609b7ef05ec1993f7e36628b60de545db
  TARGET_BRANCH: agent/RISK-030-liquidity-financial-risk
  EXPECTED_TREE: e4aa2f221e8e6b63eab98412da4099e159c5d169
  PATCH_GZIP_SHA256: 2545cd7c8d2ad7b160cfe908ec833dee16cec57f70cb76b761968f13c04ae24c
  PATCH_SHA256: 36da91a0ada3b13f684f82cf46ce3fbbdfac4655044709ee17554878fa498088

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read sealed payload from transport commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/local-mirror-RISK-030-20260817-a
          fetch-depth: 1
          persist-credentials: false

      - name: Extract and verify sealed patch
        shell: bash
        run: |
          set -euo pipefail
          awk '/^H4s/{print; exit}' .github/workflows/adwf-local-mirror-bootstrap.yml > /tmp/risk030.patch.gz.b64
          test -s /tmp/risk030.patch.gz.b64
          base64 -d /tmp/risk030.patch.gz.b64 > /tmp/risk030.patch.gz
          echo "${PATCH_GZIP_SHA256}  /tmp/risk030.patch.gz" | sha256sum -c -
          gzip -dc /tmp/risk030.patch.gz > /tmp/risk030.patch
          echo "${PATCH_SHA256}  /tmp/risk030.patch" | sha256sum -c -

      - name: Checkout exact writer branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact candidate and CAS push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          test -z "$(git status --porcelain)"
          git apply --check /tmp/risk030.patch
          git apply --index /tmp/risk030.patch
          test "$(git write-tree)" = "${EXPECTED_TREE}"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RISK-030: add deterministic liquidity risk contract"
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
