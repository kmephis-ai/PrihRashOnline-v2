name: RISK-030 Exact Patch Runner

on:
  push:
    branches:
      - agent/local-mirror-RISK-030-20260817-a

permissions:
  contents: write

env:
  BASE_SHA: 2f9753d609b7ef05ec1993f7e36628b60de545db
  TARGET_BRANCH: agent/RISK-030-liquidity-financial-risk
  EXPECTED_TREE: e4aa2f221e8e6b63eab98412da4099e159c5d169
  PATCH_GZIP_SHA256: d9fb6cfb1b8f867bc94f1858334c88381070a6e052f089be759040eb298835b6
  PATCH_SHA256: c4c093231c7be129aed4e725cc9008ab12c1209c9bee1a1cff22ec968e96a7b4

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read exact chunked payload from transport commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/local-mirror-RISK-030-20260817-a
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and assemble sealed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .transport/risk030/chunk-00)" = "ccb9f46fc21c856f34e64d7aa3b5a89416cf7185"
          test "$(git hash-object .transport/risk030/chunk-01)" = "5631fefb74153b8519aa7e348feee201df565813"
          test "$(git hash-object .transport/risk030/chunk-02)" = "efce3b99e22450fabf5faf57e49a8941f8f1176b"
          test "$(git hash-object .transport/risk030/chunk-03)" = "163e595d44a275cb2aefd95d21b3d7436712c20e"
          test "$(git hash-object .transport/risk030/chunk-04)" = "0214fa25ceb6ec5f69151771167313b81415c2e7"
          test "$(git hash-object .transport/risk030/chunk-05)" = "fe014202fff483f2f5622a3e1e11c95b10e89778"
          test "$(git hash-object .transport/risk030/chunk-06)" = "d9323c6a3bd5478ed98da56264df3034472dc74d"
          cat .transport/risk030/chunk-* > /tmp/risk030.patch.gz
          echo "${PATCH_GZIP_SHA256}  /tmp/risk030.patch.gz" | sha256sum -c -
          gzip -dc /tmp/risk030.patch.gz > /tmp/risk030.patch
          echo "${PATCH_SHA256}  /tmp/risk030.patch" | sha256sum -c -

      - name: Checkout exact writer branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact writer baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          test -z "$(git status --porcelain)"

      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/risk030.patch
          git apply --index /tmp/risk030.patch
          git diff --cached --check

      - name: Verify exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_TREE="$(git write-tree)"
          echo "actual_tree=${ACTUAL_TREE}"
          echo "expected_tree=${EXPECTED_TREE}"
          test "${ACTUAL_TREE}" = "${EXPECTED_TREE}"

      - name: Commit exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RISK-030: add deterministic liquidity risk contract"
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"

      - name: CAS push writer branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
