name: Deploy Apps Script DEV

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git ref to deploy to Apps Script DEV
        required: true
        default: agent/dashboard-ux-structure
  push:
    branches:
      - main
    paths:
      - '.deploy/apps-script-dev.ref'

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: apps-script-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_REF: ${{ github.event.inputs.target_ref || 'agent/dashboard-ux-structure' }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 1

      - name: Resolve source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=${TARGET_REF}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${TARGET_REF} at ${SOURCE_SHA}"

      - name: Validate deployment secrets
        shell: bash
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${APPS_SCRIPT_ID}" ]]; then
            echo "::error::Missing repository secret APPS_SCRIPT_ID"
            exit 1
          fi
          if [[ -z "${CLASPRC_JSON}" ]]; then
            echo "::error::Missing repository secret CLASPRC_JSON"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run contract tests
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/dashboard_shell_contract_test.js
          test -f tests/dashboard_web_contract_test.js
          mapfile -t TEST_FILES < <(find tests -maxdepth 1 -type f -name '*contract_test.js' -print | sort -u)
          if [[ "${#TEST_FILES[@]}" -eq 0 ]]; then
            echo '::error::No contract tests found.'
            exit 1
          fi
          for test_file in "${TEST_FILES[@]}"; do
            echo "Running ${test_file}"
            node "${test_file}"
          done

      - name: Install visual test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Web Dashboard visual gate
        shell: bash
        run: |
          set -euo pipefail
          node tests/dashboard_web_visual_test.js

      - name: Upload Web Dashboard visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-web-visual-${{ steps.source.outputs.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Install clasp
        run: npm install --no-save --no-audit --no-fund @google/clasp@3

      - name: Configure clasp
        shell: bash
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"
          chmod 600 "${HOME}/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "${APPS_SCRIPT_ID}" > .clasp.json
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json','utf8')); JSON.parse(require('fs').readFileSync('.clasp.json','utf8'));"

      - name: Validate deployment payload
        shell: bash
        run: |
          set -euo pipefail
          test -f appsscript.json
          test -f ApplicationMenuService.js
          test -f DashboardWebDataService.js
          test -f DashboardWebApp.html
          test -f DashboardModeService.js
          test -f DashboardShellService.js
          test -f IncomeSidebarController.js
          test -f IncomeSidebar.html
          npx clasp status

      - name: Push to bound Apps Script project
        run: npx clasp push --force

      - name: Create or update DEV Web App deployment
        id: webapp
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME='PrihRashOnline Web Dashboard DEV'
          DEPLOYMENTS="$(npx clasp deployments || true)"
          DEPLOYMENT_ID="$(printf '%s\n' "${DEPLOYMENTS}" | grep -F "${DEPLOYMENT_NAME}" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1 || true)"

          if [[ -n "${DEPLOYMENT_ID}" ]]; then
            OUTPUT="$(npx clasp deploy -i "${DEPLOYMENT_ID}" -d "${DEPLOYMENT_NAME}")"
          else
            OUTPUT="$(npx clasp deploy -d "${DEPLOYMENT_NAME}")"
            DEPLOYMENT_ID="$(printf '%s\n' "${OUTPUT}" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1 || true)"
          fi

          printf '%s\n' "${OUTPUT}"
          if [[ -z "${DEPLOYMENT_ID}" ]]; then
            echo '::error::Web App deployment completed without a parseable deployment ID.'
            exit 1
          fi

          WEB_APP_URL="https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec"
          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "web_app_url=${WEB_APP_URL}" >> "$GITHUB_OUTPUT"

          mkdir -p artifacts
          cat > artifacts/dashboard-web-deployment.json <<JSON
          {
            "sourceRef": "${TARGET_REF}",
            "sourceSha": "${{ steps.source.outputs.sha }}",
            "deploymentId": "${DEPLOYMENT_ID}",
            "webAppUrl": "${WEB_APP_URL}",
            "runUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON

      - name: Upload deployment metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-web-deployment-${{ steps.source.outputs.sha }}
          path: artifacts/dashboard-web-deployment.json
          if-no-files-found: error
          retention-days: 90

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo "### ПрихРасхOnline Web Dashboard DEV" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner: \`${RUNNER_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested ref: \`${TARGET_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: \`${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${{ steps.webapp.outputs.web_app_url }}" ]]; then
            echo "- Web App: ${{ steps.webapp.outputs.web_app_url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Visual artifact: \`dashboard-web-visual-${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Report successful deployment to PR
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 6 --repo "$GITHUB_REPOSITORY" --body "✅ HTML Web Dashboard deployed on \`$RUNNER_NAME\`. Source: \`${TARGET_REF}\` at \`${{ steps.source.outputs.sha }}\`. Contract tests and Playwright visual gate passed. Web App: ${{ steps.webapp.outputs.web_app_url }}. Visual artifact: \`dashboard-web-visual-${{ steps.source.outputs.sha }}\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Report failed deployment to PR
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 6 --repo "$GITHUB_REPOSITORY" --body "❌ HTML Web Dashboard deployment failed closed on \`$RUNNER_NAME\`. Source: \`${TARGET_REF}\` at \`${{ steps.source.outputs.sha }}\`. No successful Web App release is claimed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
