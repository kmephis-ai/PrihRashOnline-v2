name: Legacy DEV Release Disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain trusted replacement
        run: |
          echo 'Legacy release-branch deployment is disabled.'
          echo 'Use a normal PR. After PR Validation succeeds, Trusted DEV Deploy promotes the exact immutable candidate from default-branch workflow code.'
          echo 'Authenticated exact-SHA runtime health is owned by CI-002.'
