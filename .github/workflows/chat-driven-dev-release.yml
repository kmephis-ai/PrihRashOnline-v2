name: Chat-Driven DEV Release

on:
  push:
    branches:
      - 'agent/release/**'
    paths:
      - '*.js'
      - '*.html'
      - 'package.json'
      - 'appsscript.json'
      - '.claspignore'
      - 'tests/**'
      - 'tools/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Fresh release branch to validate, deploy and merge
        required: true
        default: agent/release/v1.0.0-rc1

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: dev-release-${{ github.event.inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_REF: ${{ github.event.inputs.target_ref || github.ref_name }}
    steps:
      - name: Resolve release pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_REF}" == agent/release/* ]] || {
            echo "::error::Release branch must match agent/release/**, got ${TARGET_REF}"
            exit 1
          }
          PR_JSON="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${TARGET_REF}" --base main --state open --json number,isDraft,headRefOid --limit 1 --jq '.[0]')"
          [[ -n "${PR_JSON}" && "${PR_JSON}" != null ]] || {
            echo "::error::No open release PR from ${TARGET_REF} to main"
            exit 1
          }
          echo "number=$(jq -r '.number' <<<"${PR_JSON}")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r '.headRefOid' <<<"${PR_JSON}")" >> "$GITHUB_OUTPUT"
          echo "is_draft=$(jq -r '.isDraft' <<<"${PR_JSON}")" >> "$GITHUB_OUTPUT"

      - name: Announce run immediately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --repo "${GITHUB_REPOSITORY}" \
            --body "🚦 DEV release started: run \`${GITHUB_RUN_ID}\`, branch \`${TARGET_REF}\`, candidate \`${{ steps.pr.outputs.sha }}\`. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Fast release-history preflight
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          [[ "${SOURCE_SHA}" == "${{ steps.pr.outputs.sha }}" ]] || {
            echo '::error::Checkout does not match PR head.'
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo '::error::Release branch is behind/diverged from current main. Rebuild a clean release snapshot from main; expensive tests were not started.'
            exit 1
          }
          RELEASE_COMMITS="$(git rev-list --count origin/main..HEAD)"
          [[ "${RELEASE_COMMITS}" -le 10 ]] || {
            echo "::error::Release branch contains ${RELEASE_COMMITS} commits (>10). Squash/rebuild snapshot before release."
            exit 1
          }
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "commit_count=${RELEASE_COMMITS}" >> "$GITHUB_OUTPUT"

      - name: Validate GitHub-hosted runner and deployment secrets
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT}" == github-hosted ]] || { echo '::error::GitHub-hosted runner required'; exit 1; }
          [[ -n "${APPS_SCRIPT_ID}" ]] || { echo '::error::Missing APPS_SCRIPT_ID'; exit 1; }
          [[ -n "${CLASPRC_JSON}" ]] || { echo '::error::Missing CLASPRC_JSON'; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare dashboard bundle
        run: npm run prepare:web

      - name: Run all contract tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TEST_FILES < <(find tests -maxdepth 1 -type f -name '*contract_test.js' -print | sort -u)
          [[ "${#TEST_FILES[@]}" -gt 0 ]] || { echo '::error::No contract tests found'; exit 1; }
          for test_file in "${TEST_FILES[@]}"; do node "${test_file}"; done

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run responsive visual gate
        run: node tests/dashboard_web_visual_test.js

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-web-${{ steps.source.outputs.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Configure clasp
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund @google/clasp@3
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"
          chmod 600 "${HOME}/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "${APPS_SCRIPT_ID}" > .clasp.json
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8')); JSON.parse(require('fs').readFileSync('.clasp.json','utf8'));"
          npx clasp status

      - name: Push Apps Script DEV
        run: npx clasp push --force

      - name: Create or update verified DEV Web App deployment
        id: webapp
        shell: bash
        run: |
          set -euo pipefail
          # Do not reuse the historical generic deployment: it was created before
          # the manifest declared a webapp and produced a Google Drive file-not-found URL.
          DEPLOYMENT_NAME='PrihRashOnline Web Dashboard DEV WebApp'
          DEPLOYMENTS="$(npx clasp list-deployments || true)"
          DEPLOYMENT_ID="$(printf '%s\n' "${DEPLOYMENTS}" | grep -F "${DEPLOYMENT_NAME}" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1 || true)"

          if [[ -n "${DEPLOYMENT_ID}" ]]; then
            OUTPUT="$(npx clasp update-deployment "${DEPLOYMENT_ID}" -d "${DEPLOYMENT_NAME}")"
          else
            OUTPUT="$(npx clasp create-deployment -d "${DEPLOYMENT_NAME}")"
            DEPLOYMENT_ID="$(printf '%s\n' "${OUTPUT}" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1 || true)"
          fi
          printf '%s\n' "${OUTPUT}"
          [[ -n "${DEPLOYMENT_ID}" ]] || { echo '::error::Deployment ID not returned'; exit 1; }

          # open-web-app calls projects.deployments.get internally and refuses any
          # deployment without a real WEB_APP entry point. Its output is therefore
          # authoritative for the deployment URL, but it does not execute doGet().
          if ! OPEN_OUTPUT="$(npx clasp --json open-web-app "${DEPLOYMENT_ID}" 2>&1)"; then
            printf '%s\n' "${OPEN_OUTPUT}"
            echo '::error::Apps Script deployment has no verified WEB_APP entry point.'
            exit 1
          fi
          printf '%s\n' "${OPEN_OUTPUT}"
          WEB_APP_URL="$(printf '%s\n' "${OPEN_OUTPUT}" | grep -oE 'https://script\.google\.com[^"[:space:]]+/exec([^"[:space:]]*)?' | head -1 || true)"
          [[ -n "${WEB_APP_URL}" ]] || {
            echo '::error::clasp verified WEB_APP but did not return its URL.'
            exit 1
          }
          [[ "${WEB_APP_URL}" =~ ^https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec([?].*)?$ ]] || {
            echo "::error::Unexpected Web App URL returned by Apps Script API: ${WEB_APP_URL}"
            exit 1
          }
          echo "url=${WEB_APP_URL}" >> "$GITHUB_OUTPUT"

          SMOKE_BODY="$(mktemp)"
          HTTP_CODE="$(curl -L -sS --max-time 30 -o "${SMOKE_BODY}" -w '%{http_code}' "${WEB_APP_URL}" || true)"
          if [[ "${HTTP_CODE}" == '404' || "${HTTP_CODE}" =~ ^5 ]]; then
            echo "::error::Web App smoke request failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
          if grep -Eqi 'Не удалось открыть файл|Unable to open the file|file you have requested does not exist' "${SMOKE_BODY}"; then
            echo '::error::Google Drive file-not-found page returned instead of Apps Script Web App.'
            exit 1
          fi
          if grep -Eqi 'SyntaxError|Invalid or unexpected token|ReferenceError|TypeError|Exception:|Script function not found|Синтаксическая ошибка|Ошибка синтаксиса' "${SMOKE_BODY}"; then
            echo '::error::Apps Script runtime error page returned instead of the Dashboard.'
            sed -n '1,160p' "${SMOKE_BODY}" || true
            exit 1
          fi
          if grep -Eqi 'accounts\.google\.com|Sign in - Google Accounts|Войдите в аккаунт Google|Войти в аккаунт Google|ServiceLogin' "${SMOKE_BODY}"; then
            echo '::error::Web App requires Google authentication; anonymous CI smoke did not execute doGet(). DEV was deployed, but runtime verification is not authoritative, so merge is blocked.'
            exit 1
          fi
          if ! grep -Fqi 'PrihRashOnline' "${SMOKE_BODY}"; then
            echo '::error::Smoke response does not contain the Dashboard identity marker; refusing to treat HTTP success as runtime success.'
            sed -n '1,80p' "${SMOKE_BODY}" || true
            exit 1
          fi

          mkdir -p artifacts
          jq -n --arg sourceRef "${TARGET_REF}" --arg sourceSha "${{ steps.source.outputs.sha }}" --arg deploymentId "${DEPLOYMENT_ID}" --arg webAppUrl "${WEB_APP_URL}" --arg httpCode "${HTTP_CODE}" --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{sourceRef:$sourceRef,sourceSha:$sourceSha,deploymentId:$deploymentId,webAppUrl:$webAppUrl,smokeHttpCode:$httpCode,runUrl:$runUrl,entryPoint:"WEB_APP",runtimeSmoke:"dashboard-marker"}' > artifacts/dashboard-web-deployment.json

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-web-deployment-${{ steps.source.outputs.sha }}
          path: artifacts/dashboard-web-deployment.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify candidate did not move
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh pr view "${{ steps.pr.outputs.number }}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq '.headRefOid')"
          [[ "${CURRENT_SHA}" == "${{ steps.source.outputs.sha }}" ]] || {
            echo '::error::PR head moved after validation/deployment; refusing stale merge.'
            exit 1
          }

      - name: Mark PR ready if needed
        if: steps.pr.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready "${{ steps.pr.outputs.number }}" --repo "${GITHUB_REPOSITORY}"

      - name: Merge validated release PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${{ steps.pr.outputs.number }}/merge" \
            -f sha='${{ steps.source.outputs.sha }}' -f merge_method=merge \
            -f commit_title='Merge validated DEV Web App hotfix' \
            -f commit_message='Contracts, Playwright, clasp push, verified WEB_APP entry point and authoritative dashboard smoke check passed.')"
          [[ "$(jq -r '.merged' <<<"${RESPONSE}")" == true ]] || { echo "::error::Merge refused: $(jq -r '.message' <<<"${RESPONSE}")"; exit 1; }
          echo "sha=$(jq -r '.sha' <<<"${RESPONSE}")" >> "$GITHUB_OUTPUT"

      - name: Publish stable Dashboard link on main after merge
        env:
          WEB_APP_URL: ${{ steps.webapp.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout -B main origin/main
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          start = '<!-- DASHBOARD_LINK_START -->'
          end = '<!-- DASHBOARD_LINK_END -->'
          block = f"{start}\n[▶ Открыть Dashboard]({os.environ['WEB_APP_URL']})\n\n> DEV Web App • стабильная прямая ссылка.\n{end}"
          if start in text and end in text:
              text = text.split(start,1)[0] + block + text.split(end,1)[1]
          else:
              text += '\n\n## ▶ Dashboard\n\n' + block + '\n'
          path.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet -- README.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'docs: publish verified DEV Web App link'
            git push origin main
          fi

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --repo "${GITHUB_REPOSITORY}" \
            --body "✅ DEV Web App hotfix passed and merged. Source: \`${{ steps.source.outputs.sha }}\`; merge: \`${{ steps.merge.outputs.sha }}\`; verified Web App: ${{ steps.webapp.outputs.url }}; run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report fail-closed blocker
        if: failure() && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --repo "${GITHUB_REPOSITORY}" \
            --body "❌ DEV Web App hotfix failed closed. Run \`${GITHUB_RUN_ID}\`, candidate \`${{ steps.pr.outputs.sha }}\`. DEV deployment may have completed, but no merge is claimed without an authoritative runtime response. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Release summary
        if: always()
        run: |
          echo '### DEV Web App release' >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: \`${GITHUB_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${TARGET_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: \`#${{ steps.pr.outputs.number }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release commits: \`${{ steps.source.outputs.commit_count }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified Web App: ${{ steps.webapp.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merge: \`${{ steps.merge.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
