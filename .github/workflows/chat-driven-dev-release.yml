name: Chat-Driven DEV Release

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - '*.js'
      - '*.html'
      - 'package.json'
      - 'appsscript.json'
      - '.claspignore'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/chat-driven-dev-release.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Agent branch to validate, deploy and merge
        required: true
        default: agent/dashboard-ux-structure

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: chat-driven-dev-release-${{ github.event.inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_REF: ${{ github.event.inputs.target_ref || github.ref_name }}
    steps:
      - name: Resolve open pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${TARGET_REF}" \
            --base main \
            --state open \
            --json number,isDraft,headRefOid \
            --limit 1 \
            --jq '.[0]')"

          if [[ -z "${PR_JSON}" || "${PR_JSON}" == 'null' ]]; then
            echo "::error::No open pull request from ${TARGET_REF} to main."
            exit 1
          fi

          echo "number=$(jq -r '.number' <<<"${PR_JSON}")" >> "$GITHUB_OUTPUT"
          echo "initial_sha=$(jq -r '.headRefOid' <<<"${PR_JSON}")" >> "$GITHUB_OUTPUT"
          echo "is_draft=$(jq -r '.isDraft' <<<"${PR_JSON}")" >> "$GITHUB_OUTPUT"

      - name: Announce release run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "🚦 DEV release started. Run: \`${GITHUB_RUN_ID}\`; event: \`${GITHUB_EVENT_NAME}\`; target: \`${TARGET_REF}\`; candidate: \`${{ steps.pr.outputs.initial_sha }}\`. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 1

      - name: Resolve source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "${SOURCE_SHA}" != "${{ steps.pr.outputs.initial_sha }}" ]]; then
            echo '::error::Checked out SHA does not match the pull request head.'
            exit 1
          fi
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate GitHub-hosted execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ENVIRONMENT}" != 'github-hosted' ]]; then
            echo '::error::DEV release must run on a GitHub-hosted runner.'
            exit 1
          fi

      - name: Validate deployment secrets
        shell: bash
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          [[ -n "${APPS_SCRIPT_ID}" ]] || { echo '::error::Missing APPS_SCRIPT_ID'; exit 1; }
          [[ -n "${CLASPRC_JSON}" ]] || { echo '::error::Missing CLASPRC_JSON'; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare dashboard bundle
        run: npm run prepare:web

      - name: Run contract tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TEST_FILES < <(find tests -maxdepth 1 -type f -name '*contract_test.js' -print | sort -u)
          [[ "${#TEST_FILES[@]}" -gt 0 ]] || { echo '::error::No contract tests found'; exit 1; }
          for test_file in "${TEST_FILES[@]}"; do
            node "${test_file}"
          done

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run responsive visual gate
        run: node tests/dashboard_web_visual_test.js

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-web-${{ steps.source.outputs.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Install and configure clasp
        shell: bash
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund @google/clasp@3
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"
          chmod 600 "${HOME}/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "${APPS_SCRIPT_ID}" > .clasp.json
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json','utf8')); JSON.parse(require('fs').readFileSync('.clasp.json','utf8'));"
          npx clasp status

      - name: Push Apps Script DEV
        run: npx clasp push --force

      - name: Create or update DEV Web App
        id: webapp
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME='PrihRashOnline Web Dashboard DEV'
          DEPLOYMENTS="$(npx clasp deployments || true)"
          DEPLOYMENT_ID="$(printf '%s\n' "${DEPLOYMENTS}" | grep -F "${DEPLOYMENT_NAME}" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1 || true)"

          if [[ -n "${DEPLOYMENT_ID}" ]]; then
            OUTPUT="$(npx clasp deploy -i "${DEPLOYMENT_ID}" -d "${DEPLOYMENT_NAME}")"
          else
            OUTPUT="$(npx clasp deploy -d "${DEPLOYMENT_NAME}")"
            DEPLOYMENT_ID="$(printf '%s\n' "${OUTPUT}" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1 || true)"
          fi

          printf '%s\n' "${OUTPUT}"
          [[ -n "${DEPLOYMENT_ID}" ]] || { echo '::error::Deployment ID was not returned'; exit 1; }
          WEB_APP_URL="https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec"
          echo "url=${WEB_APP_URL}" >> "$GITHUB_OUTPUT"

          mkdir -p artifacts
          cat > artifacts/dashboard-web-deployment.json <<JSON
          {
            "sourceRef": "${TARGET_REF}",
            "sourceSha": "${{ steps.source.outputs.sha }}",
            "webAppUrl": "${WEB_APP_URL}",
            "runUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-web-deployment-${{ steps.source.outputs.sha }}
          path: artifacts/dashboard-web-deployment.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish Dashboard link in README
        id: readme
        shell: bash
        env:
          WEB_APP_URL: ${{ steps.webapp.outputs.url }}
        run: |
          set -euo pipefail

          REMOTE_SHA="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          if [[ "${REMOTE_SHA}" != "${{ steps.source.outputs.sha }}" ]]; then
            echo '::error::PR head moved before README publication; refusing stale link update.'
            exit 1
          fi

          git reset --hard "${{ steps.source.outputs.sha }}"
          git clean -fd

          python - <<'PY'
          import os
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8') if path.exists() else '# ПрихРасхOnline v2\n'
          start = '<!-- DASHBOARD_LINK_START -->'
          end = '<!-- DASHBOARD_LINK_END -->'
          url = os.environ['WEB_APP_URL']
          block = f'''{start}\n[▶ Открыть Dashboard]({url})\n\n> DEV Web App • ссылка обновляется автоматически успешным release workflow.\n{end}'''

          if start in text and end in text:
              prefix = text.split(start, 1)[0]
              suffix = text.split(end, 1)[1]
              text = prefix + block + suffix
          else:
              text += '\n\n## ▶ Dashboard\n\n' + block + '\n'

          path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet -- README.md; then
            RELEASE_SHA="$(git rev-parse HEAD)"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'docs: publish DEV dashboard link'
            RELEASE_SHA="$(git rev-parse HEAD)"
            git push origin "HEAD:${TARGET_REF}"
          fi

          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify release head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh pr view "${{ steps.pr.outputs.number }}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq '.headRefOid')"
          if [[ "${CURRENT_SHA}" != "${{ steps.readme.outputs.sha }}" ]]; then
            echo "::error::PR head moved after validation; refusing stale merge."
            exit 1
          fi

      - name: Mark pull request ready
        if: steps.pr.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready "${{ steps.pr.outputs.number }}" --repo "${GITHUB_REPOSITORY}"

      - name: Merge validated pull request
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -n \
            --arg sha "${{ steps.readme.outputs.sha }}" \
            --arg title "Merge PR #${{ steps.pr.outputs.number }} after DEV validation" \
            --arg message "Contract tests, responsive Playwright gate, Apps Script DEV deployment and README Dashboard link publication passed." \
            '{sha:$sha,merge_method:"merge",commit_title:$title,commit_message:$message}')"
          RESPONSE="$(gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ steps.pr.outputs.number }}/merge" \
            --input - <<<"${PAYLOAD}")"
          [[ "$(jq -r '.merged' <<<"${RESPONSE}")" == 'true' ]] || {
            echo "::error::Merge refused: $(jq -r '.message' <<<"${RESPONSE}")"
            exit 1
          }
          echo "sha=$(jq -r '.sha' <<<"${RESPONSE}")" >> "$GITHUB_OUTPUT"

      - name: Report release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "✅ Chat-driven block validated, deployed to DEV, Dashboard link published in README and merged. Source: \`${{ steps.source.outputs.sha }}\`. Release head: \`${{ steps.readme.outputs.sha }}\`. Merge: \`${{ steps.merge.outputs.sha }}\`. Web App: ${{ steps.webapp.outputs.url }}."

      - name: Report failure
        if: failure() && steps.pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "❌ DEV release failed closed. Run: \`${GITHUB_RUN_ID}\`; target: \`${TARGET_REF}\`; candidate: \`${{ steps.pr.outputs.initial_sha }}\`. No merge is claimed. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Release summary
        if: always()
        shell: bash
        run: |
          echo '### Chat-driven DEV release' >> "$GITHUB_STEP_SUMMARY"
          echo '- Trigger model: code change or explicit workflow dispatch; no cron or background polling.' >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: \`${GITHUB_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${TARGET_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: \`#${{ steps.pr.outputs.number }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release head: \`${{ steps.readme.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web App: ${{ steps.webapp.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merge: \`${{ steps.merge.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"