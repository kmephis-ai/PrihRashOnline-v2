name: ADWF UPGRADE-002 Resume Materializer

on:
  pull_request:
    branches:
      - helper/adwf-upgrade-002-resume-base-300bf7ce
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONSUMER_BASE: 300bf7ce2ebde00164e5424d8aa6b9038593d1f1
      CONSUMER_BASE_TREE: 40a9faa991f4b467d43078872bd28aef49fdd786
      SOURCE_A: 278014b98f606705e7ccd89c6faa5c95df530cd8
      TARGET_B: 017042c1f2bcde8d89d4b344201e848d873ec5a9
      TARGET_B_TREE: c7e709a29df431460abb9bc17025d62d7803cda1
      CANDIDATE_BRANCH: integration/ADWF-UPGRADE-002-resume-017042c1-300bf7ce
    steps:
      - name: Replan, prove lifecycle, and publish exact candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/adwf-upgrade-002-resume"
          CONSUMER="$ROOT/consumer"
          SOURCE="$ROOT/adwf-a"
          TARGET="$ROOT/adwf-b"
          FRESH_B="$ROOT/fresh-b"
          mkdir -p "$ROOT"

          git clone --quiet --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$CONSUMER"
          git -C "$CONSUMER" checkout --quiet --detach "$CONSUMER_BASE"
          test "$(git -C "$CONSUMER" rev-parse HEAD)" = "$CONSUMER_BASE"
          test "$(git -C "$CONSUMER" rev-parse HEAD^{tree})" = "$CONSUMER_BASE_TREE"

          git clone --quiet --no-tags https://github.com/kmephis-ai/AI-Development-Framework.git "$SOURCE"
          git -C "$SOURCE" checkout --quiet --detach "$SOURCE_A"
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$SOURCE_A"

          git clone --quiet --no-tags https://github.com/kmephis-ai/AI-Development-Framework.git "$TARGET"
          git -C "$TARGET" checkout --quiet --detach "$TARGET_B"
          test "$(git -C "$TARGET" rev-parse HEAD)" = "$TARGET_B"
          test "$(git -C "$TARGET" rev-parse HEAD^{tree})" = "$TARGET_B_TREE"

          python "$SOURCE/.adwf/scripts/consumer_installation.py" \
            --consumer-root "$CONSUMER" --framework-root "$SOURCE" \
            --repository kmephis-ai/PrihRashOnline-v2 > "$ROOT/source-validation.json"

          python "$TARGET/.adwf/scripts/plan_consumer_upgrade.py" \
            --source-root "$SOURCE" --target-root "$TARGET" --consumer-root "$CONSUMER" \
            --source-revision "$SOURCE_A" --target-revision "$TARGET_B" > "$ROOT/plan-bundle-1.json"

          ROOT="$ROOT" python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['ROOT'])
          bundle = json.loads((root/'plan-bundle-1.json').read_text())
          compatibility, plan = bundle['compatibility'], bundle['plan']
          assert compatibility['status'] == 'PASS', compatibility
          assert plan['status'] == 'READY', plan
          def dump(name, value):
              p = root/name
              p.write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + '\n')
              canonical = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()
              return hashlib.sha256(canonical).hexdigest()
          cd = dump('compatibility-1.json', compatibility)
          pd = dump('plan-1.json', plan)
          (root/'digests-1.txt').write_text(f'{cd}\n{pd}\n')
          PY

          python "$TARGET/.adwf/scripts/apply_consumer_upgrade.py" apply \
            --source-root "$SOURCE" --target-root "$TARGET" --consumer-root "$CONSUMER" \
            --compatibility "$ROOT/compatibility-1.json" --plan "$ROOT/plan-1.json" > "$ROOT/apply-1.json"

          ROOT="$ROOT" python - <<'PY'
          import json, os, pathlib
          r = json.loads((pathlib.Path(os.environ['ROOT'])/'apply-1.json').read_text())
          assert r.get('status') == 'COMMITTED', r
          assert r.get('write_performed') is not False, r
          tx = r.get('transaction_id')
          assert isinstance(tx, str) and tx, r
          (pathlib.Path(os.environ['ROOT'])/'transaction-id.txt').write_text(tx)
          PY

          python "$TARGET/.adwf/scripts/consumer_installation.py" \
            --consumer-root "$CONSUMER" --framework-root "$TARGET" \
            --repository kmephis-ai/PrihRashOnline-v2 > "$ROOT/target-validation-1.json"

          ROOT="$ROOT" CONSUMER="$CONSUMER" TARGET_B="$TARGET_B" python - <<'PY'
          import json, os, pathlib
          c = pathlib.Path(os.environ['CONSUMER'])
          v = json.loads((pathlib.Path(os.environ['ROOT'])/'target-validation-1.json').read_text())
          assert v.get('status') == 'VERIFIED', v
          ins = json.loads((c/'.adwf-consumer/installation.json').read_text())
          assert ins['framework']['source_sha'] == os.environ['TARGET_B']
          ops = json.loads((c/'.adwf-consumer/operations.json').read_text())
          assert ops['mode'] == 'CONSUMER_NATIVE'
          assert ops['roadmap']['path'] == 'docs/ROADMAP.md'
          assert ops['safety']['monetary_budget_usd'] == 0 and ops['safety']['secrets'] == 'FORBIDDEN'
          gates = json.loads((c/'.adwf-consumer/gates.json').read_text())
          assert gates['phases']['pr'][0]['check_name'] == 'validate'
          assert gates['phases']['main'][0]['check_name'] == 'verify'
          assert gates['phases']['runtime'][0]['check_name'] == 'probe'
          PY

          cat > "$ROOT/expected-paths.txt" <<'EOF'
          .adwf-consumer/gates.json
          .adwf-consumer/installation.json
          .adwf-consumer/operations.json
          .adwf/docs-registry.json
          .adwf/instructions/CORE.md
          .adwf/lib/github_runtime_store.py
          .adwf/lib/project_packs.py
          .adwf/lib/session_continuity.py
          .adwf/schemas/session-continuity-checkpoint.schema.json
          .adwf/scripts/github_runtime_sync.py
          .adwf/tests/test_session_continuity.py
          .adwf/tests/test_session_continuity_persistence.py
          .adwf/tests/test_session_delivery.py
          EOF
          sed -i 's/^          //' "$ROOT/expected-paths.txt"
          git -C "$CONSUMER" add -A
          git -C "$CONSUMER" diff --cached --name-only HEAD | sort > "$ROOT/actual-paths-1.txt"
          diff -u "$ROOT/expected-paths.txt" "$ROOT/actual-paths-1.txt"
          if git -C "$CONSUMER" ls-files | grep -q '^\.adwf-runtime/'; then exit 21; fi
          B_TREE_1="$(git -C "$CONSUMER" write-tree)"

          git -C "$CONSUMER" config user.name 'adwf-upgrade-002-materializer'
          git -C "$CONSUMER" config user.email 'adwf-upgrade-002-materializer@users.noreply.github.com'
          git -C "$CONSUMER" commit --quiet -m '[ADWF-UPGRADE-002] intermediate fresh-B proof'
          B_COMMIT_1="$(git -C "$CONSUMER" rev-parse HEAD)"

          git clone --quiet --no-local "$CONSUMER" "$FRESH_B"
          test ! -e "$FRESH_B/.adwf-runtime"
          python "$TARGET/.adwf/scripts/consumer_installation.py" \
            --consumer-root "$FRESH_B" --framework-root "$TARGET" \
            --repository kmephis-ai/PrihRashOnline-v2 > "$ROOT/target-validation-fresh.json"

          python "$TARGET/.adwf/scripts/apply_consumer_upgrade.py" apply \
            --source-root "$SOURCE" --target-root "$TARGET" --consumer-root "$CONSUMER" \
            --compatibility "$ROOT/compatibility-1.json" --plan "$ROOT/plan-1.json" > "$ROOT/apply-repeat.json"
          ROOT="$ROOT" python - <<'PY'
          import json, os, pathlib
          r = json.loads((pathlib.Path(os.environ['ROOT'])/'apply-repeat.json').read_text())
          assert r.get('status') == 'ALREADY_COMMITTED', r
          assert r.get('write_performed') is False, r
          PY

          TX="$(cat "$ROOT/transaction-id.txt")"
          python "$TARGET/.adwf/scripts/apply_consumer_upgrade.py" rollback \
            --source-root "$SOURCE" --target-root "$TARGET" --consumer-root "$CONSUMER" \
            --transaction-id "$TX" > "$ROOT/rollback.json"
          ROOT="$ROOT" python - <<'PY'
          import json, os, pathlib
          r = json.loads((pathlib.Path(os.environ['ROOT'])/'rollback.json').read_text())
          assert r.get('status') == 'ROLLED_BACK', r
          PY
          git -C "$CONSUMER" add -A
          test "$(git -C "$CONSUMER" write-tree)" = "$CONSUMER_BASE_TREE"

          git -C "$CONSUMER" reset --quiet --hard "$CONSUMER_BASE"
          rm -rf "$CONSUMER/.adwf-runtime"
          python "$SOURCE/.adwf/scripts/consumer_installation.py" \
            --consumer-root "$CONSUMER" --framework-root "$SOURCE" \
            --repository kmephis-ai/PrihRashOnline-v2 > "$ROOT/source-validation-2.json"
          python "$TARGET/.adwf/scripts/plan_consumer_upgrade.py" \
            --source-root "$SOURCE" --target-root "$TARGET" --consumer-root "$CONSUMER" \
            --source-revision "$SOURCE_A" --target-revision "$TARGET_B" > "$ROOT/plan-bundle-2.json"

          ROOT="$ROOT" python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['ROOT'])
          b1 = json.loads((root/'plan-bundle-1.json').read_text())
          b2 = json.loads((root/'plan-bundle-2.json').read_text())
          assert b2['compatibility']['status'] == 'PASS', b2
          assert b2['plan']['status'] == 'READY', b2
          assert b1['compatibility'] == b2['compatibility'], 'COMPATIBILITY_NONDETERMINISTIC'
          assert b1['plan'] == b2['plan'], 'PLAN_NONDETERMINISTIC'
          for key, name in [('compatibility','compatibility-2.json'), ('plan','plan-2.json')]:
              value=b2[key]
              (root/name).write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True)+'\n')
          PY

          python "$TARGET/.adwf/scripts/apply_consumer_upgrade.py" apply \
            --source-root "$SOURCE" --target-root "$TARGET" --consumer-root "$CONSUMER" \
            --compatibility "$ROOT/compatibility-2.json" --plan "$ROOT/plan-2.json" > "$ROOT/apply-2.json"
          ROOT="$ROOT" python - <<'PY'
          import json, os, pathlib
          r = json.loads((pathlib.Path(os.environ['ROOT'])/'apply-2.json').read_text())
          assert r.get('status') == 'COMMITTED', r
          PY
          python "$TARGET/.adwf/scripts/consumer_installation.py" \
            --consumer-root "$CONSUMER" --framework-root "$TARGET" \
            --repository kmephis-ai/PrihRashOnline-v2 > "$ROOT/target-validation-2.json"
          git -C "$CONSUMER" add -A
          git -C "$CONSUMER" diff --cached --name-only HEAD | sort > "$ROOT/actual-paths-2.txt"
          diff -u "$ROOT/expected-paths.txt" "$ROOT/actual-paths-2.txt"
          B_TREE_2="$(git -C "$CONSUMER" write-tree)"
          test "$B_TREE_2" = "$B_TREE_1"
          test "$(git -C "$CONSUMER" rev-parse HEAD)" = "$CONSUMER_BASE"

          git -C "$CONSUMER" commit --quiet -m '[ADWF-UPGRADE-002] Rebuild candidate on repaired consumer main'
          CANDIDATE_SHA="$(git -C "$CONSUMER" rev-parse HEAD)"
          test "$(git -C "$CONSUMER" rev-parse HEAD^)" = "$CONSUMER_BASE"
          test "$(git -C "$CONSUMER" rev-parse HEAD^{tree})" = "$B_TREE_2"

          ROOT="$ROOT" CONSUMER_BASE="$CONSUMER_BASE" SOURCE_A="$SOURCE_A" TARGET_B="$TARGET_B" B_TREE_2="$B_TREE_2" CANDIDATE_SHA="$CANDIDATE_SHA" B_COMMIT_1="$B_COMMIT_1" python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ['ROOT'])
          b=json.loads((root/'plan-bundle-2.json').read_text())
          canon=lambda x: hashlib.sha256(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          evidence={
            'schema_version':1,
            'consumer_base':os.environ['CONSUMER_BASE'],
            'source_a':os.environ['SOURCE_A'],
            'target_b':os.environ['TARGET_B'],
            'compatibility_status':b['compatibility']['status'],
            'compatibility_sha256':canon(b['compatibility']),
            'plan_status':b['plan']['status'],
            'plan_sha256':canon(b['plan']),
            'first_b_commit':os.environ['B_COMMIT_1'],
            'candidate_sha':os.environ['CANDIDATE_SHA'],
            'candidate_tree':os.environ['B_TREE_2'],
            'changed_paths':(root/'actual-paths-2.txt').read_text().splitlines(),
            'fresh_b_readback':json.loads((root/'target-validation-fresh.json').read_text()).get('status'),
            'repeat_status':json.loads((root/'apply-repeat.json').read_text()).get('status'),
            'rollback_status':json.loads((root/'rollback.json').read_text()).get('status'),
            'reapply_status':json.loads((root/'apply-2.json').read_text()).get('status'),
            'product_fin_drift':'NO_BY_EXACT_ALLOWLIST',
            'free_only':True,
          }
          (root/'evidence.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps(evidence,sort_keys=True))
          PY

          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo "Candidate branch already exists; refusing non-CAS overwrite" >&2
            exit 31
          fi
          git -C "$CONSUMER" remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$CONSUMER" push --quiet origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

      - name: Upload public-safe lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adwf-upgrade-002-resume-evidence
          path: ${{ runner.temp }}/adwf-upgrade-002-resume/evidence.json
          if-no-files-found: warn
          retention-days: 14
