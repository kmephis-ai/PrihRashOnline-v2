name: PERF-REC Safe Live Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf-rec-safe-live-diagnostic.yml'
      - 'tools/perf-rec-baseline-exec.js'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLASP_USER: prihrash-ci

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[PERF-REC-DIAG]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: DEV
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Prepare owner authentication
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_API_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_API_DEPLOYMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLASPRC_JSON}" ]] || { echo '::error::Missing CLASPRC_JSON'; exit 1; }
          [[ "${APPS_SCRIPT_API_DEPLOYMENT_ID}" =~ ^AKfy[A-Za-z0-9_-]+$ ]] || { echo '::error::Invalid APPS_SCRIPT_API_DEPLOYMENT_ID'; exit 1; }
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"
          chmod 600 "${HOME}/.clasprc.json"

      - name: Run one privacy-safe cold diagnostic
        env:
          APPS_SCRIPT_API_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_API_DEPLOYMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          RAW="$(node tools/perf-rec-baseline-exec.js COLD)"
          STATUS=$?
          set -e
          SAFE="$(jq -r 'if .ok == true then "PROBE_SUCCEEDED" else (.reason // "PROBE_FAILED") end' <<<"${RAW}" 2>/dev/null || printf 'PROBE_FAILED')"
          [[ "${SAFE}" =~ ^[A-Z0-9_:.-]{1,120}$ ]] || SAFE='PROBE_FAILED'
          echo "PERF-REC safe diagnostic: ${SAFE}"
          if [[ "${STATUS}" -eq 0 && "${SAFE}" == 'PROBE_SUCCEEDED' ]]; then
            exit 0
          fi
          exit 1
