name: Materialize RISK-030 candidate

on:
  push:
    branches:
      - agent/materialize-RISK-030-20260817-a

permissions:
  contents: write

env:
  BASE_SHA: 2f9753d609b7ef05ec1993f7e36628b60de545db
  EXPECTED_TREE: 1bb39486dff857024f88bc961c8a7351a5f8b413
  WRITER_BRANCH: agent/RISK-030-liquidity-financial-risk

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Decode sealed candidate patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .agent-transport/risk030.patch.gz.b64 | gzip -dc > /tmp/risk030.patch
          test -s /tmp/risk030.patch

      - name: Verify exact writer base and apply exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${BASE_SHA}"
          remote_sha="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${BASE_SHA}"
          git apply --check /tmp/risk030.patch
          git apply --index /tmp/risk030.patch
          test "$(git write-tree)" = "${EXPECTED_TREE}"

      - name: Verify RISK-030 candidate
        shell: bash
        run: |
          set -euo pipefail
          node tests/liquidity_financial_risk_contract_test.js
          node tests/net_worth_contract_test.js
          node tests/cash_flow_projection_contract_test.js
          node tests/test_architecture_contract_test.js
          node tools/run-layered-tests.js pure
          node tests/privacy_public_data_contract_test.js
          node tests/financial_reconciliation_contract_test.js
          node tests/analytics_documentation_contract_test.js
          node tests/language_policy_contract_test.js
          node tests/roadmap_task_protocol_contract_test.js
          git diff --cached --check

      - name: CAS publish writer candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "${EXPECTED_TREE}"
          remote_sha="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${BASE_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(risk): add deterministic liquidity and financial risk layer"
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          git push origin "HEAD:refs/heads/${WRITER_BRANCH}"
          printf 'candidate_sha=%s\ncandidate_tree=%s\n' "$candidate_sha" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
