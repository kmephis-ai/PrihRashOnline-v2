name: RC3 Strengthen Runtime Smoke

on:
  push:
    branches:
      - 'agent/release/v1.0.0-rc3-runtime-syntax'
    paths:
      - '.github/workflows/rc3-strengthen-runtime-smoke.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release/v1.0.0-rc3-runtime-syntax
          fetch-depth: 0

      - name: Strengthen Apps Script runtime error smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/chat-driven-dev-release.yml')
          text = path.read_text(encoding='utf-8')
          needle = """          if grep -Eqi 'Не удалось открыть файл|Unable to open the file|file you have requested does not exist' \"${SMOKE_BODY}\"; then
            echo '::error::Google Drive file-not-found page returned instead of Apps Script Web App.'
            exit 1
          fi

          echo \"url=${WEB_APP_URL}\" >> \"$GITHUB_OUTPUT\"
"""
          replacement = """          if grep -Eqi 'Не удалось открыть файл|Unable to open the file|file you have requested does not exist' \"${SMOKE_BODY}\"; then
            echo '::error::Google Drive file-not-found page returned instead of Apps Script Web App.'
            exit 1
          fi
          if grep -Eqi 'SyntaxError|Invalid or unexpected token|Script function not found|Exception:|Google Apps Script error' \"${SMOKE_BODY}\"; then
            echo '::error::Apps Script runtime error page returned instead of a healthy Web App response.'
            head -c 1500 \"${SMOKE_BODY}\" || true
            exit 1
          fi

          echo \"url=${WEB_APP_URL}\" >> \"$GITHUB_OUTPUT\"
"""
          if needle not in text:
              raise SystemExit('Runtime smoke anchor not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8', newline='\n')
          PY

      - name: Commit gate and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rc3-strengthen-runtime-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/chat-driven-dev-release.yml .github/workflows/rc3-strengthen-runtime-smoke.yml
          git commit -m 'ci: reject Apps Script runtime error pages'
          git push origin HEAD:agent/release/v1.0.0-rc3-runtime-syntax

