name: ADWF SESSION Consumer Proof Preflight

on:
  pull_request:
    branches:
      - helper/session-consumer-proof-preflight-base-20260819

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  TARGET_MAIN: 59bb5319052f378f10a0216ee3956f12944c0b77

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_MAIN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Verify exact installed SESSION durable truth
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_MAIN"
          test -f .adwf/lib/session_consumer_proof.py
          test -f .adwf/lib/github_runtime_store.py
          test -f .adwf/schemas/session-continuity-checkpoint.schema.json
          test -f .adwf/instructions/CORE.md
          if git ls-tree -r --name-only HEAD | grep -q '^\.adwf-runtime/'; then
            echo 'SESSION_CONSUMER_PROOF_TRANSIENT_RUNTIME_TRACKED'
            exit 1
          fi
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          installed=json.loads(Path('.adwf-consumer/installation.json').read_text())
          profile=json.loads(Path('.adwf-consumer/profile.json').read_text())
          pack=json.loads(Path('.adwf/packs/apps-script.json').read_text())
          digest=hashlib.sha256(json.dumps(pack,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          pp=profile.get('project_packs') or {}
          report={'installed_framework':installed['framework']['source_sha'],'selected_pack':pp.get('selected'),'materialized':pp.get('materialized'),'profile_pack_digest':pp.get('selected_digest'),'installed_pack_digest':digest,'network':(pack.get('safety') or {}).get('network')}
          print(json.dumps(report,sort_keys=True), flush=True)
          if installed['framework']['source_sha']!='017042c1f2bcde8d89d4b344201e848d873ec5a9': raise SystemExit('SESSION_CONSUMER_PROOF_INSTALLED_FRAMEWORK_MISMATCH')
          if pp.get('selected')!='apps-script' or pp.get('materialized') is not True: raise SystemExit('SESSION_CONSUMER_PROOF_PROJECT_PACK_NOT_MATERIALIZED')
          if pp.get('selected_digest')!=digest: raise SystemExit('SESSION_CONSUMER_PROOF_PROJECT_PACK_DIGEST_MISMATCH')
          if (pack.get('safety') or {}).get('network')!='NONE': raise SystemExit('SESSION_CONSUMER_PROOF_PROJECT_PACK_NETWORK_NOT_NONE')
          PY
      - name: Read back immutable Runtime Ledger anchor ruleset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.adwf').resolve()))
          from lib.github_provider import GitHubClient
          from lib.github_rulesets import verify_runtime_anchor_ruleset
          client=GitHubClient(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_TOKEN'])
          result=verify_runtime_anchor_ruleset(client.rulesets())
          print(json.dumps(result,sort_keys=True), flush=True)
          if result.get('readback_verified') is not True:
              raise SystemExit('SESSION_CONSUMER_PROOF_RUNTIME_ANCHOR_RULESET_NOT_VERIFIED')
          PY
