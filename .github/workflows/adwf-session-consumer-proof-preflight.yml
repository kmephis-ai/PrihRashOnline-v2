name: ADWF SESSION Consumer Proof Preflight

on:
  pull_request:
    branches:
      - helper/session-consumer-proof-preflight-base-20260819

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  TARGET_MAIN: 59bb5319052f378f10a0216ee3956f12944c0b77

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_MAIN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Verify exact consumer main and installed SESSION delivery
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_MAIN"
          test -f .adwf/lib/session_consumer_proof.py
          test -f .adwf/schemas/session-continuity-checkpoint.schema.json
          test -f .adwf/instructions/CORE.md
          if git ls-tree -r --name-only HEAD | grep -q '^\.adwf-runtime/'; then
            echo 'SESSION_CONSUMER_PROOF_TRANSIENT_RUNTIME_TRACKED'
            exit 1
          fi
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.adwf').resolve()))
          from lib.project_packs import load_packs, _session_continuity_binding
          installed=json.loads(Path('.adwf-consumer/installation.json').read_text())
          profile=json.loads(Path('.adwf-consumer/profile.json').read_text())
          selected=(profile.get('project_packs') or {}).get('selected')
          packs=load_packs('.')
          pack=packs.get(selected) or {}
          definition=pack.get('definition') or {}
          session=_session_continuity_binding(selected, {}, definition.get('preview') or {}, definition.get('safety') or {})
          report={'installed_framework':installed['framework']['source_sha'],'selected_pack':selected,'selected_digest':(profile.get('project_packs') or {}).get('selected_digest'),'installed_pack_digest':pack.get('digest'),'session_continuity':session}
          print(json.dumps(report,sort_keys=True), flush=True)
          assert installed['framework']['source_sha']=='017042c1f2bcde8d89d4b344201e848d873ec5a9'
          assert selected=='apps-script'
          assert (profile.get('project_packs') or {}).get('materialized') is True
          assert (profile.get('project_packs') or {}).get('selected_digest')==pack.get('digest')
          assert session.get('inherits_framework_core') is True
          assert session.get('provider_authority') is False
          assert session.get('runtime_evidence_mode')=='CONSUMER_NATIVE_EXTERNAL_RUNTIME_READBACK'
          assert 'NO_NETWORK' in (session.get('safety_boundaries') or [])
          PY
      - name: Read back immutable Runtime Ledger anchor ruleset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.adwf').resolve()))
          from lib.github_provider import GitHubClient
          from lib.github_rulesets import verify_runtime_anchor_ruleset
          client=GitHubClient(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_TOKEN'])
          result=verify_runtime_anchor_ruleset(client.rulesets())
          print(json.dumps(result,sort_keys=True), flush=True)
          if result.get('readback_verified') is not True:
              raise SystemExit('SESSION_CONSUMER_PROOF_RUNTIME_ANCHOR_RULESET_NOT_VERIFIED')
          PY
