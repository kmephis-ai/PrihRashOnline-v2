name: ADWF-UPGRADE-001 Exact Candidate Artifact

on:
  push:
    branches:
      - agent/artifact-ADWF-UPGRADE-001-20260817-o1

permissions:
  contents: read

env:
  CONSUMER_SHA: c5fe7a6666dde24551f310198ba45dc3765dd735
  CONSUMER_TREE: ccdf615967cba7f592ef295707794ea068c9bd8b
  SOURCE_A: e3bd9fb33f699ae227521f7ed5866c8f11589ed4
  SOURCE_A_TREE: b86213004ea44085f0bc337f6e0212318d0a2f8f
  TARGET_B: 278014b98f606705e7ccd89c6faa5c95df530cd8
  TARGET_B_TREE: 1ab41e5a9b8b2241a523ed1b4c507bf41314d7bd
  REPOSITORY_EXPECTED: kmephis-ai/PrihRashOnline-v2
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PrihRash
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CONSUMER_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: consumer
      - name: Checkout exact source A
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/AI-Development-Framework
          ref: ${{ env.SOURCE_A }}
          fetch-depth: 1
          persist-credentials: false
          path: framework-a
      - name: Checkout exact target B
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/AI-Development-Framework
          ref: ${{ env.TARGET_B }}
          fetch-depth: 1
          persist-credentials: false
          path: framework-b
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'

      - name: Build exact verified candidate
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ env.REPOSITORY_EXPECTED }}
        run: |
          set -euo pipefail
          test "$(git -C consumer rev-parse HEAD)" = "${CONSUMER_SHA}"
          test "$(git -C consumer rev-parse HEAD^{tree})" = "${CONSUMER_TREE}"
          test "$(git -C framework-a rev-parse HEAD)" = "${SOURCE_A}"
          test "$(git -C framework-a rev-parse HEAD^{tree})" = "${SOURCE_A_TREE}"
          test "$(git -C framework-b rev-parse HEAD)" = "${TARGET_B}"
          test "$(git -C framework-b rev-parse HEAD^{tree})" = "${TARGET_B_TREE}"
          test -z "$(git -C consumer status --porcelain)"
          sha256sum consumer/AGENTS.md > /tmp/agents-before.sha256

          python framework-b/.adwf/scripts/plan_consumer_upgrade.py \
            --source-root framework-a --target-root framework-b --consumer-root consumer \
            --source-revision "${SOURCE_A}" --target-revision "${TARGET_B}" > /tmp/bundle.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/bundle.json'))
          assert d['compatibility']['status']=='PASS' and d['compatibility']['findings']==[],d['compatibility']
          assert d['plan']['status']=='READY' and d['plan']['findings']==[],d['plan']
          for k,p in [('compatibility','/tmp/compatibility.json'),('plan','/tmp/plan.json')]:
              with open(p,'w',encoding='utf-8') as f:
                  json.dump(d[k],f,ensure_ascii=False,indent=2,sort_keys=True); f.write('\n')
          print('PLANNER=PASS_READY')
          print('plan_sha256='+d['plan']['plan_sha256'])
          PY
          python framework-b/.adwf/scripts/apply_consumer_upgrade.py apply \
            --source-root framework-a --target-root framework-b --consumer-root consumer \
            --compatibility /tmp/compatibility.json --plan /tmp/plan.json > /tmp/apply.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/apply.json'))
          assert d['status']=='COMMITTED' and d.get('projection_status')=='COMMITTED',d
          rec=json.load(open('consumer/.adwf-consumer/installation.json'))
          assert rec['framework']['source_sha']=='278014b98f606705e7ccd89c6faa5c95df530cd8',rec
          print('APPLY=COMMITTED')
          PY
          rm -rf consumer/.adwf-runtime

          sha256sum consumer/AGENTS.md > /tmp/agents-after.sha256
          diff -u /tmp/agents-before.sha256 /tmp/agents-after.sha256
          git -C consumer diff --check
          {
            git -C consumer diff --name-only "${CONSUMER_SHA}"
            git -C consumer ls-files --others --exclude-standard
          } | sort -u > /tmp/changed-paths
          python - <<'PY'
          import json,subprocess
          plan=json.load(open('/tmp/plan.json'))
          allowed={e['path'] for e in plan['entries'] if e['action'] in {'REPLACE_PLANNED','CREATE_PLANNED'}}
          allowed |= {'.adwf-consumer/installation.json','.adwf-consumer/operations.json','.adwf-consumer/gates.json'}
          changed={x.strip() for x in open('/tmp/changed-paths') if x.strip()}
          forbidden=sorted(changed-allowed)
          assert not forbidden,'FORBIDDEN_PRODUCT_OR_SHARED_DIFF:'+','.join(forbidden)
          new={x.strip() for x in subprocess.check_output(['git','-C','consumer','ls-files','--others','--exclude-standard'],text=True).splitlines() if x.strip()}
          planned_new={e['path'] for e in plan['entries'] if e['action']=='CREATE_PLANNED'}
          assert new <= planned_new,sorted(new-planned_new)
          print('PUBLISHABLE_PATHS='+str(len(changed)))
          print('NEW_PLANNED_PATHS='+str(len(new)))
          print('PRODUCT_FIN_DRIFT=NO')
          PY

          rm -rf /tmp/fresh-b
          cp -a consumer /tmp/fresh-b
          rm -rf /tmp/fresh-b/.adwf-runtime
          python - <<'PY'
          import os,sys
          sys.path.insert(0,os.path.abspath('framework-b/.adwf'))
          from lib.consumer_installation import validate_fresh_session
          from lib.consumer_operational import load_binding as load_ops
          from lib.consumer_gates import load_binding as load_gates
          r=validate_fresh_session('/tmp/fresh-b','framework-b',expected_repository='kmephis-ai/PrihRashOnline-v2')
          assert r['status']=='VERIFIED',r
          assert load_ops('/tmp/fresh-b','framework-b')['roadmap']['path']=='docs/ROADMAP.md'
          gates=load_gates('/tmp/fresh-b','framework-b')
          assert gates['phases']['pr'][0]['check_name']=='validate'
          assert gates['phases']['main'][0]['check_name']=='verify'
          print('CONSUMER_FRESH_SESSION=VERIFIED')
          PY

          git -C consumer checkout -B candidate "${CONSUMER_SHA}"
          git -C consumer add -A
          tree="$(git -C consumer write-tree)"
          git -C consumer config user.name 'ADWF Autonomous Writer'
          git -C consumer config user.email 'adwf-writer@example.invalid'
          git -C consumer commit -m 'ADWF-UPGRADE-001: upgrade connected framework to 278014b'
          candidate="$(git -C consumer rev-parse HEAD)"
          test "$(git -C consumer rev-parse HEAD^)" = "${CONSUMER_SHA}"
          mkdir -p proof
          git -C consumer bundle create ../proof/candidate.bundle HEAD "${CONSUMER_SHA}"
          bundle_sha="$(sha256sum proof/candidate.bundle | awk '{print $1}')"
          cat > proof/manifest.json <<JSON
          {
            "schema_version": 1,
            "role": "ADWF_CONNECTED_CONSUMER_UPGRADE_CANDIDATE",
            "consumer_base": "${CONSUMER_SHA}",
            "source_a": "${SOURCE_A}",
            "target_b": "${TARGET_B}",
            "candidate_sha": "${candidate}",
            "candidate_tree": "${tree}",
            "bundle_sha256": "${bundle_sha}",
            "full_lifecycle_run": 32068705975,
            "full_lifecycle": "A_TO_B_FRESH_SESSION_IDEMPOTENT_ROLLBACK_A_TO_B_PASS",
            "publisher_surface": "PLAN_AUTHORIZED_ONLY",
            "consumer_fresh_session": "VERIFIED",
            "product_fin_drift": "NO",
            "monetary_budget_usd": 0
          }
          JSON
          cp /tmp/changed-paths proof/changed-paths.txt
          printf '%s  %s\n' "${bundle_sha}" candidate.bundle > proof/SHA256SUMS.txt
          cat proof/manifest.json

      - name: Upload exact candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adwf-upgrade-001-exact-candidate
          path: proof/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
