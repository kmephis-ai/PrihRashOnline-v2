name: XRAY-090 Workflow Blob

on:
  push:
    branches:
      - agent/xray090-workflow-blob-20260817-a1

permissions:
  contents: write

env:
  BASE_SHA: da178555f2166fdb70071405e4c1422659ae7593
  WRITER_SHA: 21b4e0d8f2cba218d99966b3f0dda5ca45075ece
  WRITER_BRANCH: agent/XRAY-090-financial-health-xray

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Create exact workflow blob without ref mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${WRITER_BRANCH}" --jq '.object.sha')" = "$WRITER_SHA"
          git fetch origin "${WRITER_BRANCH}"
          git checkout --detach "origin/${WRITER_BRANCH}"
          test "$(git rev-parse HEAD)" = "$WRITER_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/pr-validation.yml')
          text = p.read_text(encoding='utf-8')
          anchor = '      - name: Liquidity & financial risk\n        run: node tests/liquidity_financial_risk_contract_test.js\n'
          gate = '      - name: Financial Health X-Ray\n        run: node tests/financial_health_xray_contract_test.js\n'
          if text.count(anchor) != 1 or gate in text:
              raise SystemExit('XRAY_GATE_ANCHOR_INVALID')
          p.write_text(text.replace(anchor, anchor + gate), encoding='utf-8')
          PY
          git diff --check -- .github/workflows/pr-validation.yml
          LOCAL_SHA="$(git hash-object .github/workflows/pr-validation.yml)"
          ENCODED="$(base64 -w0 .github/workflows/pr-validation.yml)"
          REMOTE_SHA="$(jq -n --arg content "$ENCODED" '{content:$content,encoding:"base64"}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq '.sha')"
          test "$REMOTE_SHA" = "$LOCAL_SHA"
          echo "WORKFLOW_BLOB_SHA=$REMOTE_SHA"
