name: Dashboard Runtime Hotfix

on:
  push:
    branches:
      - 'agent/release/v1.0.0-rc4-apps-script-runtime'
    paths:
      - 'DashboardWebDataService.js'
      - '.github/workflows/dashboard-runtime-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify isolated parser-safe bootstrap
        shell: bash
        run: |
          set -euo pipefail
          node --check DashboardWebDataService.js
          python - <<'PY'
          from pathlib import Path
          text = Path('DashboardWebDataService.js').read_text(encoding='ascii')
          expected = 'function doGet() {\n  var template = HtmlService.createTemplateFromFile("DashboardWebApp");\n  template.initialData = "{}";\n  return template.evaluate();\n}\n'
          if text != expected:
              raise SystemExit('DashboardWebDataService.js is not the isolated bootstrap')
          PY

      - name: Prepare dashboard bundle
        run: npm run prepare:web

      - name: Configure clasp
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APPS_SCRIPT_ID}"
          test -n "${CLASPRC_JSON}"
          npm install --no-save --no-audit --no-fund @google/clasp@3
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"
          chmod 600 "${HOME}/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "${APPS_SCRIPT_ID}" > .clasp.json
          npx clasp --version

      - name: Push isolated Apps Script source
        run: npx clasp push --force

      - name: Redeploy existing DEV Web App with clasp v3
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME='PrihRashOnline Web Dashboard DEV WebApp'
          DEPLOYMENTS="$(npx clasp list-deployments)"
          printf '%s\n' "${DEPLOYMENTS}"
          DEPLOYMENT_ID="$(printf '%s\n' "${DEPLOYMENTS}" | grep -F "${DEPLOYMENT_NAME}" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1 || true)"

          if [[ -n "${DEPLOYMENT_ID}" ]]; then
            OUTPUT="$(npx clasp create-deployment --deploymentId "${DEPLOYMENT_ID}" --description "${DEPLOYMENT_NAME}")"
          else
            OUTPUT="$(npx clasp create-deployment --description "${DEPLOYMENT_NAME}")"
            DEPLOYMENT_ID="$(printf '%s\n' "${OUTPUT}" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1 || true)"
          fi

          printf '%s\n' "${OUTPUT}"
          test -n "${DEPLOYMENT_ID}"
          WEB_APP_URL="https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec"
          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "url=${WEB_APP_URL}" >> "$GITHUB_OUTPUT"

      - name: Report successful deployment to PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          WEB_APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment 11 --repo "${GITHUB_REPOSITORY}" --body "✅ Isolated Dashboard bootstrap deployed. Candidate: \`${GITHUB_SHA}\`; deployment: \`${DEPLOYMENT_ID}\`; Web App: ${WEB_APP_URL}; run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report failed deployment to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 11 --repo "${GITHUB_REPOSITORY}" --body "❌ Isolated Dashboard bootstrap deployment failed. Candidate: \`${GITHUB_SHA}\`; run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
