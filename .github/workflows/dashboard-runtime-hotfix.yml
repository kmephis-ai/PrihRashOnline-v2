name: Dashboard Runtime Template Fix

on:
  push:
    branches:
      - 'agent/release/v1.0.0-rc4-apps-script-runtime'
    paths:
      - 'DashboardWebEntry.js'
      - 'DashboardWebDataService.js'
      - 'tools/normalize-dashboard-web-runtime.js'
      - '.github/workflows/dashboard-runtime-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare and verify Apps Script template
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:web
          test ! -e DashboardWebDataService.js
          node --check DashboardWebEntry.js
          python - <<'PY'
          from pathlib import Path
          entry = Path('DashboardWebEntry.js').read_text(encoding='ascii')
          html = Path('DashboardWebApp.html').read_text(encoding='utf-8')
          if "return template.evaluate();" not in entry:
              raise SystemExit('DashboardWebEntry.js does not evaluate the Dashboard template')
          if "text.indexOf('<?')" in html:
              raise SystemExit('Unsafe client-side <? sentinel remains in DashboardWebApp.html')
          if html.count('<?') != 1:
              raise SystemExit(f'Expected exactly one template opener, found {html.count("<?")}')
          if '<?!= initialData ?>' not in html:
              raise SystemExit('Real initialData scriptlet is missing')
          print('Template scriptlet gate: OK; exactly one real Apps Script opener remains')
          PY

      - name: Configure clasp
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APPS_SCRIPT_ID}"
          test -n "${CLASPRC_JSON}"
          npm install --no-save --no-audit --no-fund @google/clasp@3
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"
          chmod 600 "${HOME}/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "${APPS_SCRIPT_ID}" > .clasp.json
          npx clasp --version

      - name: Push repaired Dashboard to Apps Script
        run: npx clasp push --force

      - name: Pull back and verify repaired remote source
        shell: bash
        run: |
          set -euo pipefail
          ENTRY_SHA="$(sha256sum DashboardWebEntry.js | awk '{print $1}')"
          HTML_SHA="$(sha256sum DashboardWebApp.html | awk '{print $1}')"
          rm DashboardWebEntry.js DashboardWebApp.html
          test ! -e DashboardWebDataService.js
          npx clasp pull
          test -f DashboardWebEntry.js
          test -f DashboardWebApp.html
          test ! -e DashboardWebDataService.js
          test "${ENTRY_SHA}" = "$(sha256sum DashboardWebEntry.js | awk '{print $1}')"
          test "${HTML_SHA}" = "$(sha256sum DashboardWebApp.html | awk '{print $1}')"
          python - <<'PY'
          from pathlib import Path
          html = Path('DashboardWebApp.html').read_text(encoding='utf-8')
          if "text.indexOf('<?')" in html or html.count('<?') != 1 or '<?!= initialData ?>' not in html:
              raise SystemExit('Pulled remote Dashboard template failed scriptlet gate')
          print('Remote push->pull template verification: OK')
          PY

      - name: Create fresh repaired Dashboard deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME="PrihRashOnline repaired template ${GITHUB_SHA}"
          OUTPUT="$(npx clasp create-deployment --description "${DEPLOYMENT_NAME}")"
          printf '%s\n' "${OUTPUT}"
          DEPLOYMENT_ID="$(printf '%s\n' "${OUTPUT}" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1 || true)"
          test -n "${DEPLOYMENT_ID}"
          WEB_APP_URL="https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec"
          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "url=${WEB_APP_URL}" >> "$GITHUB_OUTPUT"

      - name: Report successful repaired deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          WEB_APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment 11 --repo "${GITHUB_REPOSITORY}" --body "✅ Dashboard template root cause repaired and push→pull verified. Only the real \`<?!= initialData ?>\` Apps Script opener remains; the client-side \`<?\` sentinel is gone. Candidate: \`${GITHUB_SHA}\`; deployment: \`${DEPLOYMENT_ID}\`; Web App: ${WEB_APP_URL}; run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report failed repaired deployment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 11 --repo "${GITHUB_REPOSITORY}" --body "❌ Dashboard template repair deployment failed closed. Candidate: \`${GITHUB_SHA}\`; run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
