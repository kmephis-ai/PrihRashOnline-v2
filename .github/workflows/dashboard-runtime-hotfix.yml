name: Dashboard Runtime Identity Probe

on:
  push:
    branches:
      - 'agent/release/v1.0.0-rc4-apps-script-runtime'
    paths:
      - 'DashboardWebEntry.js'
      - 'DashboardWebDataService.js'
      - '.github/workflows/dashboard-runtime-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify renamed one-line entry
        shell: bash
        run: |
          set -euo pipefail
          test ! -e DashboardWebDataService.js
          node --check DashboardWebEntry.js
          python - <<'PY'
          from pathlib import Path
          p = Path('DashboardWebEntry.js')
          text = p.read_text(encoding='ascii')
          expected = "function doGet(){return HtmlService.createHtmlOutput('PRIHRASH_RUNTIME_OK');}\n"
          if text != expected:
              raise SystemExit('DashboardWebEntry.js differs from identity probe')
          PY

      - name: Configure clasp
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APPS_SCRIPT_ID}"
          test -n "${CLASPRC_JSON}"
          npm install --no-save --no-audit --no-fund @google/clasp@3
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"
          chmod 600 "${HOME}/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "${APPS_SCRIPT_ID}" > .clasp.json
          npx clasp --version

      - name: Push renamed entry to Apps Script
        run: npx clasp push --force

      - name: Pull back and verify remote identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(sha256sum DashboardWebEntry.js | awk '{print $1}')"
          rm DashboardWebEntry.js
          test ! -e DashboardWebDataService.js
          npx clasp pull
          test -f DashboardWebEntry.js
          test ! -e DashboardWebDataService.js
          REMOTE_SHA="$(sha256sum DashboardWebEntry.js | awk '{print $1}')"
          test "${EXPECTED_SHA}" = "${REMOTE_SHA}"
          python - <<'PY'
          from pathlib import Path
          text = Path('DashboardWebEntry.js').read_text(encoding='ascii')
          expected = "function doGet(){return HtmlService.createHtmlOutput('PRIHRASH_RUNTIME_OK');}\n"
          if text != expected:
              raise SystemExit('Pulled Apps Script entry differs from pushed probe')
          PY
          echo "Remote Apps Script project contains DashboardWebEntry.js and no DashboardWebDataService.js"

      - name: Create fresh identity-probe Web App deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME="PrihRashOnline identity probe ${GITHUB_SHA}"
          OUTPUT="$(npx clasp create-deployment --description "${DEPLOYMENT_NAME}")"
          printf '%s\n' "${OUTPUT}"
          DEPLOYMENT_ID="$(printf '%s\n' "${OUTPUT}" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1 || true)"
          test -n "${DEPLOYMENT_ID}"
          WEB_APP_URL="https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec"
          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "url=${WEB_APP_URL}" >> "$GITHUB_OUTPUT"

      - name: Report successful identity probe
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          WEB_APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment 11 --repo "${GITHUB_REPOSITORY}" --body "✅ Apps Script identity probe passed push→pull verification. Remote project has \`DashboardWebEntry.js\` and no \`DashboardWebDataService.js\`. Candidate: \`${GITHUB_SHA}\`; deployment: \`${DEPLOYMENT_ID}\`; Web App: ${WEB_APP_URL}; run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report failed identity probe
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 11 --repo "${GITHUB_REPOSITORY}" --body "❌ Apps Script identity probe failed. Candidate: \`${GITHUB_SHA}\`; run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
