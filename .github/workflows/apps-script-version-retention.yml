name: Apps Script Version Retention

on:
  workflow_run:
    workflows: [Main Verification]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-version-retention
  cancel-in-progress: false

jobs:
  prune:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: DEV
    env:
      CLASP_USER: prihrash-ci
    steps:
      - name: Checkout trusted default-branch retention policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up trusted Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Configure owner OAuth profile
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLASPRC_JSON}" ]] || { echo '::error::Missing owner OAuth profile.'; exit 1; }
          printf '%s' "${CLASPRC_JSON}" > "${HOME}/.clasprc.json"
          chmod 600 "${HOME}/.clasprc.json"
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync(process.env.HOME+'/.clasprc.json','utf8'));if(!a.tokens||!a.tokens['prihrash-ci'])throw new Error('named OAuth profile missing')"

      - name: Prune proven-unused Apps Script versions
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(node tools/apps-script-version-retention.js --apply)"
          OK="$(jq -r '.ok // false' <<<"${RESULT}")"
          REASON="$(jq -r '.reason // "VERSION_RETENTION_FAILED"' <<<"${RESULT}")"
          BEFORE="$(jq -r '.before_count // 0' <<<"${RESULT}")"
          AFTER="$(jq -r '.after_count // 0' <<<"${RESULT}")"
          DELETED="$(jq -r '.deleted_count // 0' <<<"${RESULT}")"
          [[ "${REASON}" =~ ^[A-Z0-9_]+$ ]] || REASON='VERSION_RETENTION_FAILED'
          [[ "${BEFORE}" =~ ^[0-9]+$ && "${AFTER}" =~ ^[0-9]+$ && "${DELETED}" =~ ^[0-9]+$ ]] || {
            echo '::error::Retention evidence is invalid.'
            exit 1
          }
          {
            echo '### Apps Script version retention'
            echo ''
            echo "- result: ${OK}"
            echo "- reason: ${REASON}"
            echo "- versions before: ${BEFORE}"
            echo "- versions after: ${AFTER}"
            echo "- unused versions removed: ${DELETED}"
          } >> "${GITHUB_STEP_SUMMARY}"
          [[ "${OK}" == 'true' ]] || exit 1
