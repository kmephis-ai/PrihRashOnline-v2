name: ADWF Local Git Mirror Publish E2E-LF Binary

on:
  push:
    branches:
      - agent/local-mirror-e2e-lf-20260816-a1
    paths:
      - .github/workflows/adwf-local-mirror-publish-e2e-binary.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/E2E-LF-001-product-ready-local-first
  EXPECTED_PARENT: f6270eace9d95b997811500d4e7e39f281448513
  EXPECTED_COMMIT: ef4808cc4220385a5eb136bf9512b558d92d47a2
  EXPECTED_TREE: 25fdd50d1c838858b5b264ceb655f5291a0994b3
  EXPECTED_BUNDLE_SHA256: ef45f62bcc1c220219286299dfa2ec626e65b4c082ed93582cbfce35cde822be

jobs:
  publish-exact-local-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify binary chunks and rebuild exact bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .adwf-transport/e2e-lf-visual-binary-chunks/part-00)" = "f79b13bcff0d6c3f8e6b0d612fc1db0aec09890e"
          test "$(git hash-object .adwf-transport/e2e-lf-visual-binary-chunks/part-01)" = "9ead4e9b79fa7af09627a6a565f72527580227f7"
          test "$(git hash-object .adwf-transport/e2e-lf-visual-binary-chunks/part-02)" = "d28cffa57c3334a5913468914985c84b56112f3a"
          test "$(git hash-object .adwf-transport/e2e-lf-visual-binary-chunks/part-03)" = "0f17d698f109b9c9999d302d69c00ee135c0a682"
          test "$(git hash-object .adwf-transport/e2e-lf-visual-binary-chunks/part-04)" = "03ea215c2250862a03c6d2227d64c20c5d6f3998"
          test "$(git hash-object .adwf-transport/e2e-lf-visual-binary-chunks/part-05)" = "7dd7ddc4b78056ffa49b68ee79caba3b9c4134c0"
          cat .adwf-transport/e2e-lf-visual-binary-chunks/part-{00,01,02,03,04,05} > /tmp/e2e-lf-visual-update.bundle
          test "$(wc -c < /tmp/e2e-lf-visual-update.bundle | tr -d ' ')" = "8999"
          echo "${EXPECTED_BUNDLE_SHA256}  /tmp/e2e-lf-visual-update.bundle" | sha256sum --check --strict
          git bundle verify /tmp/e2e-lf-visual-update.bundle

      - name: Verify exact local commit identity and diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch /tmp/e2e-lf-visual-update.bundle HEAD:refs/heads/adwf-publish-e2e-visual
          test "$(git rev-parse refs/heads/adwf-publish-e2e-visual)" = "${EXPECTED_COMMIT}"
          test "$(git rev-parse refs/heads/adwf-publish-e2e-visual^)" = "${EXPECTED_PARENT}"
          test "$(git rev-parse refs/heads/adwf-publish-e2e-visual^{tree})" = "${EXPECTED_TREE}"
          test "$(git rev-list --parents -n 1 refs/heads/adwf-publish-e2e-visual | awk '{print NF}')" -eq 2
          mapfile -t changed < <(git diff --name-only "${EXPECTED_PARENT}" "${EXPECTED_COMMIT}")
          expected=(
            tests/local_first_product_ready_visual_test.js
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)

      - name: Fail closed if provider writer head moved
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${EXPECTED_PARENT}"

      - name: Publish exact local commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${EXPECTED_COMMIT}:refs/heads/${TARGET_BRANCH}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${EXPECTED_COMMIT}"
