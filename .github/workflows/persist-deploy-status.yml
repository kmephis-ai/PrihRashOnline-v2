name: Persist Apps Script Deploy Status

on:
  workflow_run:
    workflows:
      - Deploy Apps Script DEV
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Write deployment status
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          mkdir -p .deploy
          cat > .deploy/apps-script-dev.status.json <<JSON
          {
            "workflow": "Deploy Apps Script DEV",
            "runId": ${RUN_ID},
            "runNumber": ${RUN_NUMBER},
            "runAttempt": ${RUN_ATTEMPT},
            "status": "${RUN_STATUS}",
            "conclusion": "${RUN_CONCLUSION}",
            "event": "${RUN_EVENT}",
            "workflowHeadSha": "${RUN_HEAD_SHA}",
            "workflowHeadBranch": "${RUN_HEAD_BRANCH}",
            "runUrl": "${RUN_URL}",
            "updatedAt": "${UPDATED_AT}"
          }
          JSON

      - name: Commit status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy/apps-script-dev.status.json
          if git diff --cached --quiet; then
            echo 'Deployment status is unchanged.'
            exit 0
          fi
          git commit -m "ci: record Apps Script deploy run ${{ github.event.workflow_run.id }}"
          git push origin HEAD:main
