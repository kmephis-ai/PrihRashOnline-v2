name: DASH-090 Trusted Apps Script BigInt Compatibility Materializer

on:
  push:
    branches:
      - agent/materializer-DASH-090-bigint-20260817-a

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MAIN_SHA: 51d5798671478c9cbfe63dcfb88bfbf3f5152de3
      DASH_SHA: d079dcef18183d295e2b2e59642baad98e1b914d
      EXPECTED_TREE: ccdf615967cba7f592ef295707794ea068c9bd8b
      PATCH_SHA256: c901548b04cfb94fb5e742ecc14d48d6a476982a67983aa9648f74694832e06a
      DASH_BRANCH: agent/DASH-090-expert-dashboard-gallery
      TARGET_BRANCH: agent/integration-DASH-090-apps-script-bigint
      PATCH_B64: 
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact provider refs and patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/${DASH_BRANCH}:refs/remotes/origin/dash"
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/dash)" = "$DASH_SHA"
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/bigint.patch"
          test "$(sha256sum "$RUNNER_TEMP/bigint.patch" | awk '{print $1}')" = "$PATCH_SHA256"
          git apply --check "$RUNNER_TEMP/bigint.patch"
          git apply "$RUNNER_TEMP/bigint.patch"
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          expected=(tests/r2_financial_runtime_parity_contract_test.js tools/build-apps-script-runtime-bundle.js)
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git add "${expected[@]}"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check

      - name: Run trusted packager compatibility regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/build-apps-script-runtime-bundle.js
          node tests/r2_financial_runtime_parity_contract_test.js
          node tests/apps_script_candidate_contract_test.js
          node tests/trusted_dev_deploy_runtime_contract_test.js

      - name: Prove patched trusted builder against exact DASH-090 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dash-source" "$RUNNER_TEMP/candidate"
          git archive "$DASH_SHA" | tar -x -C "$RUNNER_TEMP/dash-source"
          node tools/build-apps-script-candidate.js --source "$RUNNER_TEMP/dash-source" --out "$RUNNER_TEMP/candidate" --sha "$DASH_SHA"
          test -f "$RUNNER_TEMP/candidate/files/R2CanonicalRuntimeBundle.js"
          node - "$RUNNER_TEMP/candidate/files/R2CanonicalRuntimeBundle.js" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          const source=fs.readFileSync(file,'utf8');
          const literal=/(?:\b0[xX][0-9A-Fa-f]+n\b|\b0[bB][01]+n\b|\b0[oO][0-7]+n\b|\b[0-9]+n\b)/.exec(source);
          if(literal) throw new Error('BigInt literal remains in generated Apps Script runtime: '+literal[0]);
          if(!source.includes('BigInt("0")')) throw new Error('expected decimal BigInt lowering evidence missing');
          console.log('apps-script-bigint-compat: PASS');
          NODE

      - name: Seal bounded integration commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PrihRash Trusted Integration'
          git config user.email 'prihrash-integration@example.invalid'
          git commit -m 'fix(runtime): lower BigInt literals in trusted Apps Script bundle'
          test "$(git rev-parse HEAD^)" = "$MAIN_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"

      - name: Publish integration staging ref without force
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$TARGET_BRANCH"
