name: ADWF Consumer Main Verification

on:
  push:
    branches: [main]
    paths:
      - '.adwf/**'
      - '.adwf-consumer/**'
      - '.github/workflows/adwf-*.yml'
      - '.ai-context/PROJECT_CONTEXT.md'
      - 'docs/PROJECT_STATUS.md'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: adwf-consumer-main-verification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Fail closed outside ADWF consumer/control-plane surfaces
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SUBJECT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          before = os.environ['BEFORE_SHA'].strip()
          subject = os.environ['SUBJECT_SHA'].strip()
          if len(before) != 40 or set(before) == {'0'}:
              raise SystemExit('ADWF_CONSUMER_MAIN_BEFORE_SHA_INVALID')
          if len(subject) != 40:
              raise SystemExit('ADWF_CONSUMER_MAIN_SUBJECT_SHA_INVALID')

          subprocess.run(['git', 'cat-file', '-e', f'{before}^{{commit}}'], check=True)
          subprocess.run(['git', 'cat-file', '-e', f'{subject}^{{commit}}'], check=True)

          current = json.loads(Path('.adwf-consumer/installation.json').read_text(encoding='utf-8'))
          managed = {
              str(entry.get('path', '')).strip()
              for entry in current.get('managed_surface', {}).get('entries', [])
              if entry.get('managed_by_adwf') is True and str(entry.get('path', '')).strip()
          }

          old = subprocess.run(
              ['git', 'show', f'{before}:.adwf-consumer/installation.json'],
              check=False,
              capture_output=True,
              text=True,
          )
          if old.returncode == 0 and old.stdout.strip():
              previous = json.loads(old.stdout)
              managed.update(
                  str(entry.get('path', '')).strip()
                  for entry in previous.get('managed_surface', {}).get('entries', [])
                  if entry.get('managed_by_adwf') is True and str(entry.get('path', '')).strip()
              )

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACDMRT', before, subject],
              text=True,
          ).splitlines()
          changed = [path.strip() for path in changed if path.strip()]
          if not changed:
              raise SystemExit('ADWF_CONSUMER_MAIN_EMPTY_CHANGESET')

          explicit = {
              '.github/workflows/adwf-consumer-main-verification.yml',
              '.ai-context/PROJECT_CONTEXT.md',
              'docs/PROJECT_STATUS.md',
          }
          forbidden = [
              path for path in changed
              if path not in managed
              and not path.startswith('.adwf-consumer/')
              and path not in explicit
          ]
          if forbidden:
              print(json.dumps({'status': 'BLOCK', 'forbidden_paths': forbidden}, ensure_ascii=False, sort_keys=True))
              raise SystemExit('ADWF_CONSUMER_MAIN_NON_CONTROL_PLANE_DIFF')

          print(json.dumps({
              'status': 'CONTROL_PLANE_ONLY',
              'subject_sha': subject,
              'changed_paths': changed,
              'managed_path_union_count': len(managed),
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Revalidate sealed ADWF consumer operating state
        run: |
          python .adwf/scripts/consumer_ci.py classify-current --repository "${{ github.repository }}"
          python .adwf/scripts/consumer_gates.py --project-root .
          python .adwf/adwf.py roadmap-view

      - name: Revalidate native security privacy cost and documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          node tools/supply-chain-scan.js
          node tools/ci-trust-boundary-scan.js
          node tools/secret-scan.js
          node tools/privacy-public-data-scan.js
          node tools/free-only-scan.js
          node tools/docs-drift-scan.js
          node tools/language-policy-scan.js
          node tools/verify-adwf-local-git-mirror.js
