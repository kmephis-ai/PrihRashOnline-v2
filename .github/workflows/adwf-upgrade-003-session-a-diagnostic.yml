name: ADWF UPGRADE-003 Session A Diagnostic

on:
  push:
    branches:
      - helper/adwf-upgrade-003-session-a-diagnostic-20260819-a1
    paths:
      - .github/workflows/adwf-upgrade-003-session-a-diagnostic.yml

permissions:
  contents: write
  issues: read
  actions: read

env:
  SUBJECT_SHA: 91d91252cd7d08e33a3c004290d486024424a69e
  SESSION_A_HEAD_SHA: 33024c5ee13dd80616f058ee714867774e098cdd
  EXPECTED_LEDGER_ISSUE: '329'
  EXPECTED_PROVIDER_OBJECT_ID: '5337377059'
  EXPECTED_EVENT_HASH: e545573a2c2640f1adca04c0c914d6fff9b1f9121fdab72be1d9607f53302f35
  EXPECTED_EVENT_ANCHOR: adwf-runtime-anchor-000001-e545573a2c2640f1
  EVIDENCE_BRANCH: helper/adwf-upgrade-003-session-a-diagnostic-20260819-a1
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Read provider state only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,sys,urllib.request
          sys.path.insert(0,str(Path('.adwf').resolve()))
          from lib.github_provider import GitHubClient
          from lib.github_runtime_store import ROOT_ANCHOR,TITLE
          from lib.provider_contracts import ProviderContractError

          token=os.environ['GITHUB_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']
          def api(url):
              req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'adwf-session-a-diagnostic'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.loads(response.read().decode())
          client=GitHubClient(repo,token)
          out={'schema_version':1,'subject_sha':os.environ['SUBJECT_SHA']}
          runs=api(f'https://api.github.com/repos/{repo}/actions/runs?per_page=100').get('workflow_runs') or []
          matches=[r for r in runs if r.get('name')=='ADWF UPGRADE-003 Session Root A' and r.get('head_sha')==os.environ['SESSION_A_HEAD_SHA']]
          if matches:
              latest=max(matches,key=lambda r:int(r['id']))
              out['session_a_run_id']=latest['id'];out['session_a_status']=latest.get('status');out['session_a_conclusion']=latest.get('conclusion')
              jobs=api(latest['jobs_url']+'?per_page=100').get('jobs') or []
              out['session_a_jobs']=[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion')} for j in jobs]
          else:
              out['session_a_status']='MISSING'
          try:
              ref=client.tag_ref(ROOT_ANCHOR)
              root_sha=str((ref.get('object') or {}).get('sha') or '')
              tag=client.tag_object(root_sha)
              out['root_state']='PRESENT';out['root_tag_object_sha']=root_sha;out['root_target_sha']=str((tag.get('object') or {}).get('sha') or '')
              try:out['root_payload']=json.loads(str(tag.get('message') or '{}'))
              except Exception:out['root_payload']='INVALID'
          except ProviderContractError as exc:
              if str(exc)=='PROVIDER_HTTP_404':out['root_state']='ABSENT'
              else:raise
          ledgers=[i for i in client.issues() if i.get('title')==TITLE and i.get('state')=='open']
          out['open_ledgers']=[int(i.get('number') or 0) for i in ledgers]
          comments=client.issue_comments(int(os.environ['EXPECTED_LEDGER_ISSUE']))
          out['ledger_comment_count']=len(comments)
          out['ledger_comment_ids']=[str(c.get('id') or '') for c in comments]
          out['ledger_comment_sha256']=[hashlib.sha256(str(c.get('body') or '').encode()).hexdigest() for c in comments]
          eref=client.tag_ref(os.environ['EXPECTED_EVENT_ANCHOR'])
          out['event_anchor_tag_object_sha']=str((eref.get('object') or {}).get('sha') or '')
          Path('session-a-diagnostic.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Publish diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f session-a-diagnostic.json || printf '{"schema_version":1,"diagnostic":"FAILED_BEFORE_OUTCOME"}\n' > session-a-diagnostic.json
          git config user.name 'adwf-session-diagnostic'
          git config user.email 'adwf-session-diagnostic@users.noreply.github.com'
          git add session-a-diagnostic.json
          git commit -m 'chore: publish Session A diagnostic'
          git push origin "HEAD:refs/heads/${EVIDENCE_BRANCH}"
