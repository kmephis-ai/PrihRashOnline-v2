name: Dashboard Deploy Command

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: read

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 6 &&
      github.event.comment.body == '/deploy-dashboard-dev' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Dispatch Apps Script DEV deployment
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh workflow run deploy-apps-script.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f target_ref=agent/dashboard-ux-structure
          EXIT_CODE=$?
          set -e
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          if [[ "${EXIT_CODE}" -eq 0 ]]; then
            echo 'accepted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'accepted=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Persist command status
        if: always()
        shell: bash
        env:
          COMMAND_ACCEPTED: ${{ steps.dispatch.outputs.accepted || 'false' }}
          DISPATCH_EXIT_CODE: ${{ steps.dispatch.outputs.exit_code || 'unknown' }}
        run: |
          set -euo pipefail
          mkdir -p .deploy
          cat > .deploy/dashboard-deploy-command.status.json <<JSON
          {
            "command": "/deploy-dashboard-dev",
            "issue": 6,
            "actor": "${GITHUB_ACTOR}",
            "accepted": ${COMMAND_ACCEPTED},
            "dispatchExitCode": "${DISPATCH_EXIT_CODE}",
            "targetRef": "agent/dashboard-ux-structure",
            "commandRunId": ${GITHUB_RUN_ID},
            "commandRunUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "requestedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add .deploy/dashboard-deploy-command.status.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: record dashboard deploy command ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi

      - name: Fail when dispatch was rejected
        if: steps.dispatch.outputs.accepted != 'true'
        run: exit 1

      - name: Command summary
        if: always()
        run: |
          echo '### Dashboard DEV deployment command' >> "$GITHUB_STEP_SUMMARY"
          echo '- Target ref: `agent/dashboard-ux-structure`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Deployment workflow: `deploy-apps-script.yml`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Accepted: `${{ steps.dispatch.outputs.accepted || 'false' }}`' >> "$GITHUB_STEP_SUMMARY"
