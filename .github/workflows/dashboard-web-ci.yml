name: Dashboard Web CI

on:
  push:
    branches:
      - agent/dashboard-ux-structure
    paths:
      - '*.js'
      - '*.html'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/dashboard-web-ci.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '*.js'
      - '*.html'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/dashboard-web-ci.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: dashboard-web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run contract tests
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/dashboard_web_contract_test.js
          mapfile -t TEST_FILES < <(find tests -maxdepth 1 -type f -name '*contract_test.js' -print | sort -u)
          if [[ "${#TEST_FILES[@]}" -eq 0 ]]; then
            echo '::error::No contract tests found.'
            exit 1
          fi
          for test_file in "${TEST_FILES[@]}"; do
            echo "Running ${test_file}"
            node "${test_file}"
          done

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run responsive visual gate
        shell: bash
        run: node tests/dashboard_web_visual_test.js

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-web-ci-${{ steps.source.outputs.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Validation summary
        if: always()
        shell: bash
        run: |
          echo '### Dashboard Web CI' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: \`${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Viewports: `1600×1000`, `1280×900`, `390×844`' >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`dashboard-web-ci-${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
