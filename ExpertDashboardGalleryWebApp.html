<!doctype html>
<html lang="ru"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>PrihRashOnline — Галерея экспертных дашбордов</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--subtle:#f7f9fc;--text:#10233f;--muted:#52657d;--border:#d7e0ea;--brand:#0b6570;--on:#fff;--ok:#136c3b;--bad:#8a3b12;--focus:#005fcc;--shadow:0 8px 24px rgba(16,35,63,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}button,input,a{font:inherit}:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.wrap{max-width:1280px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:end}.hero h1{margin:4px 0;font-size:clamp(26px,4vw,40px)}.hero p{max-width:780px;color:var(--muted);margin:6px 0}.back{color:var(--brand);font-weight:800;text-decoration:none}.status{font-size:12px;font-weight:800;color:var(--ok)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}.card,.editor{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;min-width:0;box-shadow:var(--shadow)}.card{display:flex;flex-direction:column}.card h2,.editor h2{font-size:17px;margin:0 0 6px}.card p{color:var(--muted);min-height:62px}.caps{font-size:11px;color:var(--muted);overflow-wrap:anywhere;margin:8px 0 14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.btn{border:0;border-radius:999px;padding:9px 12px;background:var(--brand);color:var(--on);font-weight:800;cursor:pointer}.btn.secondary{background:var(--subtle);color:var(--text);border:1px solid var(--border)}.btn[disabled]{opacity:.55;cursor:not-allowed}.result{margin-top:16px;min-height:24px}.panel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.panel{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--subtle);min-width:0}.panel b{display:block}.panel small{display:block;color:var(--muted);overflow-wrap:anywhere;margin-top:4px}.field{display:grid;gap:6px;margin-top:16px}.field label{font-weight:800}.field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text)}.meta{color:var(--muted);font-size:12px}.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.wrap{padding:16px}.hero{align-items:start;flex-direction:column}.grid,.panel-grid{grid-template-columns:1fr}.card p{min-height:0}}@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111b2c;--subtle:#162338;--text:#f3f7fc;--muted:#aebdd0;--border:#33445d;--brand:#34b5b0;--on:#06141a;--ok:#78d9a1;--focus:#8fc5ff;--shadow:none}}
</style></head>
<body data-prh-dash090-gallery="1" data-financial-payload="false" data-query-execution="false" data-financial-write="false" data-google-sheets-read="false"><main class="wrap">
<div class="hero"><div><a class="back" href="?surface=studio&mode=studio">← Analytics Studio</a><h1>Галерея экспертных дашбордов</h1><p>Готовые конфигурации поверх canonical Dashboard Composer, Saved Views и аналитических контрактов. Галерея хранит только конфигурацию и не вычисляет финансовые формулы.</p></div><div class="status">FREE_ONLY · FIN-TRUTH unchanged</div></div>
<section id="gallery" class="grid" aria-live="polite"></section><section id="editor" hidden aria-live="polite"></section><div id="result" class="result" role="status" aria-live="polite"></div>
</main><script>
(function(){'use strict';
const fallback=[['CASH_FLOW_DECOMPOSITION','Декомпозиция денежного потока'],['SPENDING_DRIVERS','Драйверы расходов'],['SEASONALITY','Сезонность'],['CONCENTRATION','Концентрация'],['LONG_TERM_TRENDS','Долгосрочные тренды'],['WEALTH_RISK','Капитал и финансовая устойчивость'],['FINANCIAL_HEALTH_XRAY','Финансовый рентген семьи']];
const gallery=document.getElementById('gallery'),editor=document.getElementById('editor'),result=document.getElementById('result');
function runner(){return window.google&&google.script&&google.script.run?google.script.run:null}function safeId(id){return 'dash090-'+String(id).toLowerCase().replace(/_/g,'-')+'-'+Date.now().toString(36)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function viewId(){return new URL(location.href).searchParams.get('view')||''}
function call(method,arg,ok,fail){const r=runner();if(!r){fail(new Error('RUNTIME_UNAVAILABLE'));return}let chain=r.withSuccessHandler(ok).withFailureHandler(fail);chain[method](arg)}
function renderCatalog(data){editor.hidden=true;gallery.hidden=false;gallery.textContent='';const presets=data&&Array.isArray(data.presets)&&data.presets.length?data.presets:fallback.map(x=>({preset_id:x[0],title:x[1],description:'Проверяем совместимость runtime capabilities…',required_capabilities:[],status:'UNAVAILABLE',reason:'RUNTIME_CAPABILITY_STATE_UNVERIFIED'}));presets.forEach(p=>{const card=document.createElement('article');card.className='card';card.dataset.presetId=p.preset_id;const h=document.createElement('h2');h.textContent=p.title;const d=document.createElement('p');d.textContent=p.description;const c=document.createElement('div');c.className='caps';c.textContent=(p.required_capabilities||[]).join(' · ');const actions=document.createElement('div');actions.className='actions';const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=p.status==='AVAILABLE'?'Создать копию':'Недоступно';b.disabled=p.status!=='AVAILABLE';b.addEventListener('click',()=>clonePreset(p,b));actions.append(b);card.append(h,d,c,actions);gallery.append(card)});}
function clonePreset(p,b){b.disabled=true;result.textContent='Создаю приватную копию…';call('prhDash090ClonePreset',{preset_id:p.preset_id,view_id:safeId(p.preset_id),name:p.title},v=>{history.replaceState(null,'','?surface=gallery&view='+encodeURIComponent(v.view_id));result.textContent='Копия создана и сохранена приватно.';renderEditor(v)},e=>{result.textContent='Не удалось создать копию: '+String(e&&e.message||e);b.disabled=false})}
function renderEditor(v){gallery.hidden=true;editor.hidden=false;editor.className='editor';const panels=(v.panels||[]).map(p=>'<article class="panel"><b>'+esc(p.title)+'</b><small>'+esc(p.visual_ref)+' · '+esc(p.source_contract)+'</small></article>').join('');editor.innerHTML='<a class="back" href="?surface=gallery" id="back-gallery">← Все шаблоны</a><h2>'+esc(v.preset_title)+'</h2><p class="meta">'+esc(v.preset_description)+'</p><div class="panel-grid">'+panels+'</div><div class="field"><label for="dashboard-title">Название моей копии</label><input id="dashboard-title" maxlength="100" value="'+esc(v.dashboard_spec&&v.dashboard_spec.title)+'"></div><div class="editor-actions"><button class="btn" id="save-view" type="button">Сохранить изменения</button><button class="btn secondary" id="reload-view" type="button">Перезагрузить копию</button></div><p class="meta">Версия '+esc(v.active_revision)+' · конфигурация хранится в DASH-084 · Google Sheets не читаются.</p>';document.getElementById('save-view').addEventListener('click',()=>save(v));document.getElementById('reload-view').addEventListener('click',()=>loadView(v.view_id))}
function save(v){const b=document.getElementById('save-view'),title=document.getElementById('dashboard-title').value;b.disabled=true;result.textContent='Сохраняю новую версию конфигурации…';call('prhDash090SaveViewConfiguration',{view_id:v.view_id,expected_generation:v.store_generation,dashboard_title:title},next=>{result.textContent=next.active_revision===v.active_revision?'Изменений нет.':'Изменения сохранены как новая версия.';renderEditor(next)},e=>{result.textContent='Не удалось сохранить: '+String(e&&e.message||e);b.disabled=false})}
function loadView(id){result.textContent='';call('prhDash090ReadView',{view_id:id},renderEditor,e=>{result.textContent='Не удалось открыть копию: '+String(e&&e.message||e);history.replaceState(null,'','?surface=gallery');loadCatalog()})}
function loadCatalog(){renderCatalog(null);call('prhDash090PublicCatalog',{},renderCatalog,()=>renderCatalog(null))}
const id=viewId();if(id)loadView(id);else loadCatalog();
window.PRH_DASH090_GALLERY=Object.freeze({reload:()=>{const id=viewId();if(id)loadView(id);else loadCatalog()}});
})();
</script></body></html>
