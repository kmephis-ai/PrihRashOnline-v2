<!doctype html>
<html lang="ru"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>PrihRashOnline — Галерея экспертных дашбордов</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#10233f;--muted:#52657d;--border:#d7e0ea;--brand:#0b6570;--on:#fff;--ok:#136c3b;--bad:#8a3b12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:end}.hero h1{margin:0;font-size:clamp(26px,4vw,40px)}.hero p{max-width:760px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;min-width:0}.card h2{font-size:17px;margin:0 0 6px}.card p{color:var(--muted);min-height:62px}.caps{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.btn{border:0;border-radius:999px;padding:9px 12px;background:var(--brand);color:var(--on);font-weight:800;cursor:pointer}.btn[disabled]{opacity:.55;cursor:not-allowed}.status{font-size:12px;font-weight:800;color:var(--ok)}.result{margin-top:16px;min-height:24px}.back{color:var(--brand);font-weight:800;text-decoration:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.hero{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.card p{min-height:0}}@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111b2c;--text:#f3f7fc;--muted:#aebdd0;--border:#33445d;--brand:#34b5b0;--on:#06141a}}
</style></head>
<body data-prh-dash090-gallery="1" data-financial-payload="false" data-query-execution="false" data-financial-write="false"><main class="wrap">
<div class="hero"><div><a class="back" href="?surface=studio&mode=studio">← Analytics Studio</a><h1>Галерея экспертных дашбордов</h1><p>Готовые конфигурации поверх canonical Dashboard Composer, Saved Views и аналитических контрактов. Галерея не хранит финансовые значения и не вычисляет финансовые формулы.</p></div><div class="status">FREE_ONLY · FIN-TRUTH unchanged</div></div>
<section id="gallery" class="grid" aria-live="polite"></section><div id="result" class="result" role="status" aria-live="polite"></div>
</main><script>
(function(){'use strict';
const fallback=[['CASH_FLOW_DECOMPOSITION','Декомпозиция денежного потока'],['SPENDING_DRIVERS','Драйверы расходов'],['SEASONALITY','Сезонность'],['CONCENTRATION','Концентрация'],['LONG_TERM_TRENDS','Долгосрочные тренды'],['WEALTH_RISK','Капитал и финансовая устойчивость'],['FINANCIAL_HEALTH_XRAY','Финансовый рентген семьи']];
const gallery=document.getElementById('gallery'),result=document.getElementById('result');
function safeId(id){return 'dash090-'+String(id).toLowerCase().replace(/_/g,'-')+'-'+Date.now().toString(36);}
function render(data){gallery.textContent='';const presets=(data&&Array.isArray(data.presets)&&data.presets.length)?data.presets:fallback.map(x=>({preset_id:x[0],title:x[1],description:'Экспертная конфигурация',required_capabilities:[],status:'AVAILABLE'}));presets.forEach(p=>{const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=p.title;const d=document.createElement('p');d.textContent=p.description;const c=document.createElement('div');c.className='caps';c.textContent=(p.required_capabilities||[]).join(' · ');const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=p.status==='AVAILABLE'?'Создать копию':'Недоступно';b.disabled=p.status!=='AVAILABLE';b.addEventListener('click',()=>clone(p,b));card.append(h,d,c,b);gallery.append(card);});}
function clone(p,b){if(!(window.google&&google.script&&google.script.run)){result.textContent='Сохранение доступно только в опубликованном Apps Script Web App.';return;}b.disabled=true;result.textContent='Создаю приватную копию…';const id=safeId(p.preset_id);google.script.run.withSuccessHandler(r=>{result.textContent='Создан dashboard: '+r.view_id+'. Конфигурация сохранена приватно.';b.disabled=false;}).withFailureHandler(e=>{result.textContent='Не удалось создать копию: '+String(e&&e.message||e);b.disabled=false;}).prhDash090ClonePreset({preset_id:p.preset_id,view_id:id,name:p.title});}
if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(render).withFailureHandler(()=>render(null)).prhDash090PublicCatalog();}else render(null);
})();
</script></body></html>
