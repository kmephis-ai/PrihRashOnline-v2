<style data-prh-local-first-data-extension-style="1">
  #lf-preview-grid[data-lf-data-route]{display:block;min-width:0}
  .lf-data-shell{display:grid;gap:14px;min-width:0}
  .lf-data-toolbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end;padding:14px;border:1px solid var(--line,#d7e1ea);border-radius:16px;background:var(--surface,#fff)}
  .lf-data-field{display:grid;gap:5px;min-width:0}.lf-data-field label{font-size:12px;font-weight:700;color:var(--muted,#5b7088)}
  .lf-data-field input,.lf-data-field select{width:100%;min-width:0;box-sizing:border-box;border:1px solid var(--line,#d7e1ea);border-radius:10px;padding:9px 10px;background:var(--surface,#fff);color:inherit}
  .lf-data-actions{display:flex;gap:8px;flex-wrap:wrap}.lf-data-button{border:1px solid var(--line,#d7e1ea);border-radius:10px;padding:9px 12px;background:var(--surface,#fff);color:inherit;font:inherit;font-weight:700;cursor:pointer}.lf-data-button.primary{background:var(--brand,#007b83);border-color:var(--brand,#007b83);color:#fff}
  .lf-data-status,.lf-data-panel,.lf-data-detail{padding:14px;border:1px solid var(--line,#d7e1ea);border-radius:16px;background:var(--surface,#fff);min-width:0}.lf-data-status[data-state="ERROR"]{border-color:#e7a09b;color:var(--bad,#b42318)}.lf-data-status[data-state="EMPTY"]{color:var(--muted,#5b7088)}
  .lf-data-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted,#5b7088);font-size:12px}.lf-data-chip{display:inline-flex;border:1px solid var(--line,#d7e1ea);border-radius:999px;padding:4px 8px;background:var(--surface,#fff)}
  .lf-data-table-wrap{overflow:auto;max-width:100%;border:1px solid var(--line,#d7e1ea);border-radius:14px;background:var(--surface,#fff)}.lf-data-table{width:100%;border-collapse:collapse;min-width:760px}.lf-data-table th,.lf-data-table td{padding:10px 12px;border-bottom:1px solid var(--line,#e6edf3);text-align:left;vertical-align:top}.lf-data-table th{font-size:12px;color:var(--muted,#5b7088);background:var(--surface-2,#f7fafc)}.lf-data-table tr:last-child td{border-bottom:0}.lf-data-amount{text-align:right!important;white-space:nowrap;font-variant-numeric:tabular-nums}.lf-data-muted{color:var(--muted,#5b7088)}
  .lf-data-pager{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.lf-data-pager-buttons{display:flex;gap:8px}.lf-data-pager button:disabled{opacity:.45;cursor:not-allowed}
  .lf-data-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lf-data-detail-item{min-width:0}.lf-data-detail-item dt{font-size:12px;color:var(--muted,#5b7088);margin-bottom:3px}.lf-data-detail-item dd{margin:0;overflow-wrap:anywhere}
  .lf-dq-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.lf-dq-card{padding:14px;border:1px solid var(--line,#d7e1ea);border-radius:14px;background:var(--surface,#fff)}.lf-dq-card strong{display:block;font-size:24px;margin-top:6px}.lf-dq-findings{display:grid;gap:8px}.lf-dq-finding{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px;border:1px solid var(--line,#d7e1ea);border-radius:12px}.lf-dq-finding[data-severity="HIGH"]{border-color:#e7a09b}.lf-dq-finding[data-severity="MEDIUM"]{border-color:#e8c778}.lf-dq-count{font-weight:800;font-variant-numeric:tabular-nums}
  @media(max-width:900px){.lf-data-toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.lf-dq-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:520px){.lf-data-toolbar{grid-template-columns:1fr}.lf-data-detail-grid,.lf-dq-grid{grid-template-columns:1fr}.lf-data-shell{gap:10px}.lf-data-status,.lf-data-panel,.lf-data-detail,.lf-data-toolbar{padding:11px}}
</style>
<script data-prh-local-first-data-extension="1.0.0">
(function(){
  'use strict';
  const DATA_ROUTES=Object.freeze(['transactions','data-quality']);
  const PAGE_SIZE=20;
  const SAFE_QUERY_KEYS=Object.freeze(['tx_page','tx_start','tx_end','tx_category','tx_account','tx_member','tx_detail']);
  const runtime=window.__PRH_LF_DATA_RUNTIME__||(window.__PRH_LF_DATA_RUNTIME__={schema:'PRH_LOCAL_FIRST_DATA_RUNTIME_V1',version:'1.0.0',renderEpoch:0,networkCalls:0,googleSheetsReads:0,canonicalWrites:0,autofixCalls:0,lastState:null});
  const grid=document.getElementById('lf-preview-grid');
  const revisionChip=document.getElementById('lf-revision-chip');
  const initialPreview=grid?grid.innerHTML:'';
  let store=null;

  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
  function privacyMode(){const raw=String(new URL(location.href).searchParams.get('privacy')||'').trim().toUpperCase();if(!raw)return 'NORMAL';return ['NORMAL','MASKED','DEMO','ZEN'].indexOf(raw)>=0?raw:'MASKED'}
  function valuesVisible(){return privacyMode()==='NORMAL'}
  function route(){return String(document.body.dataset.activeLfRoute||new URL(location.href).searchParams.get('lf_route')||'home').trim().toLowerCase()}
  function money(minor,currency){if(!valuesVisible())return '••••••';if(!Number.isSafeInteger(minor))return '—';return new Intl.NumberFormat('ru-RU',{style:'currency',currency:currency||'RUB',maximumFractionDigits:2}).format(minor/100)}
  function safeText(value,fallback){if(!valuesVisible())return 'Скрыто';const text=String(value==null?'':value).trim();return text||fallback||'—'}
  function formatDate(value){const raw=String(value||'');const date=new Date(raw);if(!Number.isFinite(date.getTime()))return raw||'—';return new Intl.DateTimeFormat('ru-RU',{year:'numeric',month:'2-digit',day:'2-digit'}).format(date)}
  function parsePositiveInt(value,fallback){const n=Number.parseInt(String(value||''),10);return Number.isSafeInteger(n)&&n>0?n:fallback}
  function currentQuery(){const u=new URL(location.href);return Object.freeze({page:parsePositiveInt(u.searchParams.get('tx_page'),1),start:String(u.searchParams.get('tx_start')||''),end:String(u.searchParams.get('tx_end')||''),category_id:String(u.searchParams.get('tx_category')||''),account_id:String(u.searchParams.get('tx_account')||''),member_id:String(u.searchParams.get('tx_member')||''),detail_id:String(u.searchParams.get('tx_detail')||'')})}
  function updateQuery(patch,mode){const u=new URL(location.href);SAFE_QUERY_KEYS.forEach(function(key){if(Object.prototype.hasOwnProperty.call(patch,key)){const value=String(patch[key]==null?'':patch[key]).trim();if(value)u.searchParams.set(key,value);else u.searchParams.delete(key)}});const state={prhLfRoute:route(),prhLfData:true};if(mode==='replace')history.replaceState(state,'',u.pathname+u.search+u.hash);else history.pushState(state,'',u.pathname+u.search+u.hash)}
  function dimensionMaps(snapshot){const labels=Object.create(null),byKind={account:[],category:[],member:[],project:[]};(snapshot.dimensions||[]).forEach(function(item){if(!item||!item.dimension_key)return;const key=String(item.dimension_key),kind=String(item.kind||''),id=String(item.dimension_id||'');labels[key]=String(item.label||id);if(byKind[kind]&&id)byKind[kind].push({id:id,label:String(item.label||id)})});Object.keys(byKind).forEach(function(kind){byKind[kind].sort(function(a,b){return a.label.localeCompare(b.label,'ru')})});return {labels:labels,byKind:byKind}}
  function labelOf(maps,kind,id){if(!id)return '—';if(!valuesVisible())return 'Скрыто';return maps.labels[kind+'|'+id]||String(id)}
  function optionList(items,selected,emptyLabel){return '<option value="">'+esc(emptyLabel)+'</option>'+items.map(function(item){return '<option value="'+esc(item.id)+'"'+(item.id===selected?' selected':'')+'>'+esc(valuesVisible()?item.label:'Скрыто')+'</option>'}).join('')}
  function txMatches(tx,q){if(q.start&&String(tx.occurred_at||'')<q.start)return false;if(q.end&&String(tx.occurred_at||'')>=q.end)return false;if(q.category_id&&String(tx.category_id||'')!==q.category_id)return false;if(q.account_id&&String(tx.account_id||'')!==q.account_id&&String(tx.destination_account_id||'')!==q.account_id)return false;if(q.member_id&&String(tx.member_id||'')!==q.member_id)return false;return true}
  function sortedTransactions(snapshot,q){return (snapshot.transactions||[]).filter(function(tx){return txMatches(tx,q)}).slice().sort(function(a,b){const ad=String(a.occurred_at||''),bd=String(b.occurred_at||'');if(ad!==bd)return ad>bd?-1:1;return String(a.transaction_id||'')>String(b.transaction_id||'')?-1:1})}
  function queryFingerprint(q){return [q.page,q.start,q.end,q.category_id,q.account_id,q.member_id,q.detail_id].join('|')}
  async function activeSnapshot(){if(!window.PrhLocalReadModelStore)throw Object.assign(new Error('DATA_LF_STORE_RUNTIME_NOT_READY'),{code:'DATA_LF_STORE_RUNTIME_NOT_READY'});if(!store){store=PrhLocalReadModelStore.createStore({indexedDB:indexedDB,IDBKeyRange:IDBKeyRange,name:'prihrash-local-first-v3'});const opened=await store.open();if(!opened||opened.status!=='OPEN')throw Object.assign(new Error('DATA_LF_STORE_REBUILD_REQUIRED'),{code:'DATA_LF_STORE_REBUILD_REQUIRED'})}const snapshot=await store.getActiveSnapshot({includeJournal:false});if(!snapshot||snapshot.status!=='READY'||snapshot.schema!=='PRH_LOCAL_READ_MODEL_V1')throw Object.assign(new Error('DATA_LF_VERIFIED_SNAPSHOT_NOT_READY'),{code:'DATA_LF_VERIFIED_SNAPSHOT_NOT_READY'});return snapshot}
  function renderStatus(state,text){grid.innerHTML='<div class="lf-data-shell"><div class="lf-data-status" data-state="'+esc(state)+'">'+esc(text)+'</div></div>';grid.hidden=false;grid.dataset.lfDataRoute=route()}
  function transactionTypeLabel(type){return ({INCOME:'Доход',EXPENSE:'Расход',TRANSFER:'Перевод',REFUND:'Возврат',ADJUSTMENT:'Корректировка'})[String(type||'').toUpperCase()]||'Операция'}
  function transactionToolbar(q,maps){return '<form class="lf-data-toolbar" id="lf-tx-filter"><div class="lf-data-field"><label for="lf-tx-start">С даты</label><input id="lf-tx-start" name="start" type="date" value="'+esc(q.start)+'"></div><div class="lf-data-field"><label for="lf-tx-end">До даты (не включая)</label><input id="lf-tx-end" name="end" type="date" value="'+esc(q.end)+'"></div><div class="lf-data-field"><label for="lf-tx-category">Категория</label><select id="lf-tx-category" name="category">'+optionList(maps.byKind.category,q.category_id,'Все категории')+'</select></div><div class="lf-data-field"><label for="lf-tx-account">Счёт</label><select id="lf-tx-account" name="account">'+optionList(maps.byKind.account,q.account_id,'Все счета')+'</select></div><div class="lf-data-field"><label for="lf-tx-member">Участник</label><select id="lf-tx-member" name="member">'+optionList(maps.byKind.member,q.member_id,'Все участники')+'</select></div><div class="lf-data-actions"><button class="lf-data-button primary" type="submit">Применить</button><button class="lf-data-button" type="button" id="lf-tx-reset">Сбросить</button></div></form>'}
  function transactionRows(items,maps){if(!items.length)return '<div class="lf-data-status" data-state="EMPTY">По выбранным фильтрам операций нет.</div>';return '<div class="lf-data-table-wrap"><table class="lf-data-table"><thead><tr><th>Дата</th><th>Тип</th><th>Категория</th><th>Счёт</th><th class="lf-data-amount">Сумма</th><th></th></tr></thead><tbody>'+items.map(function(tx){return '<tr data-tx-id="'+esc(tx.transaction_id)+'"><td>'+esc(formatDate(tx.occurred_at))+'</td><td>'+esc(transactionTypeLabel(tx.type))+'</td><td>'+esc(labelOf(maps,'category',tx.category_id))+'</td><td>'+esc(labelOf(maps,'account',tx.account_id))+'</td><td class="lf-data-amount">'+esc(money(tx.amount_minor,tx.currency))+'</td><td><button class="lf-data-button" type="button" data-lf-detail="'+esc(tx.transaction_id)+'">Подробнее</button></td></tr>'}).join('')+'</tbody></table></div>'}
  function detailHtml(tx,maps){if(!tx)return '';return '<section class="lf-data-detail" aria-label="Детали операции"><div class="lf-data-pager"><h2>Операция</h2><button class="lf-data-button" type="button" id="lf-tx-detail-close">Закрыть</button></div><dl class="lf-data-detail-grid"><div class="lf-data-detail-item"><dt>Дата</dt><dd>'+esc(formatDate(tx.occurred_at))+'</dd></div><div class="lf-data-detail-item"><dt>Тип</dt><dd>'+esc(transactionTypeLabel(tx.type))+'</dd></div><div class="lf-data-detail-item"><dt>Сумма</dt><dd>'+esc(money(tx.amount_minor,tx.currency))+'</dd></div><div class="lf-data-detail-item"><dt>Категория</dt><dd>'+esc(labelOf(maps,'category',tx.category_id))+'</dd></div><div class="lf-data-detail-item"><dt>Счёт</dt><dd>'+esc(labelOf(maps,'account',tx.account_id))+'</dd></div><div class="lf-data-detail-item"><dt>Получатель/второй счёт</dt><dd>'+esc(labelOf(maps,'account',tx.destination_account_id))+'</dd></div><div class="lf-data-detail-item"><dt>Участник</dt><dd>'+esc(labelOf(maps,'member',tx.member_id))+'</dd></div><div class="lf-data-detail-item"><dt>Контрагент</dt><dd>'+esc(safeText(tx.counterparty))+'</dd></div><div class="lf-data-detail-item"><dt>Описание</dt><dd>'+esc(safeText(tx.description))+'</dd></div><div class="lf-data-detail-item"><dt>Статус</dt><dd>'+esc(String(tx.status||'—'))+'</dd></div></dl></section>'}
  function bindTransactionUi(q,totalPages){const form=document.getElementById('lf-tx-filter');if(form)form.addEventListener('submit',function(event){event.preventDefault();updateQuery({tx_page:'1',tx_start:document.getElementById('lf-tx-start').value,tx_end:document.getElementById('lf-tx-end').value,tx_category:document.getElementById('lf-tx-category').value,tx_account:document.getElementById('lf-tx-account').value,tx_member:document.getElementById('lf-tx-member').value,tx_detail:''},'push');renderCurrent()});const reset=document.getElementById('lf-tx-reset');if(reset)reset.addEventListener('click',function(){updateQuery({tx_page:'1',tx_start:'',tx_end:'',tx_category:'',tx_account:'',tx_member:'',tx_detail:''},'push');renderCurrent()});grid.querySelectorAll('[data-lf-detail]').forEach(function(button){button.addEventListener('click',function(){updateQuery({tx_detail:button.dataset.lfDetail},'push');renderCurrent()})});const close=document.getElementById('lf-tx-detail-close');if(close)close.addEventListener('click',function(){updateQuery({tx_detail:''},'push');renderCurrent()});const prev=document.getElementById('lf-tx-prev'),next=document.getElementById('lf-tx-next');if(prev)prev.addEventListener('click',function(){updateQuery({tx_page:String(Math.max(1,q.page-1)),tx_detail:''},'push');renderCurrent()});if(next)next.addEventListener('click',function(){updateQuery({tx_page:String(Math.min(totalPages,q.page+1)),tx_detail:''},'push');renderCurrent()})}
  function renderTransactions(snapshot,epoch){const q=currentQuery(),maps=dimensionMaps(snapshot),all=sortedTransactions(snapshot,q),totalPages=Math.max(1,Math.ceil(all.length/PAGE_SIZE)),page=Math.min(q.page,totalPages),start=(page-1)*PAGE_SIZE,items=all.slice(start,start+PAGE_SIZE),detail=q.detail_id?all.find(function(tx){return String(tx.transaction_id||'')===q.detail_id})||null:null;if(epoch!==runtime.renderEpoch||route()!=='transactions')return;if(page!==q.page){updateQuery({tx_page:String(page)},'replace')}grid.dataset.lfDataRoute='transactions';grid.hidden=false;grid.innerHTML='<div class="lf-data-shell">'+transactionToolbar(Object.assign({},q,{page:page}),maps)+'<div class="lf-data-meta"><span class="lf-data-chip">Операций: '+all.length+'</span><span class="lf-data-chip">Страница '+page+' из '+totalPages+'</span></div>'+transactionRows(items,maps)+'<div class="lf-data-pager"><span class="lf-data-muted">Показано '+items.length+' из '+all.length+'</span><div class="lf-data-pager-buttons"><button class="lf-data-button" id="lf-tx-prev" type="button"'+(page<=1?' disabled':'')+'>Назад</button><button class="lf-data-button" id="lf-tx-next" type="button"'+(page>=totalPages?' disabled':'')+'>Вперёд</button></div></div>'+detailHtml(detail,maps)+'</div>';bindTransactionUi(Object.assign({},q,{page:page}),totalPages);runtime.lastState=Object.freeze({route:'transactions',status:'READY',generation_id:snapshot.generation_id,revision:snapshot.revision,query_fingerprint:queryFingerprint(q),total:all.length,page:page,page_size:PAGE_SIZE,detail_open:!!detail,networkCalls:0,googleSheetsReads:0,canonicalWrites:0})}
  function buildDataQuality(snapshot){const transactions=snapshot.transactions||[],dimensionKeys=new Set((snapshot.dimensions||[]).map(function(item){return String(item&&item.dimension_key||'')})),counts={category_dimension_missing:0,account_dimension_missing:0,member_dimension_missing:0,duplicate_source_fingerprint:0},fingerprints=Object.create(null);transactions.forEach(function(tx){if(tx.category_id&&!dimensionKeys.has('category|'+String(tx.category_id)))counts.category_dimension_missing+=1;const accountIds=[tx.account_id,tx.destination_account_id].filter(Boolean).map(String);if(accountIds.some(function(id){return !dimensionKeys.has('account|'+id)}))counts.account_dimension_missing+=1;if(tx.member_id&&!dimensionKeys.has('member|'+String(tx.member_id)))counts.member_dimension_missing+=1;const p=tx.provenance||{},fingerprint=String(p.source_fingerprint||'');if(fingerprint){if(!fingerprints[fingerprint])fingerprints[fingerprint]=[];fingerprints[fingerprint].push(String(tx.transaction_id||''))}});counts.duplicate_source_fingerprint=Object.keys(fingerprints).filter(function(key){return new Set(fingerprints[key]).size>1}).length;const findings=[{code:'CATEGORY_DIMENSION_MISSING',severity:'MEDIUM',title:'Категория не найдена в справочнике',count:counts.category_dimension_missing,action:'Проверьте синхронизацию справочника категорий для этих операций.'},{code:'ACCOUNT_DIMENSION_MISSING',severity:'HIGH',title:'Счёт не найден в справочнике',count:counts.account_dimension_missing,action:'Проверьте локальную проекцию счетов и повторите обновление данных.'},{code:'MEMBER_DIMENSION_MISSING',severity:'MEDIUM',title:'Участник не найден в справочнике',count:counts.member_dimension_missing,action:'Проверьте локальную проекцию участников семьи.'},{code:'DUPLICATE_SOURCE_FINGERPRINT',severity:'MEDIUM',title:'Совпадающий отпечаток исходной записи',count:counts.duplicate_source_fingerprint,action:'Проверьте группы операций с одинаковым отпечатком источника на возможное дублирование.'}];return Object.freeze({total:transactions.length,problem_count:findings.reduce(function(sum,item){return sum+item.count},0),findings:Object.freeze(findings)})}
  function renderDataQuality(snapshot,epoch){const dq=buildDataQuality(snapshot);if(epoch!==runtime.renderEpoch||route()!=='data-quality')return;grid.dataset.lfDataRoute='data-quality';grid.hidden=false;grid.innerHTML='<div class="lf-data-shell"><div class="lf-dq-grid"><article class="lf-dq-card"><span class="lf-data-muted">Проверено операций</span><strong>'+dq.total+'</strong></article><article class="lf-dq-card"><span class="lf-data-muted">Найдено сигналов</span><strong>'+dq.problem_count+'</strong></article><article class="lf-dq-card"><span class="lf-data-muted">Автоисправления</span><strong>0</strong></article><article class="lf-dq-card"><span class="lf-data-muted">Запись в источник</span><strong>0</strong></article></div><section class="lf-data-panel"><h2>Что стоит проверить</h2><div class="lf-dq-findings">'+dq.findings.map(function(item){return '<div class="lf-dq-finding" data-severity="'+item.severity+'"><div><strong>'+esc(item.title)+'</strong><div class="lf-data-muted">'+esc(item.action)+'</div></div><div class="lf-dq-count">'+item.count+'</div></div>'}).join('')+'</div></section><div class="lf-data-status" data-state="READY">Проверка выполняется только для чтения по текущей локальной копии. Никакие исправления автоматически не применяются.</div></div>';runtime.lastState=Object.freeze({route:'data-quality',status:'READY',generation_id:snapshot.generation_id,revision:snapshot.revision,total:dq.total,problem_count:dq.problem_count,networkCalls:0,googleSheetsReads:0,canonicalWrites:0,autofixCalls:0})}
  async function renderCurrent(){const current=route();if(DATA_ROUTES.indexOf(current)<0){if(grid&&grid.dataset.lfDataRoute){delete grid.dataset.lfDataRoute;grid.innerHTML=initialPreview}return}const epoch=++runtime.renderEpoch;renderStatus('LOADING','Загружаем проверенную локальную копию…');try{const snapshot=await activeSnapshot();if(epoch!==runtime.renderEpoch||route()!==current)return;if(current==='transactions')renderTransactions(snapshot,epoch);else renderDataQuality(snapshot,epoch)}catch(error){if(epoch!==runtime.renderEpoch||route()!==current)return;runtime.lastState=Object.freeze({route:current,status:'ERROR',reason:String(error&&error.code||'DATA_LF_RENDER_FAILED'),networkCalls:0,googleSheetsReads:0,canonicalWrites:0});renderStatus('ERROR','Локальные данные пока недоступны. Обновите данные и повторите попытку.')}}
  function boot(){if(!grid)return;const observer=new MutationObserver(function(mutations){if(mutations.some(function(item){return item.type==='attributes'&&item.attributeName==='data-active-lf-route'}))renderCurrent()});observer.observe(document.body,{attributes:true,attributeFilter:['data-active-lf-route']});if(revisionChip){new MutationObserver(function(){if(DATA_ROUTES.indexOf(route())>=0)renderCurrent()}).observe(revisionChip,{childList:true,subtree:true,characterData:true})}window.addEventListener('popstate',function(){Promise.resolve().then(renderCurrent)});renderCurrent()}
  window.__PRH_LF_DATA_EXTENSION__=Object.freeze({schema:'PRH_LOCAL_FIRST_DATA_EXTENSION_V1',version:'1.0.0',safeQueryKeys:SAFE_QUERY_KEYS,pageSize:PAGE_SIZE,render:renderCurrent,getState:function(){return Object.freeze(Object.assign({},runtime))},buildDataQuality:buildDataQuality});
  Promise.resolve().then(boot);
})();
</script>
